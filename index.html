{t:'The Animal That Survived Space',g:'Science',
p:['Under a microscope, a tardigrade looks like a tiny, chubby bear in a baggy suit. It has eight stubby legs, each ending in little claws, and it lumbers through a drop of water as if it were in no hurry at all. Most tardigrades are about the size of the period at the end of this sentence, which is why almost nobody has seen one, even though they live nearly everywhere: in moss, in soil, on mountaintops and at the bottom of the sea.',
'Their fame comes from what they can survive. When the moss they live in dries out, a tardigrade does not simply die of thirst. It pulls in its legs, curls into a dry little barrel that scientists call a tun, and lets almost all the water leave its body. Its activity slows until it can hardly be measured. In this state it can wait for years.',
'In laboratories, tardigrades in the tun state have survived being frozen to hundreds of degrees below zero. They have survived doses of radiation that would kill a person many times over.',
'In 2007, scientists sent dried tardigrades into orbit on a satellite and exposed them to the vacuum of outer space, where there is no air at all. When the tardigrades came back and were given water, many of them woke up and walked away. Some even went on to lay eggs.',
'It would be easy to call tardigrades indestructible, but that is not quite right. They are tough mainly while they are dried out and resting. An active tardigrade swimming in a drop of water is far more delicate, and it can be killed by conditions it would have shrugged off as a tun. Its real talent is not strength. It is knowing how to wait.'],
q:[{q:'What is the main idea of this passage?',a:'Tardigrades survive extreme conditions by drying out and waiting in a resting state.',d:['Tardigrades are the strongest animals on Earth at all times.','Scientists want tardigrades to live on other planets.','Tardigrades are rare animals found only at the bottom of the sea.'],e:'The passage explains the tun state and what it lets tardigrades survive, and it ends by saying their real talent is "knowing how to wait," not strength.',k:'main idea'},
{q:'According to the passage, what does a tardigrade do when the moss it lives in dries out?',a:'It curls into a dry barrel shape and lets most of its water leave its body.',d:['It swims to a new patch of wet moss.','It lays eggs and then dies.','It digs deep into the soil to find water.'],e:'Paragraph 2: it "pulls in its legs, curls into a dry little barrel... and lets almost all the water leave its body."',k:'detail'},
{q:'As used in paragraph 1, the word <em>lumbers</em> most nearly means:',a:'moves slowly and heavily',d:['cuts wood','sleeps deeply','swims quickly'],e:'The tardigrade moves "as if it were in no hurry at all," so lumbers means moving in a slow, heavy way.',k:'vocabulary'},
{q:'What can you infer from the fact that some tardigrades laid eggs after returning from space?',a:'Being in space did not stop them from being able to have young.',d:['They had been born in space.','They were a different kind of animal from the others.','They laid their eggs while still in orbit.'],e:'Laying eggs afterward shows that the trip did not destroy their ability to reproduce, not just that they stayed alive.',k:'inference'},
{q:'Why does the author say it would be easy to call tardigrades indestructible, "but that is not quite right"?',a:'To correct an exaggeration by explaining that they are tough mainly while resting',d:['To show that the space experiment failed','To argue that scientists should stop studying tardigrades','To prove that active tardigrades are stronger than dried ones'],e:'The last paragraph points out that an active tardigrade is "far more delicate." Its survival depends on the resting state.',k:'purpose'},
{q:'Which best describes how the passage is organized?',a:'It describes the animal, explains its survival trick, gives evidence of what it survives, then corrects an exaggeration',d:['It tells the life story of one tardigrade from birth to death','It compares tardigrades with bears, point by point','It presents a problem that scientists have not been able to solve'],e:'Paragraph 1 describes, paragraph 2 explains the tun, paragraphs 3 and 4 give evidence, and paragraph 5 corrects the idea that they are indestructible.',k:'organization'}]},

{t:'Seeing With Sound',g:'Science',
p:['On a summer evening, a little brown bat can catch hundreds of insects in an hour, snatching them out of the dark sky with remarkable precision. It does not find them by looking. It finds them by shouting.',
'As it flies, the bat sends out a stream of high-pitched calls, far too high for human ears to hear. When a call strikes an object, part of the sound bounces back as an echo. The bat\'s large ears catch the echo, and its brain turns the returning sound into a kind of picture. This skill is called echolocation.',
'The echoes carry a surprising amount of information. The time an echo takes to return tells the bat how far away something is: the longer the wait, the farther the object. Tiny differences between what the left ear and the right ear hear tell it which way to turn. The echo from a fluttering moth even flickers as the wings beat, which helps some bats tell a meal from a falling leaf.',
'As a bat closes in on an insect, it calls faster and faster, until the calls blur into what scientists call a feeding buzz: as many as two hundred calls in a single second. The quicker the calls, the more up to date its picture of where the insect is.',
'Not every bat hunts this way. Many large fruit bats have big eyes and a strong sense of smell, and they find their food much as a bird might. But for the insect-eaters, the night is not dark at all. It is full of echoes, and they are listening.'],
q:[{q:'What is the main idea of this passage?',a:'Many bats find their prey in the dark by listening to the echoes of their own calls.',d:['Bats have better eyesight than any other animal.','Bats catch more insects than birds do.','All bats eat both insects and fruit.'],e:'Every paragraph explains echolocation: how the calls work, what the echoes tell the bat, and how it homes in on prey.',k:'main idea'},
{q:'According to the passage, how does a bat know how far away an object is?',a:'By how long the echo takes to come back',d:['By how loud its own call is','By how large the object looks','By how strongly the object smells'],e:'Paragraph 3: "The time an echo takes to return tells the bat how far away something is."',k:'detail'},
{q:'As used in paragraph 1, the word <em>precision</em> most nearly means:',a:'exactness',d:['speed','loudness','hunger'],e:'Catching hundreds of tiny insects in the dark, one after another, takes great exactness. That is what precision means.',k:'vocabulary'},
{q:'Based on the passage, which bat would most likely have the hardest time catching insects?',a:'An insect-eating bat that could not hear',d:['An insect-eating bat with weak eyesight','An insect-eating bat hunting in a dark cave','An insect-eating bat hunting on a night with no moon'],e:'Insect-eating bats find prey by hearing echoes, not by seeing, so darkness does not matter to them but deafness would.',k:'inference'},
{q:'The author writes, "It finds them by shouting." The main purpose of this sentence is to:',a:'introduce echolocation in a surprising, memorable way',d:['show that bats are angry animals','explain why bats are noisy during the day','prove that people can hear bats'],e:'Bat calls are actually very loud, but they are too high for people to hear, so "shouting" is a surprising word. It grabs attention before paragraph 2 explains echolocation.',k:'purpose'},
{q:'What is the purpose of the last paragraph?',a:'To point out that not all bats use echolocation, and to sum up what the night is like for those that do',d:['To describe the feeding buzz in more detail','To list the steps a bat follows to catch a moth','To argue that fruit bats are smarter than insect-eaters'],e:'It notes that many fruit bats find food by sight and smell, then closes: for insect-eaters, the night "is full of echoes."',k:'organization'}]},

{t:'Counting the Thunder',g:'Science',
p:['A single bolt of lightning lasts only a fraction of a second, but in that instant it heats the air around it to about 30,000 degrees Celsius, roughly five times hotter than the surface of the sun. Air that hot expands so violently that it slams into the cooler air around it. That slam is thunder.',
'Because lightning and thunder happen at the same moment, you might expect to see and hear them together. You do not, because light and sound travel at very different speeds. The flash reaches you almost instantly. The sound plods along at about a third of a kilometer every second, or about a mile every five seconds.',
'That difference turns a storm into a measuring tool. When you see a flash, count the seconds until you hear the thunder. Divide by three to find the distance in kilometers, or by five to find it in miles. If you count fifteen seconds, the lightning struck about five kilometers, or three miles, away.',
'Weather experts use the same idea to give simple safety advice: when thunder roars, go indoors. If you can hear thunder at all, you are probably within about ten miles of the storm, and lightning can strike that far from where it is raining. Many people who are struck are caught outdoors before the rain begins or after it seems to have ended.',
'A car with a metal roof or a solid building makes a good shelter. A tree does not. Standing under one is among the worst places to be, because lightning tends to strike tall objects and can jump from the trunk to a person nearby. Counting tells you how far away the lightning is, but the safety rule is simpler still: if you can hear thunder, go inside.'],
q:[{q:'What is the main idea of this passage?',a:'The gap between lightning and thunder can tell you how far away a storm is and when to take shelter.',d:['Lightning is hotter than the surface of the sun.','Thunder is more dangerous than lightning.','Storms always arrive at the moment it starts to rain.'],e:'The passage explains why thunder comes after lightning, how to use the gap to measure distance, and what safety advice follows from it. The sun fact is only a detail.',k:'main idea'},
{q:'According to the passage, what causes thunder?',a:'Air heated by lightning expanding and slamming into cooler air',d:['Clouds bumping into each other','Rain hitting the ground very hard','Light traveling faster than sound'],e:'Paragraph 1: the heated air "slams into the cooler air around it. That slam is thunder."',k:'detail'},
{q:'As used in paragraph 2, the word <em>plods</em> most nearly means:',a:'moves slowly and steadily',d:['jumps suddenly','disappears','shines brightly'],e:'Sound is contrasted with light, which arrives "almost instantly," so plods means moving slowly.',k:'vocabulary'},
{q:'You count nine seconds between a flash and its thunder. Based on the passage, about how far away did the lightning strike?',a:'About three kilometers',d:['About nine kilometers','About forty-five kilometers','About one kilometer'],e:'Divide the seconds by three for kilometers: 9 ÷ 3 = 3. (Dividing by five gives about two miles.)',k:'inference'},
{q:'Why does the author mention that many people are struck "before the rain begins or after it seems to have ended"?',a:'To show that it is not safe to wait for rain before going indoors',d:['To prove that rain causes lightning','To explain how to measure a storm\'s distance','To show that lightning never strikes in heavy rain'],e:'Lightning can strike miles from the rain, so the sound of thunder, not the rain, is the signal to move.',k:'purpose'},
{q:'How is the passage mainly organized?',a:'It explains a scientific fact, shows how to use it, and then gives safety advice based on it',d:['It tells the story of a person struck by lightning','It compares thunderstorms in different countries','It lists myths about lightning and proves each one wrong'],e:'Paragraphs 1 and 2 explain the science, paragraph 3 turns it into a measuring tool, and paragraphs 4 and 5 give safety advice.',k:'organization'}]},

{t:'The Coral\'s Tiny Partners',g:'Science',
p:['A coral reef looks like a garden of stone, but the builders are animals. Each coral is a colony of tiny creatures called polyps, most smaller than a pencil eraser, and each polyp builds a hard cup of limestone around its soft body. Over thousands of years, billions of these cups pile up into reefs so large that some can be seen from space.',
'Corals have a secret, though. Living inside the polyps are even tinier partners: single-celled algae. Like plants, the algae use sunlight to make food, and they share much of it with the coral. In return, the coral gives the algae a safe home and the materials they need. Most reef-building corals get the greater part of their food this way. The algae also give corals much of their color.',
'This partnership has a weakness. When ocean water stays too warm for too long, the relationship breaks down, and the coral pushes the algae out. Without them, its clear tissue shows the white skeleton beneath, and the coral turns pale. Scientists call this bleaching.',
'A bleached coral is not dead yet. If the water cools again soon enough, the algae can return and the coral can recover. But a coral without its partners is starving, and if the heat lasts too long, it can die. In recent years, large areas of reef around the world have bleached during long ocean heat waves.',
'Reefs cover only a tiny part of the ocean floor, yet about a quarter of all ocean species are thought to depend on them at some point in their lives. That is why scientists are studying which corals handle heat best, and why some are growing young corals in underwater nurseries to replant damaged reefs. The health of a reef depends on a partnership too small to see.'],
q:[{q:'What is the main idea of this passage?',a:'Corals depend on tiny algae living inside them, and warm water can break that partnership.',d:['Coral reefs are made of stone, not living things.','Coral reefs can be seen from space.','Scientists have found a way to stop all bleaching.'],e:'The passage centers on the coral-algae partnership, how heat breaks it, and why that matters.',k:'main idea'},
{q:'According to the passage, what do the algae give the coral?',a:'Food made from sunlight, and much of its color',d:['A hard limestone cup','Protection from warm water','A way to move to cooler water'],e:'Paragraph 2: the algae "share much of" the food they make, and "also give corals much of their color."',k:'detail'},
{q:'As used in paragraph 3, the word <em>bleaching</em> refers to:',a:'a coral turning pale after losing its algae',d:['a coral being cleaned by fish','a reef growing taller','scientists painting coral white'],e:'The coral pushes out the algae, its white skeleton shows through, and it turns pale. "Scientists call this bleaching."',k:'vocabulary'},
{q:'Based on the passage, what would most likely happen to the fish on a reef if its corals died in a long ocean heat wave?',a:'Many would lose the place they depend on for food or shelter.',d:['Nothing would change, because fish do not use corals.','The fish would turn pale, just as the corals did.','The fish would make the water cool down again.'],e:'Paragraph 5 says about a quarter of all ocean species depend on reefs at some point in their lives, so losing the corals would take away something many fish need.',k:'inference'},
{q:'Why does the author mention that about a quarter of ocean species depend on reefs?',a:'To show why the health of reefs matters so much',d:['To prove that reefs cover most of the ocean floor','To explain how corals build their skeletons','To describe what the algae eat'],e:'Reefs are small but support a huge share of ocean life, which explains why scientists work to protect them.',k:'purpose'},
{q:'What is the relationship between paragraph 2 and paragraph 3?',a:'Paragraph 2 describes a partnership, and paragraph 3 explains how it can fail',d:['Paragraph 3 gives a second example of the same partnership','Paragraph 3 disagrees with the facts in paragraph 2','Paragraph 2 describes events that happen after paragraph 3'],e:'"This partnership has a weakness" links the two: paragraph 3 shows how heat breaks the arrangement paragraph 2 describes.',k:'organization'}]},

{t:'The Clock Inside You',g:'Science',
p:['If you have ever woken up a minute before your alarm, you have met your body clock. Deep in the brain, a tiny cluster of cells keeps time on a cycle of about twenty-four hours. It tells your body when to feel sleepy, when to feel alert, and even when to get hungry.',
'The clock does not run perfectly on its own. In experiments where volunteers lived for weeks in rooms with no windows and no clocks, most people\'s days drifted slightly longer than twenty-four hours, so they went to bed a little later each day. Something outside the body keeps the clock on schedule, and the most powerful something is light.',
'Light entering the eyes, especially the bright light of morning, resets the clock each day. As evening falls and the light fades, the brain releases a chemical called melatonin, which helps the body prepare for sleep. Bright screens late at night can delay this signal and make it harder to fall asleep.',
'The clock also explains jet lag. When a traveler flies across several time zones, the clock inside is still set to home. The body may feel sleepy in the middle of the afternoon or wide awake at three in the morning. It takes several days of new sunlight for the clock to catch up, roughly a day for each time zone crossed.',
'The timing of the clock also shifts as people grow. Many teenagers naturally feel sleepy later at night than younger children do, which is one reason some schools have moved their start times later. Keeping a regular schedule and getting outside in the morning light are the simplest ways to keep the clock running smoothly.'],
q:[{q:'What is the main idea of this passage?',a:'The body has an inner clock that light keeps on a daily schedule.',d:['Screens are the main cause of poor sleep.','Jet lag is the most serious sleep problem.','Most people need more than twenty-four hours in a day.'],e:'Each paragraph describes the body clock: what it does, how light sets it, and what happens when it is out of step.',k:'main idea'},
{q:'According to the passage, what does melatonin do?',a:'It helps the body prepare for sleep.',d:['It wakes the body up in the morning.','It resets the clock when light enters the eyes.','It makes people hungry at night.'],e:'Paragraph 3: the brain releases melatonin as light fades, "which helps the body prepare for sleep."',k:'detail'},
{q:'As used in paragraph 2, the word <em>drifted</em> most nearly means:',a:'slowly moved away from where they started',d:['floated on water','stopped completely','became much shorter'],e:'Without clocks or daylight, the volunteers\' days slowly moved later and later, "slightly longer than twenty-four hours."',k:'vocabulary'},
{q:'A traveler flies from California to New York, crossing three time zones. Based on the passage, about how long will it take the traveler\'s body clock to adjust?',a:'About three days',d:['About three hours','About twenty-four days','It will never adjust'],e:'Paragraph 4 says the clock needs "roughly a day for each time zone crossed," so three zones take about three days.',k:'inference'},
{q:'Why does the author describe the experiment in rooms with no windows or clocks?',a:'To show that the body clock needs light from outside to stay on schedule',d:['To prove that people sleep better without clocks','To explain what causes jet lag','To show that teenagers need more sleep'],e:'Without daylight, people\'s days drifted, which shows that "something outside the body," light, keeps the clock on time.',k:'purpose'},
{q:'Why does the passage open with waking up a minute before an alarm?',a:'To connect the topic to something many readers have experienced',d:['To argue that alarms are unnecessary','To state the main conclusion of the passage','To begin a story about one particular person'],e:'Starting with a familiar experience draws readers in before the passage explains the science behind it.',k:'organization'}]},

{t:'Giants in the Fog',g:'Science',
p:['The tallest living tree on Earth is a coast redwood in northern California that scientists have named Hyperion. It stands about 116 meters tall, taller than a thirty-story building. Its exact location is kept secret to protect it from visitors, who would trample the soil around its roots.',
'Coast redwoods grow only in a narrow strip along the Pacific coast, where summers are mild and the fog is thick. The fog is not just scenery. On summer days with little rain, the tall trees comb moisture out of the fog. Droplets gather on the needles and drip to the ground, watering the soil below, and the trees can also take in some water through their leaves.',
'Redwoods are also remarkably hard to kill. Their bark can be up to a foot thick and contains very little resin, the sticky, flammable substance found in many other trees, so it resists fire. After a blaze, many redwoods survive with blackened trunks and send out new green shoots. Some redwoods are more than two thousand years old.',
'Their greatest danger came from people. When loggers arrived in the 1800s, redwood was prized for its strong wood, which does not rot easily, and most of the old forests were cut down. Today only about five percent of the original old-growth redwood forest remains, much of it protected in parks.',
'Standing among them, visitors often fall silent. The trunks rise so far that the tops are lost in the mist, and the forest floor is dim and quiet, carpeted with ferns. People who come to see the tallest trees in the world often find that the hardest thing to measure is how small they feel.'],
q:[{q:'What is the main idea of this passage?',a:'Coast redwoods are giant, hardy trees whose old forests are now mostly gone.',d:['Hyperion is the tallest tree in the world.','Redwoods can grow only in foggy weather.','Logging is no longer allowed anywhere in California.'],e:'The passage covers the redwoods\' size, how they survive dry summers and fire, and how logging destroyed most of the old forests. Hyperion is one detail.',k:'main idea'},
{q:'According to the passage, how do redwoods get water on summer days with little rain?',a:'They collect moisture from the fog.',d:['They send roots down to the ocean.','They store winter rain in their bark.','They take water from nearby ferns.'],e:'Paragraph 2: the trees "comb moisture out of the fog," which drips to the soil.',k:'detail'},
{q:'As used in paragraph 3, the word <em>flammable</em> most nearly means:',a:'able to catch fire easily',d:['sticky and sweet','very hard','able to hold water'],e:'Because redwood bark has little flammable resin, "it resists fire." So flammable means easily set on fire.',k:'vocabulary'},
{q:'Based on the passage, why would it take a very long time to replace the old-growth redwoods that were cut down?',a:'Some of the old trees had been growing for hundreds or even thousands of years.',d:['Redwoods cannot grow anywhere near the ocean.','Redwood seeds are destroyed by fog.','Loggers carried away all the young trees.'],e:'Paragraph 3 says some redwoods are more than two thousand years old. A forest of trees that old cannot grow back in a person\'s lifetime.',k:'inference'},
{q:'Which word best describes the author\'s tone in the last paragraph?',a:'awed',d:['angry','humorous','doubtful'],e:'Tops "lost in the mist," a forest "dim and quiet," and people feeling small: the author writes with wonder.',k:'tone'},
{q:'How is the passage mainly organized?',a:'It introduces the tallest tree, then explains how redwoods live, how they survive, and how most of their old forests were cut down',d:['It follows one redwood from seed to today','It compares redwoods with buildings in every paragraph','It presents a problem and the steps scientists took to solve it'],e:'Paragraph 1 introduces Hyperion; paragraphs 2 to 4 cover fog, fire and logging; paragraph 5 describes being among them.',k:'organization'}]},

{t:'Clinton\'s Ditch',g:'History',
p:['In 1817, a farmer near Lake Erie who wanted to sell grain in New York City faced a hard problem. The only way east was over rough roads by wagon. Shipping a ton of goods that way cost about one hundred dollars and took weeks, which was often more than the goods themselves were worth.',
'New York\'s governor, DeWitt Clinton, proposed a daring solution: dig a canal more than 360 miles long, from the Hudson River at Albany to Lake Erie at Buffalo. Many people thought the idea was ridiculous. They called it "Clinton\'s Folly" and "Clinton\'s Ditch." At the time, the longest canal in the country was less than thirty miles long.',
'The canal was dug mostly by hand. Workers used shovels, picks and wheelbarrows, and they invented new tools as they went, including a machine for pulling up tree stumps. The land also rose more than 500 feet between the Hudson and Lake Erie, so the builders constructed dozens of locks, water-filled chambers that raise and lower boats like the steps of a staircase.',
'When the canal opened in 1825, Clinton traveled its full length by boat and poured a keg of water from Lake Erie into the Atlantic Ocean, a ceremony called the "Wedding of the Waters." The cost of shipping goods between Buffalo and New York City fell by about ninety percent.',
'The results reshaped the country. Farmers in the Midwest could suddenly sell their crops in the East, towns along the canal boomed, and New York City became the nation\'s busiest port. The "ditch" that people had laughed at turned out to be one of the most important building projects in American history.'],
q:[{q:'What is the main idea of this passage?',a:'A canal that many people doubted made shipping far cheaper and helped the country grow.',d:['DeWitt Clinton was the most popular governor in New York\'s history.','Canals were cheaper to build than roads.','Farmers in the Midwest did not want to trade with the East.'],e:'The passage moves from the shipping problem, to the doubted plan, to its huge success.',k:'main idea'},
{q:'According to the passage, what are locks?',a:'Water-filled chambers that raise and lower boats',d:['Machines for pulling up tree stumps','Gates that kept people off the canal','Tools for measuring the canal\'s length'],e:'Paragraph 3 defines locks as "water-filled chambers that raise and lower boats like the steps of a staircase."',k:'detail'},
{q:'As used in paragraph 5, the word <em>boomed</em> most nearly means:',a:'grew quickly',d:['made a loud noise','were flooded','became empty'],e:'Along with farmers selling crops and a busy port, the towns "boomed": they grew fast because of the new trade.',k:'vocabulary'},
{q:'Why did people call the canal "Clinton\'s Folly"?',a:'They thought the project was foolish and would fail.',d:['They wanted to honor the governor\'s hard work.','They thought Clinton only wanted to become famous.','They were upset that it was finished so quickly.'],e:'The passage says many people "thought the idea was ridiculous." A folly is a foolish undertaking.',k:'inference'},
{q:'Why does the author mention that the longest canal in the country was then less than thirty miles long?',a:'To show how much bigger and bolder Clinton\'s plan was than anything built before',d:['To prove that the canal failed','To explain how locks work','To describe the Wedding of the Waters'],e:'Compared with a canal under thirty miles, a 360-mile canal was a giant leap, which helps explain why people doubted it.',k:'purpose'},
{q:'How is the passage mainly organized?',a:'It describes a problem, the solution, how it was built, and what happened as a result',d:['It compares two canals point by point','It tells Clinton\'s life story from childhood','It lists arguments for and against canals'],e:'Paragraph 1 gives the problem, 2 the plan, 3 the building, 4 the opening and 5 the results.',k:'organization'}]},

{t:'Ten Days to California',g:'History',
p:['In 1860, a letter sent from Missouri to California by stagecoach could take more than three weeks to arrive. For people in California, far from their families and from news of a country edging toward war, the wait felt endless.',
'That April, a new company promised something astonishing: mail carried across nearly 2,000 miles in about ten days. It was called the Pony Express, and it worked like a relay race. Riders galloped between stations set roughly ten to fifteen miles apart, where a fresh horse waited. Each rider covered about seventy-five to one hundred miles before handing the mail pouch to the next.',
'The riders had to be light, so the company looked for small, young men, and many were teenagers. They carried as little as possible. Letters were written on thin paper, because customers paid by weight, and at first sending a half-ounce letter cost five dollars, a large sum at the time.',
'The fastest delivery came in March 1861, when riders carried the words of President Abraham Lincoln\'s first speech as president across the West in less than eight days.',
'Yet the Pony Express lasted only about eighteen months. In October 1861, workers finished the first telegraph line across the country, and a message that took a rider ten days could now arrive in minutes. The company closed two days later. It had lost money the whole time, but the story of its riders racing across the plains has never stopped being told.'],
q:[{q:'What is the main idea of this passage?',a:'The Pony Express carried mail across the West remarkably fast, but it was soon replaced by the telegraph.',d:['Pony Express riders were mostly teenagers.','Stagecoaches were the fastest way to send mail in 1861.','The Pony Express made a great deal of money.'],e:'The passage describes how the Pony Express worked, its record run, and its quick end once the telegraph arrived.',k:'main idea'},
{q:'According to the passage, why were letters written on thin paper?',a:'Customers paid by the weight of the letter.',d:['Thick paper could not be bought in Missouri.','Thin paper was easier to read on horseback.','Riders were not allowed to carry envelopes.'],e:'Paragraph 3: letters were on thin paper "because customers paid by weight."',k:'detail'},
{q:'As used in paragraph 1, the phrase <em>edging toward</em> means:',a:'slowly moving closer to',d:['cutting the edges of','running away from','celebrating the end of'],e:'The country was moving closer and closer to war, which began in 1861.',k:'vocabulary'},
{q:'Why did the Pony Express close so soon after the telegraph line was finished?',a:'The telegraph sent messages far faster, so the riders were no longer needed.',d:['The riders had grown too old to ride.','The horses were sold to the army.','Customers had stopped writing letters.'],e:'A message that took a rider ten days could now arrive in minutes. The company closed two days after the line was finished.',k:'inference'},
{q:'Why does the author compare the Pony Express to a relay race?',a:'To help the reader picture how riders and horses passed the mail along in stages',d:['To show that the riders raced against each other','To explain why the company lost money','To prove that the riders were athletes'],e:'In a relay, each runner carries the baton part of the way and hands it on, just as each rider handed on the mail pouch.',k:'purpose'},
{q:'The passage ends by saying the company "had lost money the whole time," but its story "has never stopped being told." This ending mainly:',a:'contrasts its failure as a business with its lasting fame',d:['explains why the telegraph was invented','lists the steps a rider followed','argues that the company should have charged more'],e:'The word "but" sets two facts side by side: it failed to make money, yet it is still remembered.',k:'organization'}]},

{t:'When Every Town Had Its Own Noon',g:'History',
p:['Before the 1880s, time in the United States was a local matter. Each town set its clocks by the sun, calling it noon when the sun was highest in its own sky. Because the sun appears to move from east to west, noon in Boston arrived about twelve minutes earlier than noon in New York City. There were hundreds of local times across the country.',
'For most of history this caused few problems. A person traveling on horseback moved so slowly that a few minutes\' difference between towns hardly mattered. The railroads changed that. Trains crossed dozens of towns in a single day, and each railroad ran its trains by its own clock. A station might display several clocks at once, each showing a different time, and travelers struggled to know when their train would really leave.',
'Confusing schedules were more than an annoyance. When two trains share a track, both crews must agree on exactly when each will be where. A difference of a few minutes could mean a crash.',
'On November 18, 1883, the railroads took matters into their own hands. They divided the country into four time zones, and on that day stations across the country reset their clocks to the new standard time. People called it "the day of two noons," because in many places the clocks struck twelve, were turned back, and struck twelve again.',
'Not everyone was pleased. Some people complained that the railroads had no right to change the time the sun had set, and a few towns refused to go along for years. It was not until 1918 that the United States government made time zones official by law. Today few people give time zones a second thought, except when a long trip leaves them hungry for dinner at breakfast time.'],
q:[{q:'What is the main idea of this passage?',a:'Railroads created time zones to replace a confusing system of local times.',d:['Boston and New York City have always shared the same time.','The government forced the railroads to use time zones in 1883.','People in the 1800s traveled mostly on horseback.'],e:'The passage explains local sun time, why railroads made it a problem, and the time zones they created. (The government acted only in 1918.)',k:'main idea'},
{q:'According to the passage, why did noon arrive earlier in Boston than in New York City?',a:'The sun appears to move from east to west, so it was highest over Boston first.',d:['Boston\'s clocks were broken.','New York City set its clocks by the railroads.','The sun rises later in Boston.'],e:'Paragraph 1: "Because the sun appears to move from east to west, noon in Boston arrived about twelve minutes earlier."',k:'detail'},
{q:'As used in paragraph 4, the phrase <em>took matters into their own hands</em> means the railroads:',a:'solved the problem themselves without waiting for anyone else',d:['built new clocks by hand','handed control to the government','stopped running trains'],e:'The railroads made time zones on their own; the government did not act until 1918.',k:'vocabulary'},
{q:'Why did differences in local time matter more once railroads were built?',a:'Trains moved fast enough to pass through many towns with different times in one day.',d:['Trains always ran at night.','Horses could no longer travel between towns.','The sun moved differently after 1880.'],e:'On horseback, a few minutes hardly mattered. A train crossing dozens of towns a day made the differences pile up.',k:'inference'},
{q:'Why does the author include the fact that a few minutes\' difference could mean a crash?',a:'To show that the problem was dangerous, not just inconvenient',d:['To prove that trains were unsafe','To explain how clocks work','To describe the day of two noons'],e:'Paragraph 3 opens, "Confusing schedules were more than an annoyance," and the crash detail shows why.',k:'purpose'},
{q:'How is the passage mainly organized?',a:'It describes an old system, the problem it caused, and the solution that replaced it',d:['It compares two cities, point by point','It tells the life story of an inventor','It lists the four time zones from east to west'],e:'Local sun time (paragraph 1), the railroad problem (2 and 3), time zones (4) and how people reacted (5).',k:'organization'}]},

{t:'Six Dots',g:'Biography',
p:['Louis Braille was three years old when he wandered into his father\'s leather workshop in a small French village and picked up a sharp tool. It slipped and injured his eye. An infection followed and spread to his other eye, and by the age of five he was completely blind.',
'At ten, he won a place at a school for blind children in Paris. The school had books, but they were printed in huge raised letters that readers traced with their fingers. The books were so heavy and slow to read that a single story could fill several volumes, and students had no way to write in the system at all.',
'When Louis was twelve, a former soldier named Charles Barbier visited the school. He had created a code of raised dots, sometimes called "night writing," that could be felt in the dark. Barbier\'s code was clever but clumsy: its symbols stood for sounds rather than letters, and a single symbol could need twelve dots, too many to feel with one fingertip.',
'Louis spent the next three years improving it. By fifteen, he had created a system in which every letter fit in a cell of just six dots, arranged in two columns of three. A fingertip could feel a whole cell at once. He later added cells for numbers, punctuation and even music.',
'The school\'s directors were slow to accept the system, and for years students learned it on their own, sometimes in secret. Braille himself became a teacher at the school. He died in 1852, two years before the school officially adopted his code. Today it is used by blind readers around the world, in books, on elevator buttons and on medicine labels. The boy who lost his sight in his father\'s workshop gave millions of people a way to read.'],
q:[{q:'What is the main idea of this passage?',a:'Louis Braille created a simple dot system that let blind people read and write.',d:['Charles Barbier invented the system blind people use today.','Blind students in Paris had no books at all.','Louis Braille\'s accident happened in his father\'s workshop.'],e:'The passage tells how Braille lost his sight, improved on Barbier\'s code, and created the six-dot system used worldwide.',k:'main idea'},
{q:'According to the passage, what problem did Barbier\'s code have?',a:'A symbol could need too many dots to feel with one fingertip.',d:['It could be read only in daylight.','It used raised letters that were too heavy.','It had no symbols for sounds.'],e:'Paragraph 3: "a single symbol could need twelve dots, too many to feel with one fingertip."',k:'detail'},
{q:'As used in paragraph 5, the word <em>adopted</em> most nearly means:',a:'officially accepted and began to use',d:['took into a family','printed','argued against'],e:'The school "officially adopted his code" two years after he died: it accepted the code as its own system.',k:'vocabulary'},
{q:'The detail that students learned the system "on their own, sometimes in secret" suggests that:',a:'students found the system valuable even before the school approved it',d:['students were not allowed to read at all','the system was too hard for most students','Braille wanted to keep his system a secret'],e:'Students used it without permission because it worked for them, long before the directors accepted it.',k:'inference'},
{q:'The author\'s attitude toward Louis Braille is best described as:',a:'admiring',d:['critical','amused','uninterested'],e:'The closing line, that he "gave millions of people a way to read," praises what he achieved.',k:'tone'},
{q:'How is the passage organized?',a:'In time order, from Braille\'s childhood to how his code is used today',d:['As a comparison of two inventors','As a list of problems with no solutions','As an argument for building new schools'],e:'It moves from age three, to ten, twelve and fifteen, to his death in 1852, and then to today.',k:'organization'}]},

{t:'The Girl Who Found a Sea Dragon',g:'Biography',
p:['In the early 1800s, the cliffs near the English seaside town of Lyme Regis were always crumbling. Winter storms tore away chunks of rock, and with the rock came strange stone shapes: spirals, bones and teeth. Most people called them curiosities. A girl named Mary Anning called them a living.',
'Mary\'s family was poor. Her father, a carpenter, sold fossils to tourists as a side business, and he taught Mary and her brother how to find them. When he died in 1810, the family was left in debt, and fossil hunting became their way to survive. Mary was eleven.',
'Soon afterward, her brother spotted a large skull in the cliff. About a year later, after more rock had fallen, Mary found the rest of the skeleton: a creature more than five meters long, with a long snout full of teeth, paddle-like limbs and a body shaped like a dolphin\'s. It was an ichthyosaur, a sea reptile from the age of the dinosaurs. Few people had ever seen anything like it.',
'Mary went on to make more remarkable finds, including the first nearly complete skeleton of a plesiosaur, a sea reptile with a tiny head on a very long neck. Scientists traveled to Lyme Regis to consult her, and some visitors said she knew more about fossils than the experts did.',
'Yet Mary was rarely given credit. Scientific societies of the time did not admit women, and men who bought her fossils often described them in papers without mentioning her name. Only in recent years has her work been widely celebrated. Many people believe she inspired the tongue twister "She sells seashells by the seashore," though no one can prove it.'],
q:[{q:'What is the main idea of this passage?',a:'Mary Anning made important fossil discoveries but received little credit in her lifetime.',d:['Fossils are found only in the cliffs of Lyme Regis.','Mary Anning\'s father was a famous scientist.','The tongue twister "She sells seashells" was written about Mary Anning.'],e:'The passage describes her finds and expertise, then explains that she was rarely credited.',k:'main idea'},
{q:'According to the passage, who first spotted the ichthyosaur\'s skull?',a:'Mary\'s brother',d:['Mary\'s father','A visiting scientist','A tourist'],e:'Paragraph 3: "her brother spotted a large skull in the cliff." Mary found the rest of the skeleton later.',k:'detail'},
{q:'As used in paragraph 4, the word <em>consult</em> most nearly means:',a:'ask for advice or information',d:['argue with','hire','buy fossils from'],e:'Scientists traveled to her because of how much she knew about fossils: they wanted her knowledge.',k:'vocabulary'},
{q:'The sentence "A girl named Mary Anning called them a living" means that Mary:',a:'saw the fossils as a way to earn money',d:['believed the fossils were still alive','thought the fossils were worthless','planned to collect fossils only for fun'],e:'To "make a living" is to earn money. Paragraph 2 confirms that fossil hunting was how her family survived.',k:'inference'},
{q:'Why does the author mention that men described her fossils "without mentioning her name"?',a:'To show one reason Mary was rarely given credit',d:['To prove that Mary could not write','To explain how fossils form','To show that the men found the fossils first'],e:'Paragraph 5 lists reasons she was overlooked: societies barred women, and buyers left her name out.',k:'purpose'},
{q:'Paragraph 5 begins with "Yet." This word signals that the paragraph will:',a:'show a contrast between her achievements and how she was treated',d:['describe another fossil she found','give the date of her death','repeat the ideas from paragraph 4'],e:'Paragraph 4 shows scientists relying on her. "Yet" turns to the unfair part: she was rarely credited.',k:'organization'}]},

{t:'The Fastest Woman in the World',g:'Biography',
p:['Wilma Rudolph was born in Tennessee in 1940, the twentieth of twenty-two children. She was small and often sick, and before she turned five she caught polio, a disease that badly weakened her left leg. Doctors said she might never walk normally again.',
'Her family refused to accept that. Every week her mother took her on a bus to a hospital about fifty miles away for treatment. At home, her brothers and sisters took turns massaging her leg several times a day. For years Wilma wore a heavy metal brace. By the time she was twelve, she had taken it off for good.',
'Once she could run, she seemed determined to make up for lost time. She became a basketball star in high school, and a college track coach who saw her play invited her to train with his team. At sixteen, she won a bronze medal in a relay race at the 1956 Olympics.',
'Four years later, at the 1960 Olympics in Rome, Wilma Rudolph won three gold medals: in the 100 meters, the 200 meters and the relay. She was the first American woman to win three gold medals in track and field at a single Olympics, and newspapers called her the fastest woman in the world.',
'When she returned home to Clarksville, the town planned a celebration in her honor. Wilma insisted that it be open to everyone, Black and white. At a time when her town was segregated, the parade and banquet held for her are remembered as the first events in the town\'s history where Black and white residents celebrated together.'],
q:[{q:'What is the main idea of this passage?',a:'Wilma Rudolph overcame a childhood illness to become an Olympic champion.',d:['Polio was a common disease in Tennessee.','Wilma Rudolph was a basketball star.','Clarksville held its first parade in 1960.'],e:'The passage follows Rudolph from polio and a leg brace to three Olympic gold medals.',k:'main idea'},
{q:'According to the passage, how did Wilma\'s brothers and sisters help her?',a:'They took turns massaging her leg.',d:['They drove her to the Olympics.','They coached her in track.','They made her metal brace.'],e:'Paragraph 2: "her brothers and sisters took turns massaging her leg several times a day."',k:'detail'},
{q:'As used in paragraph 5, the word <em>segregated</em> means:',a:'divided so that Black and white people were kept apart',d:['crowded with visitors','far from any city','celebrating a holiday'],e:'Wilma insisted the celebration be "open to everyone, Black and white," which was unusual because the town kept the races apart.',k:'vocabulary'},
{q:'What does the phrase "determined to make up for lost time" suggest about Wilma?',a:'She wanted to do all the active things her illness had kept her from doing.',d:['She was often late for practice.','She wished she had worn the brace longer.','She did not enjoy running.'],e:'After years in a brace, she threw herself into basketball and track.',k:'inference'},
{q:'Why does the author include the last paragraph about the celebration in Clarksville?',a:'To show that Wilma used her fame to bring people together',d:['To describe the food at the banquet','To explain how she trained for the Olympics','To show that her town did not support her'],e:'She insisted the celebration include everyone, turning her victory into an event that brought the town together.',k:'purpose'},
{q:'How does paragraph 2 relate to paragraph 1?',a:'Paragraph 1 presents a problem, and paragraph 2 shows how her family helped her overcome it',d:['Paragraph 2 repeats the same facts in different words','Paragraph 2 describes events that happened before paragraph 1','Paragraph 2 argues that the doctors were right'],e:'Paragraph 1 ends with the doctors\' warning; paragraph 2 begins, "Her family refused to accept that."',k:'organization'}]},

{t:'The Recital',g:'Fiction',
p:['Nina\'s hands had been fine all week. They had played the piece forty times, maybe fifty, in the living room while the dog slept under the piano bench. They had played it for Grandma over the phone. They had played it in the dark once, just to prove they could.',
'Now, backstage, they were two strangers. They shook. They were cold, then sweaty, then cold again. Nina pressed them flat against her skirt and watched a boy in a bow tie finish a song about a windmill, bowing so low that his glasses slid down his nose.',
'"Nina Okafor," said the teacher, and the stage stretched out in front of her like an empty parking lot at night: wide and bright and much too quiet.',
'She sat. The bench was higher than the one at home. Somewhere in the dark a baby made a small, curious sound. Nina looked down at the keys and, for one terrible second, could not remember how the piece began.',
'Then her left hand moved all on its own to the low C, the way it had forty or fifty times before, and her right hand followed it like a younger sister who does not want to be left behind. The first notes came out a little too loud. The next ones came out right.',
'When it was over, she stood and bowed and could not remember a single moment of the middle. Her mother told her later that she had played it perfectly. Nina was not sure that was true. But she knew that her hands had remembered when she could not, and that seemed like something worth practicing for.'],
q:[{q:'What is the main idea of this story?',a:'Nina\'s practice carries her through a performance even when fear makes her forget.',d:['Nina decides never to perform in public again.','The boy in the bow tie plays better than Nina.','Nina\'s grandmother teaches her the piece over the phone.'],e:'Nina freezes, but her hands start the piece on their own "the way it had forty or fifty times before," and she realizes practice made that possible.',k:'main idea'},
{q:'What happens right after Nina sits down at the piano?',a:'For a moment she cannot remember how the piece begins.',d:['She plays the piece too softly.','She asks the teacher for the music.','She hears her mother call her name.'],e:'Paragraph 4: "for one terrible second, [she] could not remember how the piece began."',k:'detail'},
{q:'The author writes that Nina\'s hands "were two strangers." This means her hands:',a:'did not feel or act like her own',d:['belonged to someone else in the room','were covered by gloves','had never touched a piano before'],e:'The hands that had played perfectly all week now shook and went cold and sweaty. Nervousness made them feel like someone else\'s.',k:'figurative'},
{q:'At the end, why does Nina feel that all her practice was worth it?',a:'Practice let her hands play the piece even when her mind froze.',d:['Her mother promised her a reward.','She wanted to beat the boy in the bow tie.','She was sure she had played it perfectly.'],e:'"Her hands had remembered when she could not." That is what all the practice gave her. (She was not sure she had played perfectly.)',k:'inference'},
{q:'Which word best describes Nina\'s mood backstage in paragraph 2?',a:'nervous',d:['joyful','bored','angry'],e:'Shaking hands that go cold, then sweaty, then cold again show nerves.',k:'tone'},
{q:'The story begins by describing how well Nina\'s hands played all week. Why does the author start this way?',a:'To set up a contrast with how her hands behave backstage',d:['To show that Nina practiced too much','To explain how to play the piano','To introduce the boy in the bow tie'],e:'Paragraph 1 shows her hands playing perfectly, even in the dark. Paragraph 2 opens, "Now, backstage, they were two strangers." The calm start makes the change stand out.',k:'organization'}]},

{t:'The Boat in the Garage',g:'Fiction',
p:['For as long as Sam could remember, there had been a boat in Grandpa Joe\'s garage. It was not a real boat yet. It was a skeleton of curved wooden ribs, sanded smooth, resting on two sawhorses under a sheet that smelled of dust and varnish.',
'"When will it be finished?" Sam asked every summer. "When it\'s ready," Grandpa said every summer, which was not an answer, and they both knew it.',
'The summer Sam turned eleven, Grandpa\'s hands had begun to shake. He could still hold a cup of coffee, but not a chisel. One morning he pulled the sheet off the boat, looked at it for a long time, and handed Sam a piece of sandpaper.',
'They worked through July. Grandpa sat on an overturned bucket and gave directions, and Sam did the rest: bending the thin planks, fitting them to the ribs, rubbing in oil until his arms ached. Some days Grandpa told stories about the lake where he had learned to row as a boy, and some days he said nothing at all and just watched, nodding when something was done right.',
'In August they carried the boat to the lake behind the church. It sat low in the water and leaked a little at the front. Sam rowed while Grandpa sat in the back with his hat pulled down against the sun.',
'Halfway across, Grandpa trailed his fingers in the water and said, "It was never going to be ready until you were." Sam kept rowing. He did not trust himself to say anything, so he pulled the oars and listened to the water running along the sides of the boat they had built.'],
q:[{q:'What is the main idea of this story?',a:'A boy and his grandfather finish a boat together, and the work becomes a way of passing something on.',d:['Sam learns that boats are too hard for children to build.','Grandpa Joe is upset that the boat leaks.','Sam wants to sell the boat once it is finished.'],e:'Grandpa guides and Sam builds, and Grandpa\'s last line shows the boat was waiting for Sam all along.',k:'main idea'},
{q:'According to paragraph 3, what could Grandpa still hold once his hands began to shake?',a:'A cup of coffee',d:['A chisel','The oars','A paintbrush'],e:'Paragraph 3: "He could still hold a cup of coffee, but not a chisel." That is why he handed the work to Sam.',k:'detail'},
{q:'As used in paragraph 1, the word <em>skeleton</em> most nearly means:',a:'a frame without its outer parts',d:['the bones of an animal','a scary decoration','a finished boat'],e:'The boat was only "curved wooden ribs": the frame, without the planks that would cover it.',k:'vocabulary'},
{q:'What does Grandpa mean when he says, "It was never going to be ready until you were"?',a:'He had been waiting for Sam to be old enough to help finish it.',d:['The boat needed more time to dry.','Sam had been too slow at rowing.','He did not think the boat would float.'],e:'His answer "when it\'s ready" was about Sam all along: the boat could be finished once Sam could build it with him.',k:'inference'},
{q:'Which word best describes the tone of the last paragraph?',a:'tender',d:['funny','angry','fearful'],e:'Grandpa\'s quiet words and Sam, too moved to speak, rowing on: the ending is gentle and full of feeling.',k:'tone'},
{q:'Paragraph 2 says Sam asked the same question and got the same answer "every summer." Why does the author include this detail?',a:'To show that the boat had waited unfinished for many summers',d:['To show that Sam was rude to his grandfather','To explain how to build a boat','To introduce a new character'],e:'"Every summer" shows the same exchange happening year after year, which sets up the summer when things finally change.',k:'organization'}]},

{t:'The Substitute',g:'Fiction',
p:['Mr. Delgado, our regular teacher, had warned us about the substitute. "Her name is Ms. Pruitt," he said on Thursday, "and she is the strictest teacher in the district. Please behave. I would like to still have a job on Monday."',

// ===== MODEL ESSAYS =====
// Written at the level a strong fifth grader can actually reach: plain words,
// one real moment per reason, no borrowed vocabulary. Each paragraph carries
// notes explaining WHY it works, so the model teaches rather than intimidates.
const MODELS=[
{kind:'person',prompt:'Who is someone you look up to the most in this world? Explain why.',
 why:'It picks an unexpected person, and every paragraph proves the point with something that actually happened instead of describing him with adjectives.',
 paras:[
 {t:'The person I look up to most is Mr. Okafor, who cleans our school. I look up to him because he notices things that nobody asks him to notice.',
  n:['The opening answers the question in the first sentence. No warm-up, no "there are many people in this world."','The second sentence gives the reason the whole essay will prove. Now the reader knows where this is going.']},
 {t:'In September a boy named Dev sat by himself at lunch every day for two weeks. Teachers walked past him. I walked past him. Mr. Okafor started wiping the table next to Dev at the same time every day, and he would say something about the weather or about the soup, and after a while Dev started answering. By October Dev was sitting with us. Mr. Okafor never told anyone he did that.',
  n:['This is one specific moment with a date, a name and a place. That is what makes it believable.','"I walked past him" is honest. Admitting your own part makes a reader trust you.','The last sentence lands the point without announcing it. He does not write "this shows he is kind."']},
 {t:'He also fixes things before anyone reports them. Our classroom door used to stick so hard that the smallest kids needed help, and one morning it just opened easily. Nobody had told him. He had watched us struggle with it and decided that was enough of a reason.',
  n:['A second reason, and again a real example rather than a general statement.','"Nobody had told him" repeats the essay\'s idea — noticing without being asked — which ties the paragraphs together.']},
 {t:'I used to think that people you look up to are the ones who win things. Mr. Okafor has not won anything that I know of. He just pays attention, every single day, to people who are easy to walk past. That is harder than winning, and I want to be better at it.',
  n:['The closing says what the examples add up to. It does not introduce a new story.','It ends with what the writer takes from it, which gives the essay a reason to exist.']}]},

{kind:'narrative',prompt:'Describe a time you worked hard at something difficult. What happened?',
 why:'It tells one story from start to finish and is honest about the ugly middle, which is what makes the ending feel earned.',
 paras:[
 {t:'Last year I could not run the mile. Not slowly, not badly, not at all. I walked most of it and finished last, and in October our gym teacher said we would run it again in April.',
  n:['It starts inside the problem instead of explaining that the writer is about to describe a problem.','The short repeated phrases ("Not slowly, not badly, not at all") give the writing a voice.','The last sentence sets a deadline, which gives the story a shape.']},
 {t:'I started running on Tuesdays and Thursdays with my dad on the path behind the library. The first week I had to stop four times. My legs were not even the problem. The problem was that my throat burned and I was sure something was wrong with me, and my dad kept saying that was just what it feels like at the beginning.',
  n:['Specific days and a specific place. "Tuesdays and Thursdays behind the library" is far stronger than "I practiced a lot."','Admitting that she stopped four times makes the improvement later mean something.']},
 {t:'It stayed hard for a long time. In January I was still slower than I wanted, and I skipped two weeks because it was cold and because I did not want to find out that I had not improved. Then I went back, because my dad went out to the path anyway and waited.',
  n:['This is the paragraph most students leave out. Quitting for two weeks is the honest part of the story.','The reason she returns is small and human. She does not suddenly become determined.']},
 {t:'In April I ran the whole thing without walking. My time was eleven minutes and two seconds, which was not close to the fastest in my class. I did not care about that at all. I cared that I had found out what my throat burning actually meant, which was nothing, and that I had been wrong about myself in a way I could fix.',
  n:['A real number makes the ending concrete.','Naming what she did NOT care about is more convincing than claiming she was proud.','The final line answers "what happened" at a deeper level than the finish time.']}]},

{kind:'place',prompt:'If you could move anywhere in the world, where would it be and why?',
 why:'It chooses a specific place for reasons only this writer could give, using details from her own senses rather than facts from a website.',

  n:['Names the exact place, not "somewhere warm" or "another country."','The reason is unusual and specific. Boredom is something a fifth grader can write about honestly.']},
 {t:'Her house has a flat roof, and in the evening the whole family goes up there because it is cooler than inside. You can see other roofs with other families on them. Somebody is always calling something across to somebody else. Once a monkey walked along the wall and took a mango out of a bowl, and my grandmother yelled at it in Malayalam and it left, and everyone laughed for about ten minutes.',
  n:['The roof detail is something you can only know by having been there.','The monkey story is one moment, told quickly, and it does the work of an entire paragraph of description.']},
 {t:'The other reason is the rain. In June it rains so hard that it sounds like the roof is being hit with rice. It rains for hours and nobody is upset about it, and nobody cancels anything. Where I live now, rain means practice is off and everyone is disappointed.',

 {t:'I know that moving there would mean leaving my school and my friends, and that living somewhere is not the same as visiting it for three weeks in the summer. But if I could pick one place to wake up in every day, it would be a place where the evening happens on the roof, with everybody in it.',
  n:['Admitting the drawback makes the writer sound thoughtful rather than dreamy.','The closing returns to the roof image, so the essay ends where it was strongest.']}]},

{kind:'opinion',prompt:'What is one rule you would change, and why?',
 why:'It argues one narrow point, gives reasons in order of strength, and answers the objection before the reader can raise it.',

 {t:'The rule exists because two years ago the cafeteria got so loud that the teachers could not hear each other. I understand that. But silent lunch treats everybody the same for something that about six people were doing, and it happens every single Friday whether the week was loud or quiet.',

 {t:'There is also a cost that I do not think the adults see. Dev, who is new, joined our table by talking to us at lunch. On Fridays there is no way for a new person to join anything. They just sit down and eat and leave, and nothing changes for them all day.',
  n:['This is the strongest reason, so it comes last. It moves from the writer to somebody else, which raises the stakes.']},
 {t:'I would replace silent lunch with a warning system: if the room gets too loud, the last five minutes go silent. Then the quiet is a consequence instead of a schedule, and it would probably work better, because we would actually be trying not to earn it.',

{kind:'reflection',prompt:'Tell about a time you changed your mind about something.',
 why:'It shows the writer being wrong on purpose, which takes nerve, and it explains what changed rather than only announcing that something did.',

 {t:'He was not stuck-up. He had moved here in August from a school in a different country, and he was working harder than any of us just to keep up in a language he had only spoken at home. I had watched him do that for a month and decided he was rude.',

];
// Every prompt maps to the model whose shape it shares.
const PROMPT_KIND=['person','place','person','narrative','person','opinion','place','reflection','opinion','person','opinion','narrative','reflection','reflection','place','narrative','opinion','narrative'];
const modelFor=i=>MODELS.find(m=>m.kind===PROMPT_KIND[i%PROMPT_KIND.length])||MODELS[0];

// ===== PARENT REVIEW =====
const RUBRIC=[
 {h:'Does it answer the question that was asked?',s:'Reread the prompt out loud, then the first paragraph. A strong essay answers in its first two sentences.',w:'It circles the topic without ever taking a position, or it answers a different, easier question.'},
 {h:'Is it organized?',s:'An opening that states the answer, two or three middle paragraphs that each do one job, and a closing that adds nothing new.',w:'One long block, or paragraphs that could be shuffled without anyone noticing.'},
 {h:'Is it specific?',s:'At least one moment you can picture: a name, a place, a number, something somebody said. This is the single biggest difference between essays.',w:'Adjectives doing all the work. "She is very kind and generous and always helps everyone."'},
 {h:'Does it sound like her?',s:'Words she would actually use. A plain sentence in her own voice beats a fancy one she borrowed.',w:'Vocabulary that does not fit the rest of the writing, or a stiff, formal tone she never uses out loud.'},
 {h:'Is it clean enough?',s:'Capital letters, end punctuation, no missing words. Handwriting a stranger can read.',w:'Errors so frequent that the reader is decoding instead of reading. A few spelling slips in 30 minutes are normal and fine.'}];
const PARENT_QS=[
 'Read me your favourite sentence. Why that one?',
 'Which of your reasons felt strongest, and which one felt thin?',
 'If you had five more minutes, what would you have added?'];
const PARENT_HOWTO=`
<p><b>Praise something specific first.</b> Not "this is good," but "the part where the door just opened one morning — that was the best sentence." She will write more of whatever you name.</p>
<p><b>Pick one thing to work on.</b> Only one, even if you see five. The next essay is for the next thing.</p>
<p><b>Do not correct spelling out loud line by line.</b> The essay is unscored and schools know it was handwritten in 30 minutes under pressure. Organization and specific detail matter far more than a misspelled word.</p>
<p><b>Ask before you tell.</b> The three questions above usually get her to find the weak paragraph herself, which sticks better than being told.</p>`;

// Grade-level content, harder reasoning: every item needs two or more steps, and

const pos=v=>typeof v==='number'?v>0:true;
const posList=a=>a.filter(v=>typeof v!=='number'||v>0);
const watch=s=>`<br><b>Watch out:</b> ${s}`;
const clock=m=>{m=((m%1440)+1440)%1440;const h24=Math.floor(m/60),mm=m%60;const ap=h24<12?'a.m.':'p.m.';const h=h24%12===0?12:h24%12;return `${h}:${String(mm).padStart(2,'0')} ${ap}`};
const hm=m=>m<60?`${m} minutes`:`${Math.floor(m/60)} hour${Math.floor(m/60)>1?'s':''}${m%60?' '+(m%60)+' minutes':''}`;

// ---- figures ----
function svgLShape(W,H,w,h,lab){ // notch cut from the top-right corner
  const sc=Math.min(190/W,120/H),ox=48,oy=26,X=v=>ox+v*sc,Y=v=>oy+v*sc;
  const pts=[[0,0],[W-w,0],[W-w,h],[W,h],[W,H],[0,H]];
  let s=`<polygon points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="var(--figfill)" stroke="var(--ink)" stroke-width="2"/>`;
  const t=(x,y,txt,anc)=>s+=`<text x="${x}" y="${y}" text-anchor="${anc||'middle'}" class="ft">${txt}</text>`;
  if(lab.top)t(X((W-w)/2),Y(0)-8,lab.top);
  if(lab.nv)t(X(W-w)+6,Y(h/2)+4,lab.nv,'start');
  if(lab.nh)t(X(W-w/2),Y(h)-8,lab.nh);
  if(lab.right)t(X(W)+6,Y(h+(H-h)/2)+4,lab.right,'start');
  if(lab.bottom)t(X(W/2),Y(H)+20,lab.bottom);
  if(lab.left)t(X(0)-6,Y(H/2)+4,lab.left,'end');
  return SVG(Math.ceil(X(W)+70),Math.ceil(Y(H)+34),s,'A figure shaped like the letter L, with some side lengths labeled');
}
function svgExtAngle(g,e){ // triangle ABC, base extended past C
  const s=`<polygon points="30,150 205,150 115,40" fill="var(--figfill)" stroke="var(--ink)" stroke-width="2"/>
  <line x1="205" y1="150" x2="300" y2="150" stroke="var(--ink)" stroke-width="2"/>
  <text x="22" y="168" class="ft small">A</text><text x="109" y="32" class="ft small">B</text><text x="200" y="168" class="ft small">C</text>
  <text x="58" y="143" class="ft">${g}°</text><text x="110" y="70" class="ft">?</text><text x="226" y="140" class="ft">${e}°</text>
  <text x="165" y="186" text-anchor="middle" class="ft tiny">Not drawn to scale</text>`;
  return SVG(310,192,s,`Triangle ABC with angle A of ${g} degrees and an outside angle at C of ${e} degrees`);
}
function svgSpin(fracs,letters){ // unequal sections, drawn to scale
  const cx=80,cy=80,r=70;let a=-Math.PI/2,s='';const cols=['var(--bar1)','var(--bar2)','var(--bar3)','var(--bar4)','var(--bar5)'];
  fracs.forEach(([n,d],i)=>{const sweep=2*Math.PI*n/d,b=a+sweep;const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(b),y2=cy+r*Math.sin(b);const m=(a+b)/2;
    s+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${sweep>Math.PI?1:0} 1 ${x2},${y2} Z" fill="${cols[i%5]}" stroke="var(--card)" stroke-width="2"/>`;
    s+=`<text x="${cx+r*0.62*Math.cos(m)}" y="${cy+r*0.62*Math.sin(m)+5}" text-anchor="middle" class="ft halo">${letters[i]}</text>`;a=b});
  return SVG(162,162,s+`<circle cx="${cx}" cy="${cy}" r="4" fill="var(--ink)"/>`,`Spinner with ${fracs.length} unequal sections labeled ${letters.join(', ')}`);
}

const chLesson=(intro,moves,traps)=>`<p>${intro}</p><h4>How to attack these</h4><ul>${moves.map(m=>`<li>${m}</li>`).join('')}</ul><h4>The traps</h4><ul>${traps.map(m=>`<li>${m}</li>`).join('')}</ul>${tip('Harder questions are built so that a fast answer is usually a trap answer. If a choice appears after one step, check whether the question needed two.')}`;

// ================= NUMBER SENSE & LOGIC =================
T.ch_number={t:'Challenge: Number Sense & Logic',cat:'chal',lesson:chLesson(
 'These questions use ordinary numbers but ask you to reason about them: consecutive numbers, remainders, divisibility, odd and even numbers, and the largest number you can build from digits.',
 ['<b>Pick a real number to test.</b> If a number leaves remainder 4 when divided by 6, try 10. Then just do the arithmetic.','<b>Use the middle.</b> Three consecutive numbers that add to 48: the middle one is 48 ÷ 3 = 16.','<b>Odd and even follow rules.</b> Odd + even = odd. Odd + odd = even. Anything times an even number is even. Check with small numbers like 3 and 4.'],
 ['Answering with the middle number when the question asks for the largest.','Adding remainders without wrapping past the divisor.','Thinking a product is odd because one of the numbers is odd.']),
gen(){const t=R(1,5);
 if(t===1){const even=R(0,1)===1;let m=R(8,40);if(even&&m%2)m++;const st=even?2:1;const sum=3*m,big=m+st;
  return mc(`The sum of three consecutive ${even?'<b>even</b> ':''}whole numbers is ${sum}. What is the <b>largest</b> of the three numbers?`,big,[m,m-st,big+st,even?m+1:m+3],
   `The middle number is the sum divided by 3: ${sum} ÷ 3 = ${m}. The numbers are ${m-st}, ${m} and ${m+st}. Check: ${m-st} + ${m} + ${m+st} = ${sum}. The largest is <b>${big}</b>.${watch(`${m} is the middle number, not the largest.`)}`,{chk:{t:'consec',p:{m,even},a:big}})}
 if(t===2){const d=R(5,9),r=R(1,d-1);const k=R(d-r,d-r+d-2);const ans=(r+k)%d;const N=d+r;
  return mc(`When a whole number is divided by ${d}, the remainder is ${r}. What is the remainder when <b>that number plus ${k}</b> is divided by ${d}?`,ans,[r+k,r,k,(ans+1)%d||d-1],
   `Pick a number that works: ${N} ÷ ${d} = 1 remainder ${r}. Add ${k}: ${N+k} ÷ ${d} = ${Math.floor((N+k)/d)} remainder <b>${ans}</b>. Any number that fits gives the same remainder.${watch(`${r} + ${k} = ${r+k}, but a remainder must be smaller than ${d}, so it wraps around.`)}`,{chk:{t:'rem',p:{d,r,k},a:ans}})}
 if(t===3){const sets=[[4,6,8],[3,4,8],[2,9,4],[5,6,4],[3,8,16]];const [a,b,c]=pick(sets);const L=lcm(a,b);
  const good=[],inBoth=[],onlyA=[],onlyB=[];for(let v=L;v<=170;v+=L)(v%c?good:inBoth).push(v);
  for(let v=a;v<=120;v+=a)if(v%b&&v>10)onlyA.push(v);for(let v=b;v<=120;v+=b)if(v%a&&v>10)onlyB.push(v);

  for(const k of ['vr','qr','rc','ma']){const x=o.sec[k];if(!x||typeof x!=='object')continue;const y={};const c=int(x.c),t=int(x.t);

function expectedDone(){const N=SESSIONS.length;const total=daysBetween(S.start,S.test);const el=daysBetween(S.start,today());if(total<=0)return N;return Math.max(0,Math.min(N,Math.floor(el/total*N)))}
// Spread every word across the sessions, so none is ever met cold in a quiz.

const NSESS=SESSIONS.length;
const BASE_W=VOCAB.slice(0,typeof VOCAB_BASE==='number'?VOCAB_BASE:VOCAB.length);
// Harder words take turns by part of speech, so each session gets a mix. This order is fixed: changing it would reshuffle the plan.
const HARD_W=(()=>{const by={};VOCAB.slice(BASE_W.length).forEach(w=>(by[w[1]]=by[w[1]]||[]).push(w));const out=[];for(let i=0;out.length<VOCAB.length-BASE_W.length;i++)for(const p of ['adj','v','n','adv'])if(by[p]&&by[p][i])out.push(by[p][i]);return out})();
const endIn=(list,idx)=>Math.round((idx+1)*list.length/NSESS);
const sliceFor=(list,idx)=>list.slice(idx?endIn(list,idx-1):0,endIn(list,idx));
// Harder words due in sessions finished before they existed are caught up, two per session.
function newWordsFor(idx){const late=HARD_W.slice(0,idx?endIn(HARD_W,idx-1):0).filter(w=>!S.vocab[w[0]]).slice(0,2);

// ================= CHALLENGE TIER =================
// A challenge area opens once every groundwork topic has been practiced (5+

// Once open it stays open. A grown-up can open them all in Settings.
const CH_MIN_N=10,CH_MIN_EACH=5,CH_MIN_ACC=0.8;
function chMet(id){let r=0,w=0,each=true;CH_AREAS[id].pre.forEach(p=>{const s=S.topics[p];if(!s||s.r+s.w<CH_MIN_EACH)each=false;if(s){r+=s.r;w+=s.w}});const n=r+w;return {met:each&&n>=CH_MIN_N&&r/n>=CH_MIN_ACC,each,n,acc:n?r/n:0}}
function chStatus(id){const m=chMet(id);m.open=!!S.chalAll||S.chalOpen.includes(id)||m.met;return m}
function latchChal(){CH_IDS.forEach(id=>{if(!S.chalOpen.includes(id)&&chMet(id).met)S.chalOpen.push(id)})}
const chOpen=()=>CH_IDS.filter(id=>chStatus(id).open);
// Open challenge areas built on, or extending, any of these topics.
const chFor=ids=>CH_IDS.filter(c=>[...CH_AREAS[c].pre,...(CH_AREAS[c].also||[])].some(p=>ids.includes(p))&&chStatus(c).open);
const chName=id=>T[id].t.replace('Challenge: ','');
function weakTopics(k){return ALLMATH.map(id=>{const s=S.topics[id];const n=s?s.r+s.w:0;return {id,n,acc:n?s.r/n:1}}).filter(x=>x.n>=4).sort((a,b)=>a.acc-b.acc).slice(0,k).map(x=>x.id)}

// ================= PACING & FOCUS LIST =================

const PACE={verbal:35,math:55,read:60};
const qArea=q=>q.kind==='syn'||q.kind==='sc'||(T[q.topic]&&T[q.topic].cat==='verbal')?'verbal':q.pas?'read':'math';

// What to ask again: the same word, the same passage question, or a fresh question on the same topic.

// A first guess at why a question was missed. She confirms or changes it on the results screen.
function suggestTag(q,a){if(a.secs!=null&&a.secs<(qArea(q)==='verbal'?6:12))return 'rushed';if(q.chk)return 'trap';return 'know'}
// Only right answers in a later session count toward clearing an item.
function afterAnswer(q,a){const k=focusKey(q);if(!k)return;const i=S.focus.findIndex(x=>x.k===k);const sid=S.cur?(S.cur.sid||(S.cur.sid=Date.now())):0;
 if(a.ok){if(i>=0){const f=S.focus[i];if(f.sid===sid)return;f.right=(f.right||0)+1;if(f.right>=2)S.focus.splice(i,1)}return}
 if(a.pick==null)return; // an unanswered question was never really missed
 a.fk=k;a.tag=suggestTag(q,a);a.mid=Date.now().toString(36)+'-'+(++MISS_SEQ);logMiss(a.tag,k,a.mid);
 const f=i>=0?S.focus.splice(i,1)[0]:{k,miss:0};f.sid=sid;Object.assign(f,{tag:a.tag,miss:(f.miss||0)+1,right:0,date:today()});
 S.focus.unshift(f);if(S.focus.length>FOCUS_MAX)S.focus.length=FOCUS_MAX}
function logMiss(t,k,id){S.missLog.push({d:today(),t,k,id});if(S.missLog.length>400)S.missLog.splice(0,S.missLog.length-400)}
function setTag(k,mid,tag){const f=S.focus.find(x=>x.k===k);if(f)f.tag=tag;const m=S.missLog.find(x=>x.id===mid);if(m)m.t=tag}
const TAG_TIPS={know:'Re-read the lesson for that topic, then clear it from your focus list.',trap:'Before you pick, ask which mistake each wrong answer could come from. The trap answer usually appears after one step of a two-step problem.',misread:'Underline what the question asks for: "how many more", "NOT", "simplest form", "the largest".',rushed:'Slow down on the last step, and check your answer against the question before moving on.',time:'Practice moving on: circle a hard question, guess, and come back if there is time.'};

// Most recent first, lightly shuffled. Items that can no longer be built are dropped.
function focusQs(n){const out=[],dead=new Set();const order=[...shuf(S.focus.slice(0,12)),...S.focus.slice(12)];

function verbalQ(kind,idx){const pool=idx!=null?introducedWords(idx):VOCAB;

  const w=useSeen?pick(pool):pick(VOCAB);const q=kind==='syn'?synQ(w):scQ(w);if(q)return q}

// A generator returns null rather than build a question with look-alike choices;
// ask again until it gives us a clean one.
function genOne(id){for(let i=0;i<200;i++){const q=T[id].gen();if(q){q.topic=id;return q}}return null}
function mixedMath(topics,n){const out=[];for(let i=0;i<n;i++){const q=genOne(topics[i%topics.length]);if(q)out.push(q)}return shuf(out)}
function topicQs(id,n){const out=[];for(let i=0;i<n;i++){const q=genOne(id);if(q)out.push(q)}return out}

// Quantitative Reasoning leans on concepts, estimation and logic; Mathematics

const MA_TOPICS=ALLMATH.filter(id=>!['q_sense','q_logic','q_inverse'].includes(id));

function readingTest(n){const idx=shuf(PASSAGES.map((_,i)=>i));const out=[];

  out.push(...shuf([...mi,...set.filter(q=>!mi.includes(q)).slice(0,5-mi.length)]))}

// The real Quantitative Reasoning section includes hard multi-step items, so a
// third of the practice version comes from the challenge tier.
function mathTest(n,kind){if(kind==='qr'){const k=Math.round(n/3);return shuf([...mixedMath(shuf(QR_TOPICS),n-k),...mixedMath(shuf(CH_IDS),k)])}

function stretchQs(ids,k){const o=chFor(ids);return o.length?mixedMath(shuf(o),k).map(q=>(q.stretch=true,q)):[]}

 const cards=[...newW,...review];
 if(sess.type==='lesson'){const isV=T[sess.topic].cat==='verbal';
  cur.steps=[{k:'warm',title:'Word warm-up',min:5,cards},{k:'lesson',title:'Learn',min:8,topic:sess.topic},{k:'quiz',title:'Practice',min:15,qs:isV?topicQs(sess.topic,10):[...topicQs(sess.topic,10),...stretchQs([sess.topic],2)]},{k:'quiz',title:isV?'Math mix':'Verbal drill',min:8,qs:isV?mixedMath(shuf(ALLMATH.filter(id=>SESSIONS.findIndex(s=>s.topic===id)<idx)).slice(0,5)||ALLMATH,8):verbalSet(8,idx)},{k:'wrap',title:'Wrap-up',min:4}]}
