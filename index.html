 if(t===3){const had=R(30,60),price=R(3,8),q=R(2,5);const left=had-price*q;if(left<0)return this.gen();return mc(`${n} had $${had} and bought ${q} books for $${price} each. How much money does ${n} have left?`,'$'+left,['$'+(had-price),'$'+(price*q),'$'+(had-q),'$'+(left+price)],`Cost of books: ${q} × $${price} = $${price*q}. Money left: $${had} − $${price*q} = $${left}.`)}
 if(t===4){const perbox=R(6,12),boxes=R(3,8);const tot=perbox*boxes;const gave=R(5,Math.min(20,tot-5));return mc(`${n} bought ${boxes} boxes of granola bars with ${perbox} bars in each box, then gave away ${gave} bars. How many bars are left?`,tot-gave,[tot,tot+gave,perbox*boxes-perbox,boxes*gave],`Total bars: ${boxes} × ${perbox} = ${tot}. Subtract the ${gave} given away: ${tot} − ${gave} = ${tot-gave}.`)}
 if(t===5){const rows=R(4,9),per=R(5,12),tot=rows*per;const stud=tot+R(1,per-1);const need=Math.ceil(stud/per);return mc(`An auditorium has rows of ${per} seats. If ${stud} students need seats, how many rows will be used?`,need,[need-1,Math.round(stud/per*10)/10,stud-per,need+1],`${stud} ÷ ${per} = ${Math.floor(stud/per)} remainder ${stud%per}. The leftover students need one more row, so ${need} rows.`)}
 const age=R(8,12),diff=R(3,6),yrs=R(2,5);return mc(`${n} is ${age} years old. ${n}'s brother is ${diff} years older. How old will the brother be in ${yrs} years?`,age+diff+yrs,[age+diff,age+yrs,age+diff-yrs,age+diff+yrs+1],`Brother's age now: ${age} + ${diff} = ${age+diff}. In ${yrs} years: ${age+diff} + ${yrs} = ${age+diff+yrs}.`)}};

T.q_inverse={t:'Working Backwards & Inverse Operations',cat:'qr',lesson:`
<p>Addition and subtraction <b>undo</b> each other. So do multiplication and division. When a problem gives you the <em>result</em> and asks for the <em>start</em>, work backwards with the inverse operation.</p>
${table(['Problem type','Example','Solve with the inverse'],[['Unknown start','Some students were in class. 11 more arrived; now there are 17.','17 − 11 = 6'],['Unknown change','8 students were in class. More arrived; now there are 18.','18 − 8 = 10'],['Unknown group size','14 candies shared equally by 7 students.','14 ÷ 7 = 2 each'],['Unknown number of groups','18 candies, 3 to each student.','18 ÷ 3 = 6 students'],['Unknown multiplier','A large pretzel costs $3; a small one $2. How many times as much?','3 ÷ 2 = 1.5 times']])}
<p>A <b>chain</b> of steps reverses in the opposite order: "I doubled a number, then added 5, and got 17." Undo the +5 first (17 − 5 = 12), then undo the doubling (12 ÷ 2 = <b>6</b>).</p>
${tip('Check by running the steps forward with your answer: 6 doubled is 12, plus 5 is 17 ✓.')}`,
gen(){const t=R(1,5);const n=nm();
 if(t===1){const start=R(12,40),lost=R(3,11),got=R(4,15);const end=start-lost+got;return mc(`${n} had some stickers. ${n} gave away ${lost}, then received ${got} more, and now has ${end}. How many stickers did ${n} start with?`,start,[end-got+lost+lost,end-lost-got,end+lost+got,start+1],`Work backwards: ${end} − ${got} = ${end-got} (before receiving), then ${end-got} + ${lost} = ${start} (before giving away).`)}
 if(t===2){const x=R(3,12),k=pick([2,3,4]),add=R(1,9);const res=x*k+add;return mc(`${n} picked a number, multiplied it by ${k}, then added ${add}. The result was ${res}. What was the number?`,x,[res-add,Math.round(res/k),x+1,res-k-add],`Undo in reverse order: ${res} − ${add} = ${x*k}, then ${x*k} ÷ ${k} = ${x}. Check: ${x} × ${k} + ${add} = ${res} ✓`)}
 if(t===3){const small=pick([1.5,2,2.5,3,4]),times=pick([2,3,4]);const large=small*times;return mc(`A large popcorn costs ${money(large)} and a small popcorn costs ${money(small)}. How many times as much does the large popcorn cost?`,times,[times+1,Math.round(large-small),Math.round(large+small),times*2],`Divide: ${money(large)} ÷ ${money(small)} = ${times}. The large popcorn costs ${times} times as much.`)}
 if(t===4){const g=R(3,8),each=R(4,12);const tot=g*each;const kind=pick(['size','groups']);
  if(kind==='size')return mc(`${tot} pieces of candy are shared equally among ${g} friends. How many pieces does each friend get?`,each,[tot-g,each+1,tot,g],`Unknown group size: ${tot} ÷ ${g} = ${each} pieces each.`);
  return mc(`${tot} pieces of candy are given out, ${each} to each student. How many students get candy?`,g,[each,tot-each,g+1,tot],`Unknown number of groups: ${tot} ÷ ${each} = ${g} students.`)}
 const b=R(4,12),more=R(2,9);const tm=b+more;return mc(`Tommy has ${more} more marbles than Bobby. Tommy has ${tm} marbles. Which equation could you use to find Bobby's marbles, and what is the answer?`,`? + ${more} = ${tm}; Bobby has ${b}`,[`? − ${more} = ${tm}; Bobby has ${tm+more}`,`${more} × ? = ${tm}; Bobby has ${Math.round(tm/more*10)/10}`,`? + ${tm} = ${more}; Bobby has ${Math.abs(more-tm)}`],`Bobby's marbles plus ${more} equals Tommy's ${tm}. Undo the addition: ${tm} − ${more} = ${b}.`)}};

// ===== VERBAL =====
const PREFIXES=[['un-','not, reverse','unable, unhappy'],['re-','again, back','reload, return'],['pre-','before','preview, predict'],['dis-','not, away, opposite','disagree, disappear'],['mis-','bad, wrong','misplace, misspell'],['non-','not','nonstop, nonsense'],['in-','not (or into)','invisible, incorrect'],['sub-','under, below','submarine, subway'],['inter-','between, among','international, interrupt'],['trans-','across, beyond','transport, transform'],['bi-','two','bicycle, bilingual'],['tri-','three','triangle, tricycle'],['uni-','one','unicycle, uniform'],['semi-','half, partly','semicircle, semifinal'],['anti-','against','antisocial, antifreeze'],['super-','above, extra','superhero, superior'],['ex-','out','exit, exhale'],['co-, com-','with, together','cooperate, combine'],['bene-','good, well','benefit, beneficial'],['mal-','bad, poorly','malfunction, malnourished'],['post-','after','postpone, postgame'],['fore-','before, in front','forecast, foresee'],['circum-','around','circumference, circumnavigate'],['omni-','all','omnivore, omnipresent'],['hyper-','over, too much','hyperactive, hyperextend'],['auto-','self','automatic, autobiography'],['tele-','far','telephone, telescope'],['de-','down, away from','descend, decrease'],['poly-','many','polygon, polyglot'],['mono-','one, single','monotone, monopoly']];
const SUFFIXES=[['-able, -ible','capable of being (adjective)','teachable, flexible'],['-ful','full of, marked by (adjective)','helpful, joyful'],['-less','without, lacking (adjective)','fearless, careless'],['-ous','full of, having (adjective)','generous, joyous'],['-ish','like, somewhat (adjective)','childish, reddish'],['-er, -or','one who does (noun)','teacher, actor'],['-ist','one who does or believes (noun)','artist, scientist'],['-ness','state or quality (noun)','kindness, darkness'],['-ment','result or action (noun)','movement, agreement'],['-tion, -sion','action or state (noun)','celebration, decision'],['-hood','state or condition (noun)','childhood, neighborhood'],['-ship','position or state (noun)','friendship, leadership'],['-ity','quality or state (noun)','curiosity, ability'],['-ize','to make or cause (verb)','realize, organize'],['-fy','to make (verb)','simplify, beautify'],['-en','to make or become (verb)','soften, shorten'],['-ly','in a certain way (adverb)','quickly, softly'],['-esque','in the style of, like','statuesque, picturesque'],['-ard','one who does (often badly)','sluggard, drunkard'],['-tude','quality or state','attitude, gratitude']];
const ROOTS=[['port','carry','transport, portable, import'],['dict','say, speak','predict, dictionary, verdict'],['spect','look, see','inspect, spectator, spectacles'],['aud','hear','audience, audible, audio'],['vis, vid','see','visible, video, vision'],['scrib, script','write','describe, manuscript, scribble'],['graph','write, draw','autograph, photograph, graphic'],['bio','life','biology, biography'],['geo','earth','geography, geology'],['chron','time','chronological, synchronize'],['phon','sound','telephone, symphony, phonics'],['ject','throw','eject, reject, project'],['rupt','break','erupt, interrupt, rupture'],['tract','pull','tractor, attract, subtract'],['struct','build','construct, structure, instruct'],['mit, miss','send','transmit, mission, dismiss'],['ped','foot','pedal, pedestrian, centipede'],['aqua','water','aquarium, aquatic'],['terr','land','territory, terrain'],['cred','believe','credit, incredible'],['form','shape','transform, uniform, formation'],['mem','remember','memory, memorial, remember'],['loc','place','location, local'],['vac','empty','vacant, vacuum, vacation'],['min','small','minimum, miniature'],['magn','great, large','magnify, magnificent'],['duc, duct','lead','conduct, educate, aqueduct'],['fract, frag','break','fraction, fragment, fragile'],['man','hand','manual, manufacture'],['cycl','circle','bicycle, cyclone, recycle']];
const wordsByPos=pos=>VOCAB.filter(w=>w[1]===pos);
// Everything a word "means": itself plus its synonyms. Two entries whose meaning
// sets overlap are too close to sit in the same question, or both answers are right.
const MEAN={};VOCAB.forEach(w=>{MEAN[w[0]]=new Set([w[0].toLowerCase(),...w[3].map(x=>x.toLowerCase())])});
const tooClose=(a,b)=>{for(const x of MEAN[a])if(MEAN[b].has(x))return true;return false};
const vowelStart=w=>/^[aeiou]/i.test(w);
function synQ(word){
  const [w,pos,def,syns]=word;const ans=syns[0];
  const others=wordsByPos(pos).filter(o=>o[0]!==w
    && !tooClose(w,o[0])                      // not a near-synonym of the stem
    && o[3][0].toLowerCase()!==w.toLowerCase() // never offer the stem word itself
    && !MEAN[w].has(o[3][0].toLowerCase()));   // nor any of the stem's own synonyms
  const d=shuf(others).slice(0,3).map(o=>o[3][0]);
  return mc(`<span class="stem">${w.toUpperCase()}</span>`,ans,d,`<b>${w}</b> (${pos==='adj'?'adjective':pos==='v'?'verb':pos==='n'?'noun':'adverb'}) means ${def}. The closest match is <b>${ans}</b>${syns[1]?' (also: '+syns[1]+')':''}.`,{kind:'syn',word:w})}
function scQ(word){
  const [w,pos,def,syns,sent]=word;
  // If the blank follows "a"/"an", every choice must start the same way, or the
  // article alone gives the answer away.
  const article=/\b(an?)\s+___/.exec(sent);
  const others=wordsByPos(pos).filter(o=>o[0]!==w&&!tooClose(w,o[0])
    &&(!article||vowelStart(o[0])===vowelStart(w)));
  const d=shuf(others).slice(0,3).map(o=>o[0]);
  return mc(sent.replace('___','<span class="blank">______</span>'),w,d,`The clues in the sentence point to <b>${w}</b>: ${def}. "${sent.replace('___','<b>'+w+'</b>')}"`,{kind:'sc',word:w})}
// Two word parts whose meanings share a content word (e.g. "write" in both) are
// indistinguishable to a child, so they must never appear in the same question.
const STOP=new Set(['a','an','the','of','or','to','in','on','and','be','is','not','one','that','who','does','with','off','from','into','over','out','up','down','make','cause','state','quality','condition','act','result','action','marked','given','full','having','like','style']);
const glossWords=g=>new Set(String(g).toLowerCase().split(/[^a-z]+/).filter(x=>x.length>2&&!STOP.has(x)));
function glossClash(a,b){const A=glossWords(a),B=glossWords(b);for(const x of A)if(B.has(x))return true;return false}
function rootQ(){const t=R(1,5);
 if(t===1){const p=pick(PREFIXES);return mc(`What does the prefix <b>${p[0]}</b> mean, as in <em>${p[2]}</em>?`,p[1],shuf(PREFIXES.filter(x=>!glossClash(x[1],p[1]))).slice(0,3).map(x=>x[1]),`<b>${p[0]}</b> means "${p[1]}." Examples: ${p[2]}.`)}
 if(t===2){const r=pick(ROOTS);return mc(`The root <b>${r[0]}</b> appears in <em>${r[2]}</em>. What does it mean?`,r[1],shuf(ROOTS.filter(x=>!glossClash(x[1],r[1]))).slice(0,3).map(x=>x[1]),`<b>${r[0]}</b> means "${r[1]}." Think of ${r[2].split(', ')[0]}.`)}
 if(t===3){const s=pick(SUFFIXES);return mc(`What does the suffix <b>${s[0]}</b> mean, as in <em>${s[2]}</em>?`,s[1],shuf(SUFFIXES.filter(x=>!glossClash(x[1],s[1]))).slice(0,3).map(x=>x[1]),`<b>${s[0]}</b> means "${s[1]}." Examples: ${s[2]}.`)}
 if(t===4){const items=[['predict','to say what will happen before it does (pre- = before, dict = say)'],['transport','to carry across (trans- = across, port = carry)'],['inspect','to look into closely (in- = into, spect = look)'],['audible','able to be heard (aud = hear, -ible = able)'],['biography','writing about a life (bio = life, graph = write)'],['interrupt','to break in between (inter- = between, rupt = break)'],['submarine','a ship that goes under the sea (sub- = under)'],['unicycle','a cycle with one wheel (uni- = one)'],['fearless','without fear (-less = without)'],['misspell','to spell wrongly (mis- = wrong)'],['invisible','not able to be seen (in- = not, vis = see)'],['chronological','in time order (chron = time)'],['eject','to throw out (e- = out, ject = throw)'],['pedestrian','a person on foot (ped = foot)'],['incredible','hard to believe (in- = not, cred = believe)'],['magnify','to make larger (magn = large, -fy = make)'],['vacant','empty (vac = empty)'],['postpone','to put off until after (post- = after)']];const it=pick(items);
  return mc(`Using word parts, what does <b>${it[0]}</b> most likely mean?`,it[1].split(' (')[0],shuf(items.filter(x=>x[0]!==it[0]&&!glossClash(x[1].split(' (')[0],it[1].split(' (')[0]))).slice(0,3).map(x=>x[1].split(' (')[0]),`<b>${it[0]}</b>: ${it[1]}.`)}
 const items=[['not happy','unhappy'],['to view before','preview'],['to read again','reread'],['half of a circle','semicircle'],['a shape with many sides','polygon'],['without care','careless'],['full of joy','joyful'],['one who teaches','teacher'],['to make soft','soften'],['able to be read','readable'],['the state of being kind','kindness'],['against war','antiwar'],['to carry across','transport'],['to look inside','inspect'],['a person who walks (on foot)','pedestrian'],['able to be heard','audible']];const it=pick(items);
 return mc(`Which word means "<b>${it[0]}</b>"?`,it[1],shuf(items.filter(x=>x[1]!==it[1])).slice(0,3).map(x=>x[1]),`"${it[0]}" → <b>${it[1]}</b>. Break the word into its parts to check.`)}

T.v_roots={t:'Prefixes, Roots & Suffixes',cat:'verbal',lesson:`
<p>When you meet a word you do not know, take it apart. <b>Prefix</b> + <b>Root</b> + <b>Suffix</b> = Word. The root carries the main meaning; the prefix changes it; the suffix often tells you the part of speech.</p>
${ex('<em>insensitive</em>','in- (not) + sensitive → "not sensitive," someone who does not notice or care about others\' feelings.')}
${ex('<em>bicycle</em> vs. <em>unicycle</em>','bi- = two, uni- = one; cycle = wheel. Two wheels vs. one wheel.')}
<p><b>Common prefixes</b>:</p>
${table(['Prefix','Meaning','Examples'],PREFIXES)}
<p><b>Common roots</b>:</p>
${table(['Root','Meaning','Examples'],ROOTS)}
<p><b>Common suffixes</b>:</p>
${table(['Suffix','Meaning','Examples'],SUFFIXES)}
${tip('Negative prefixes (un-, in-, non-, dis-, mis-, mal-) flip a word\'s charge from positive to negative. If a synonym question asks about "malfunction," you know the answer is something bad.')}`,
gen:rootQ};

T.v_syn={t:'Synonym Strategies',cat:'verbal',lesson:`
<p>On the ISEE, a synonym question shows a word in CAPITAL LETTERS and four choices. Pick the word <b>closest in meaning</b>. More than one choice may be "sort of" similar, but one is the strongest match.</p>
<p><b>Strategy 1: Define it yourself first.</b> Before you look at the choices, say what the word means in your own words. Then find the match. This stops tempting wrong answers from fooling you.</p>
<p><b>Strategy 2: Use the charge.</b> Is the word positive, negative, or neutral? <em>Weary</em> feels negative and tired. Cross out any positive choices like "happy."</p>
<p><b>Strategy 3: Match the part of speech.</b> Synonyms share a part of speech. <em>Shy</em> and <em>timid</em> are both adjectives; <em>loner</em> is a noun, so it cannot be the synonym.</p>
<p><b>Strategy 4: Put it in a sentence.</b> "He will <em>adore</em> you forever" works; "He will <em>sweet</em> you forever" does not.</p>
<p><b>Strategy 5: Word parts.</b> Do not know <em>benevolent</em>? bene- means good → look for a kind, good choice.</p>
${ex('VAST: (a) rapid (b) expansive (c) small (d) ocean','"Vast" means huge. An ocean can <em>be</em> vast, but the word does not mean ocean. <b>(b) expansive</b>.')}
${tip('Never leave a synonym blank. There is no penalty for guessing on the ISEE. Eliminate what you can and choose.')}`,
gen(){return synQ(pick(VOCAB))}};

T.v_sc={t:'Sentence Completion Strategies',cat:'verbal',lesson:`
<p>A sentence completion has one blank (sometimes a blank phrase). Every sentence contains <b>clues</b> that point to exactly one answer.</p>
<p><b>Step 1: Read the whole sentence</b> and cover the choices. <b>Step 2: Predict</b> a word for the blank. <b>Step 3: Match</b> your prediction to a choice. <b>Step 4: Reread</b> with your choice in place.</p>
<p><b>Types of clues</b>:</p>
${table(['Clue type','Signal words','Example'],[['Contrast','but, although, however, yet, unlike, on the other hand','<em>Although</em> Mark seemed ___, he paced nervously. → calm'],['Cause and effect','because, since, so, therefore, as a result','<em>Since</em> she didn\'t cite sources, she lost points for ___. → copying'],['Description / example','such as, like, including, for example','Golden Retrievers and Pugs are the top ___ at the show. → breeds'],['Restatement','in other words, that is, which means',"He was <em>exhausted</em>, so ___ that he fell asleep standing. → tired"],['Tone / charge','positive or negative feeling words','Grandma\'s <em>normally rosy</em> cheeks looked ___ and <em>ghostlike</em>. → pale']])}
${ex('After Kira wrote her first book, she ___ her fans the sequel would be just as exciting.','Fans, sequel, exciting: a positive promise. <b>promised</b>. "Denied" is the opposite; "germinated" means to sprout.')}
${tip('Watch for reversal words. "But," "although," and "however" mean the blank is the OPPOSITE of the clue. "Because" and "so" mean it matches the clue.')}`,
gen(){return scQ(pick(VOCAB))}};

const TEST_INFO=`
<p>The <b>ISEE Lower Level</b> is for students in grades 4 and 5 applying to grades 5 and 6. It has five parts, always in this order:</p>
${table(['Section','Questions','Time','What it covers'],[['Verbal Reasoning','34','20 min','synonyms + sentence completions'],['Quantitative Reasoning','38','35 min','math thinking: estimation, patterns, logic, word problems'],['Reading Comprehension','25','25 min','5 passages with questions'],['Mathematics Achievement','30','30 min','math skills: computation, geometry, measurement, data'],['Essay','1 prompt','30 min','not scored; sent to schools']])}
<p>There is <b>no penalty for wrong answers</b>, so answer every question. Scores are reported as stanines (1–9) compared with other students in the same grade.</p>
<p>This program covers the Verbal Reasoning, Quantitative Reasoning, and Mathematics Achievement sections. Reading is best practiced by reading a little every day and talking about the main idea, and the essay by writing one practice essay a week on a fun prompt (for example: "Who do you look up to most, and why?").</p>`;

'That flexibility comes at a price. Without a skeleton, an octopus cannot rely on joints the way you do when you bend an elbow. So it does something stranger. When an octopus reaches for food, it stiffens two spots along one arm, making a temporary "elbow" out of muscle. The arm behaves like a jointed limb for a moment, then melts back into rope.',
'Its arms are also unusually independent. About two-thirds of an octopus\'s nerve cells sit in the arms rather than the brain. A severed arm will still reach toward food. Scientists think the brain gives a general order, such as "get that crab," and each arm works out the details on its own.',

{t:'The Girl Who Named a Planet',g:'History',
p:['In March 1930, an eleven-year-old girl named Venetia Burney was eating breakfast in Oxford, England, when her grandfather read aloud from the newspaper. Astronomers had found a ninth planet at the edge of the solar system, and nobody had decided what to call it.',
'Venetia had been studying Greek and Roman myths at school. She suggested Pluto, the god of the underworld, because the new world was so far from the sun that it must be cold and dark.',
'Her grandfather had once run a famous library, and he knew people at the observatory in Oxford. He passed the name along. It travelled by telegram to Arizona, where the discovery had been made. The astronomers there voted, and every one of them chose Pluto.',

{t:'How Bees Decide',g:'Science',
p:['When a beehive grows too crowded, half the colony leaves with the old queen and gathers on a branch in a buzzing ball. The bees now face a hard problem: they must choose a new home, and they must all choose the same one.',
'A few hundred scouts fly out to search. A scout who finds a promising hole in a tree returns and performs a waggle dance on the surface of the swarm. The direction of her dance points toward the site. The length of it says how good she thinks the site is.',
'Other bees watch, fly out, and inspect the site themselves. If they agree, they come back and dance for it too. If they are unimpressed, they simply stop dancing. Nobody argues, and no bee is in charge.',
'Slowly, the dances for the weaker sites fade, while the dances for the best site spread. When enough scouts have gathered at one site, the swarm lifts off together and flies straight to it. The colony has made a decision without a single leader deciding anything.'],

{t:'The Cube Makers',g:'Science',

{q:'Why is a cube useful to a wombat?',a:'It stays in place on a rock or log instead of rolling off',d:['It is easier for the wombat to carry','It keeps other animals from smelling it','It takes up less room in the burrow'],e:'The last paragraph explains that wombats mark territory on rocks and logs, and a cube will not roll away.',k:'detail'},
{q:'What is the author\'s tone in this passage?',a:'Amused but factual',d:['Angry','Sad','Worried'],e:'The writing is accurate but enjoys the oddity, as in the joke about guesses that do not survive inspection.',k:'tone'}]},

{t:'Seventy-Two Days',g:'Biography',
p:['In 1889 a reporter named Nellie Bly proposed to race around the world in fewer than eighty days, beating the imaginary journey in a popular novel. Her editor said that such a trip was work for a man, since a woman would need too much luggage.',
'Bly answered that she would take one bag. She left New York in November with a single leather case, one dress, and the coat she was wearing.',
'She travelled by steamship and train through England, France, Italy, Egypt, Ceylon, Singapore, Hong Kong, and Japan. She bought a monkey in Singapore and carried it the rest of the way. When storms slowed her ship across the Pacific, newspapers at home printed guesses about whether she would fail.',
'She reached New Jersey seventy-two days after she left. Crowds met the train at every station. Bly had already been famous for going undercover to expose cruelty in a hospital, but it was the race that put her face on board games and playing cards.',
'She had made one point twice over: that the world was smaller than people thought, and that she was the one who had proved it.'],
q:[{q:'What is the main idea of this passage?',a:'Nellie Bly proved her editor wrong by racing around the world in seventy-two days',d:['Travel in the 1800s was slow and uncomfortable','Novels of the time were often inaccurate','Reporters should not take dangerous assignments'],e:'The passage sets up the editor\'s doubt, follows the trip, and ends with what Bly proved.',k:'main idea'},
{q:'What reason did Bly\'s editor give for saying the trip was work for a man?',a:'He believed a woman would need too much luggage',d:['He thought women could not read maps','He said the ships would not allow women aboard','He worried she would be too slow'],e:'Paragraph 1 gives exactly this reason, and paragraph 2 shows her answering it with a single bag.',k:'detail'},
{q:'As used in paragraph 4, the word <em>expose</em> most nearly means:',a:'to reveal something hidden',d:['to photograph','to argue against','to survive'],e:'Bly went undercover, so she uncovered cruelty that had been hidden.',k:'vocabulary'},
{q:'Why does the author mention the monkey Bly bought in Singapore?',a:'To add a memorable, human detail to the account of the journey',d:['To explain why she was delayed','To prove she had extra luggage after all','To show she was cruel to animals'],e:'The detail is colorful and personal; nothing in the passage links it to a delay or to her luggage argument.',k:'purpose'},
{q:'What can you infer about how the public felt about Bly\'s race?',a:'They followed it closely and celebrated her',d:['They thought it was a waste of money','They barely noticed it','They believed she had cheated'],e:'Newspapers printed guesses about her, crowds met the train at every station, and her face appeared on games and cards.',k:'inference'}]},

{t:'Marbles',g:'Fiction',
p:['Theo kept his marbles in a cocoa tin that had lost its lid. There were forty-one. He knew because he counted them on the first day of every month, sitting cross-legged on the floor with the radiator ticking beside him.',
'The best one was a cat\'s eye with a green ribbon curled inside the glass. He had won it from a boy named Marcus in the fall, in a game played on the packed dirt behind the school, and Marcus had wanted it back ever since.',
'"Trade you," Marcus said, most Fridays. He would hold out something: a whistle, a pocketknife with one blade missing, a photograph of a race car. Theo always shook his head, and Marcus always shrugged as if he had expected nothing else, and they walked home the same way anyhow.',
'In April, Marcus\'s family moved to another state. On the last day, Theo waited by the fence with the cocoa tin. He did not say anything clever. He just took out the cat\'s eye and put it in Marcus\'s hand and closed the fingers over it.',
'Walking home alone, he counted them again out of habit. Forty. It felt about right.'],
q:[{q:'What is the main idea of this story?',a:'A boy gives away his most valued possession as a way of saying goodbye',d:['A boy learns to be a better marble player','Two boys argue over a game and stop being friends','A boy loses his marble collection'],e:'The whole story builds toward Theo handing Marcus the cat\'s eye when Marcus moves away.',k:'main idea'},
{q:'Why did Marcus want the cat\'s eye back?',a:'Theo had won it from him in a game',d:['It had belonged to Marcus\'s father','It was worth a great deal of money','Theo had taken it without asking'],e:'Paragraph 2 says Theo won it from Marcus in the fall and Marcus had wanted it back ever since.',k:'detail'},
{q:'What does the last line, "Forty. It felt about right," suggest about Theo?',a:'He is at peace with giving the marble away',d:['He regrets his decision immediately','He plans to win the marble back','He has miscounted his marbles'],e:'Having one fewer marble "felt about right," which shows contentment rather than regret.',k:'inference'},
{q:'The detail that Marcus "always shrugged as if he had expected nothing else" suggests that:',a:'the trading offer had become a friendly routine between them',d:['Marcus was angry with Theo','Marcus did not really want the marble','Theo was unkind to Marcus'],e:'Marcus expects the refusal, offers again each Friday, and they still walk home together, so it reads as a habit between friends.',k:'inference'},
{q:'Which detail best shows that the marbles mattered to Theo?',a:'He counted them on the first day of every month',d:['He kept them in a cocoa tin','He walked home the same way as Marcus','He waited by the fence in April'],e:'A monthly ritual of counting shows steady care and attention.',k:'detail'}]},

{t:'The First Vending Machine',g:'History',
p:['Around two thousand years ago, a Greek inventor named Hero lived in the Egyptian city of Alexandria. He wrote books describing machines that opened temple doors by themselves, puppets that moved on their own, and a spinning ball driven by steam.',
'One of his machines solved a problem in the temples. Worshippers were supposed to take a small amount of holy water to wash with, but some people took far more than their share.',
'Hero\'s answer was a bronze box with a slot in the top. A worshipper dropped in a coin. The coin landed on one end of a small lever and its weight tipped the lever down, which lifted a plug and let water run out. As the lever tipped further, the coin slid off the end and fell away. The lever swung back, the plug dropped, and the water stopped.',
'Nobody had to watch. Nobody had to be trusted. The amount of water depended only on how long the coin took to slide off, which was the same every time.',
'The idea then waited a very long time. The next coin-operated machines that most people would recognize did not appear until the 1880s, selling postcards and chewing gum in London.'],
q:[{q:'What is the passage mainly about?',a:'An ancient machine that dispensed holy water when a coin was dropped in',d:['The history of Greek temples','How steam engines were invented','Why chewing gum became popular'],e:'The central subject is Hero\'s coin-operated water machine, how it worked, and why it was needed.',k:'main idea'},
{q:'What problem was Hero\'s machine designed to solve?',a:'Some worshippers took more holy water than they should',d:['The temple doors were too heavy','Coins were being stolen from the temple','There was not enough water in Alexandria'],e:'Paragraph 2 states the problem directly.',k:'detail'},
{q:'What made the water stop running?',a:'The coin slid off the lever, which let the plug drop back',d:['A worker turned a handle','The bowl underneath filled up','The worshipper pulled the lever back'],e:'Paragraph 3 traces the sequence: the coin slides off, the lever swings back, the plug drops, the water stops.',k:'detail'},
{q:'Why does the author include the sentence "Nobody had to watch. Nobody had to be trusted."?',a:'To emphasize that the machine solved the problem without a person supervising',d:['To suggest the temple had no workers','To argue that people are dishonest','To explain why the machine was expensive'],e:'The short sentences stress the machine\'s advantage: fairness without supervision.',k:'purpose'},
{q:'What can you conclude from the final paragraph?',a:'Hero\'s idea was far ahead of its time',d:['Hero\'s machine did not really work','London invented the first vending machine','Chewing gum was popular in ancient Egypt'],e:'A gap of roughly 1,800 years before similar machines reappeared shows the idea arrived long before it was taken up.',k:'inference'}]},

{t:'Why Leaves Turn',g:'Science',
p:['A green leaf is green because of chlorophyll, the substance a plant uses to turn sunlight into food. Chlorophyll is so strongly colored that it hides everything else in the leaf.',
'It is not the only color there. Yellow and orange pigments sit in the leaf all summer long, doing quiet work: they catch kinds of light that chlorophyll misses and pass the energy along. You simply cannot see them.',
'In autumn the nights grow longer and the air grows cool. A tree that loses its leaves begins to shut the leaves down, sealing off the tubes that carry water in and food out. Without water, the tree stops making new chlorophyll, and the chlorophyll already there breaks apart. The green fades, and the yellows and oranges that were always present finally show.',
'Red is a different story. Most red pigment is not left over at all. The tree makes it in the fall, out of sugars trapped in the dying leaf. Scientists still argue about why a tree would spend energy on a color it is about to drop. One idea is that red acts like sunscreen, protecting the leaf long enough for the tree to pull the last useful material back into its branches.'],
q:[{q:'Which sentence best states the main idea?',a:'Autumn colors appear because chlorophyll breaks down and other pigments become visible or are newly made',d:['Trees lose their leaves because the nights get longer','Chlorophyll is the most important substance in a plant','Scientists do not understand why leaves change color'],e:'The passage explains the disappearance of green, the revealing of yellow and orange, and the making of red.',k:'main idea'},
{q:'According to the passage, when are yellow and orange pigments present in a leaf?',a:'All summer long, hidden by the green',d:['Only in autumn','Only in trees that lose their leaves','Only at night'],e:'Paragraph 2 says they "sit in the leaf all summer long" but cannot be seen.',k:'detail'},
{q:'How is red different from yellow and orange in a fall leaf?',a:'Red is usually made in the fall rather than revealed',d:['Red appears earlier in the season','Red comes from chlorophyll','Red is found only in evergreen trees'],e:'Paragraph 4 says most red pigment is made in the fall from trapped sugars, not left over.',k:'detail'},
{q:'As used in paragraph 3, the word <em>sealing</em> most nearly means:',a:'closing off',d:['painting','watering','breaking open'],e:'The tree closes the tubes that carry water and food, which is why the leaf stops receiving water.',k:'vocabulary'},
{q:'What does the passage suggest about scientific knowledge?',a:'Some questions remain open even when much is already understood',d:['Scientists rarely agree about anything','Plant science is finished','Only one explanation for red is possible'],e:'The passage explains a great deal confidently but says scientists "still argue" about red and offers one idea among others.',k:'inference'}]}
];

{t:'The Lighthouse and the Storm',g:'Fiction',
p:['The lamp had to be wound every four hours, and on the night of the storm it fell to Ida to do it, because her father had gone to the mainland for supplies and the water had risen too high for him to come back.',
'She was twelve. She had watched him climb the spiral stairs a thousand times, counting the steps under his breath the way other people hum. Sixty-three. She climbed them now with a candle in a jar, and the wind found her through the stones and pushed at the flame.',
'The mechanism was a weight on a chain that turned the lamp as it fell. When the weight reached the bottom, the light stopped turning, and a light that does not turn is just a glow, and a glow is not a warning. She cranked the weight back to the top. Her arms shook. She counted the turns.',
'Twice more before dawn she climbed. The third time she did not bother with the candle, because by then she knew the stairs.',
'In the morning the sea lay flat and innocent. Her father rowed back at eight and found her asleep at the top of the tower with her hand still on the crank, and he did not wake her for a long while.'],
q:[{q:'What is the main idea of this story?',a:'A girl keeps the lighthouse working alone through a dangerous night',d:['A girl learns to count the stairs of a lighthouse','A father abandons his daughter during a storm','A storm destroys a lighthouse'],e:'The story follows Ida taking over her father\'s job and completing it through the night.',k:'main idea'},
{q:'Why was Ida the one who had to wind the lamp?',a:'Her father could not return because the water had risen',d:['Her father was ill','She was stronger than her father','Her father had asked her to practice'],e:'The first paragraph explains he had gone to the mainland and the water was too high for him to come back.',k:'detail'},
{q:'Why does the author write that "a light that does not turn is just a glow, and a glow is not a warning"?',a:'To show why winding the lamp mattered so much',d:['To explain how lighthouses are built','To suggest the lamp was broken','To show that Ida was afraid of the dark'],e:'The sentence explains the stakes: without turning, the lamp cannot warn ships.',k:'purpose'},
{q:'The detail that Ida climbed the third time without a candle shows that she:',a:'had grown familiar and confident with the climb',d:['had run out of candles','was no longer afraid of her father','wanted to save the light for the lamp'],e:'The passage says plainly that "by then she knew the stairs."',k:'inference'},
{q:'As used in the last paragraph, the word <em>innocent</em> most nearly means:',a:'calm, as if it had done nothing wrong',d:['young','beautiful','shallow'],e:'The sea is described after a violent storm, so calling it innocent means it looks harmless now.',k:'vocabulary'}]},

{t:'The Man Who Drew Machines',g:'Biography',
p:['Rube Goldberg trained as an engineer. His first job was mapping sewer pipes for the city of San Francisco, and he lasted about six months before quitting to draw cartoons for a newspaper.',
'The cartoons that made him famous showed inventions. A napkin would be raised to a diner\'s mouth by a spoon, which pulled a string, which jerked a ladle, which threw a cracker past a parrot, which jumped after it onto a perch, which tipped seed into a pail, which pulled a cord, and so on for thirteen steps.',
'Every step worked by real physics. That was the joke. Goldberg was not mocking machines that fail; he was mocking machines that succeed at absurd cost, doing in thirteen steps what a hand could do in one.',
'He had seen the century fill with devices that promised to save effort and mostly added complication. His drawings gave people a word for that feeling. Today an engineer who calls a design "a real Rube Goldberg" is not paying a compliment, and schools hold contests to build the most gloriously overcomplicated machines they can.'],
q:[{q:'What is the main idea of this passage?',a:'Rube Goldberg\'s cartoons made fun of needlessly complicated machines',d:['Rube Goldberg was a failed engineer','Cartoons are more popular than engineering','Machines in the last century rarely worked'],e:'The passage explains what the cartoons showed, what the joke was, and the word it left behind.',k:'main idea'},
{q:'What was Goldberg\'s first job?',a:'Mapping sewer pipes for San Francisco',d:['Drawing cartoons for a newspaper','Teaching engineering','Building machines for contests'],e:'The first paragraph names the job and says he lasted about six months.',k:'detail'},
{q:'According to the passage, what was the joke in Goldberg\'s inventions?',a:'They worked, but at absurd cost in steps',d:['They always broke down','They could never really be built','They were copied from real inventors'],e:'Paragraph 3 says every step worked by real physics and that the target was success at absurd cost.',k:'detail'},
{q:'As used in the last paragraph, the phrase <em>is not paying a compliment</em> means the engineer is:',a:'criticizing the design',d:['praising the design','asking for money','refusing to be paid'],e:'To not pay a compliment is to say something unflattering.',k:'vocabulary'},
{q:'What can you infer about why Goldberg\'s cartoons became so popular?',a:'They named a frustration many people already felt',d:['They taught readers how to build machines','They were the only cartoons in newspapers','They showed inventions that had never been tried'],e:'The passage says people had seen devices add complication, and the drawings "gave people a word for that feeling."',k:'inference'}]},

{t:'The Vault in the Mountain',g:'Science',
p:['On a frozen island between Norway and the North Pole, a tunnel runs one hundred and thirty metres into a sandstone mountain. At the end of it are three rooms holding boxes of seeds.',
'The idea is simple. Farmers around the world grow thousands of varieties of wheat, rice, beans, and potatoes, and every country keeps its own collection so that a variety is never lost. But collections can be destroyed by fire, flood, war, or a broken freezer. The vault in the mountain is a backup of the backups.',
'The location was chosen carefully. The island is remote and politically stable. The rock is dry. Above all, the ground is permanently frozen, so even if the machines that chill the rooms failed completely, the seeds would stay cold for a long time on their own.',
'No one at the vault owns the seeds. Each country deposits its own boxes and keeps the only key to them, the way a bank holds a safe-deposit box without knowing what is inside. In 2015 a group of scientists withdrew seeds for the first time. Their collection in Syria had been damaged by war, and they wanted their wheat back.'],
q:[{q:'What is the main purpose of the seed vault described in the passage?',a:'To store backup copies of the world\'s crop seeds in case other collections are lost',d:['To grow new kinds of wheat and rice','To keep seeds away from farmers','To study how cold affects plants'],e:'Paragraph 2 explains the vault is "a backup of the backups" for national collections.',k:'main idea'},
{q:'Why was a location with permanently frozen ground chosen?',a:'The seeds would stay cold even if the cooling machines failed',d:['Frozen ground is easier to dig','Cold ground keeps thieves away','Plants grow better in cold places'],e:'Paragraph 3 gives this reason directly.',k:'detail'},
{q:'The comparison to a safe-deposit box helps the reader understand that:',a:'countries keep control of their own seeds even though the vault stores them',d:['the seeds are extremely valuable','the vault is inside a bank','only rich countries may use the vault'],e:'The comparison illustrates the arrangement: the vault holds the boxes, the depositor keeps the key.',k:'purpose'},
{q:'As used in paragraph 3, the word <em>remote</em> most nearly means:',a:'far away from other places',d:['dangerous','expensive','modern'],e:'The island lies between Norway and the North Pole, and remoteness is listed as an advantage for safety.',k:'vocabulary'},
{q:'The example from 2015 is included to show that:',a:'the vault is not just a precaution but has actually been needed',d:['the vault is poorly guarded','scientists in Syria built the vault','wheat is the only crop stored there'],e:'The first withdrawal demonstrates the vault serving its purpose in a real emergency.',k:'inference'}]},

{t:'The Longest Inning',g:'Fiction',
p:['By the fourteenth inning the concession stand had run out of everything but ice, and the scoreboard operator had started writing the runs on a piece of cardboard because the numbers only went to twelve.',
'Priya had been on the bench all season. She was the kind of player coaches call dependable, which is a word that means you will not lose the game for us and does not mean much else. In the sixteenth, the coach ran out of outfielders and pointed at her.',
'She jogged out to right field, where nothing ever happens, and stood in the wet grass under the lights while moths beat themselves against the bulbs.',
'In the eighteenth, a batter got under a pitch and lifted it high and lazy toward her. Priya had two thoughts. The first was that she had never caught a ball in a real game. The second was that the ball was going to land whether she was thinking or not.',
'She caught it. It was not graceful. She trapped it against her ribs with both hands and sat down hard in the grass and held it up, and the sound the crowd made was not for a great catch but for a long night ending, and she took it anyway.'],
q:[{q:'What is the main idea of this story?',a:'A player who never gets to play finally makes a catch that ends a long game',d:['A team wins a championship','A coach makes a serious mistake','A player is injured in the outfield'],e:'The story sets up Priya\'s inexperience and ends with her catch closing the game.',k:'main idea'},
{q:'Why was the scoreboard operator writing on cardboard?',a:'The scoreboard could not show numbers past twelve',d:['The scoreboard had broken','He wanted a souvenir','The lights had gone out'],e:'The first paragraph explains "the numbers only went to twelve."',k:'detail'},
{q:'What does the narrator suggest by defining "dependable" as a word that "does not mean much else"?',a:'Priya was seen as safe but not especially valued',d:['Priya was the best player on the team','The coach disliked Priya','Priya was often late to practice'],e:'The definition is deflating: it praises her only for not causing harm.',k:'inference'},
{q:'As used in paragraph 4, the word <em>lazy</em> describes a ball that is:',a:'moving high and slowly',d:['hit very hard','rolling on the ground','thrown by a tired pitcher'],e:'The ball is "high and lazy," which describes an easy, slow arc through the air.',k:'vocabulary'},
{q:'Why does the narrator say the crowd\'s sound "was not for a great catch"?',a:'The crowd was mostly relieved the long game was over',d:['The crowd had not seen the catch','The catch did not count','The crowd was cheering the other team'],e:'The sentence contrasts a cheer for skill with a cheer "for a long night ending."',k:'inference'}]},

{t:'The Letter Under the Floor',g:'Fiction',
p:['The house was old enough that the floorboards in the back bedroom had gone soft in one corner, and when the workmen pulled them up they found a tin box, and inside the box a letter, and inside the letter a list.',
'The list was of names. Twenty-two of them, written in a careful hand, with dates beside each one running from 1852 to 1861. The letter said only this: "If the house should ever be sold, whoever finds this should know that these people passed through and reached safety."',
'The town historian was called. She explained that the house sat two miles from a river crossing, on a road that had been used by people escaping slavery. Hiding a list had been dangerous. Keeping one at all had been dangerous. Someone had decided the names mattered more than the risk.',
'The family that owned the house had planned to replace the floor entirely. Instead they cut a small window into it, covered it with glass, and left the empty tin where it had lain. Visitors kneel to look at it. There is nothing to see but a box and the dark underneath, which the historian says is exactly the point.'],
q:[{q:'What is the main idea of this passage?',a:'A hidden list of names reveals the house\'s role in helping people escape slavery',d:['Old houses often have soft floorboards','A historian solves a crime','A family argues about repairing a floor'],e:'The discovery, its meaning, and the family\'s response all center on the list and what it records.',k:'main idea'},
{q:'What did the letter ask the finder to know?',a:'That the people on the list had passed through and reached safety',d:['That the house should never be sold','That the box was very valuable','That the names should be kept secret forever'],e:'Paragraph 2 quotes the letter directly.',k:'detail'},
{q:'Why does the historian say keeping the list was dangerous?',a:'Helping people escape slavery was against the law at the time',d:['The paper could easily catch fire','The floorboards were rotten','Thieves were looking for the tin box'],e:'The passage explains the house sat on a road used by people escaping slavery, and stresses the risk of writing anything down.',k:'inference'},
{q:'Why did the family put a glass window in the floor?',a:'To preserve the hiding place so visitors could see where it was',d:['To make the room brighter','To keep the floor from rotting again','To store the letter safely'],e:'They left the empty tin in place and covered the spot with glass so people could look.',k:'purpose'},
{q:'What does the historian mean by saying the empty space is "exactly the point"?',a:'The emptiness makes visitors think about people whose stories were never recorded',d:['The tin box was worthless','Visitors should not be allowed inside','The list was probably a forgery'],e:'There is nothing to see but darkness, which turns attention to the hidden lives the list only barely records.',k:'inference'}]},

{t:'The Sound of a Word',g:'Science',
p:['Try saying the words <em>bouba</em> and <em>kiki</em> out loud. Now imagine two shapes: one round and soft, like a cloud; the other spiky, like a star made of broken glass. Which shape is bouba?',
'Almost everyone picks the round one. Researchers have asked this question of children and adults, of English speakers and speakers of languages written in entirely different alphabets, and the answer comes back the same roughly nine times in ten.',
'Nobody is certain why. One explanation involves the mouth. To say <em>bouba</em>, the lips make a rounded shape and the sound rolls; to say <em>kiki</em>, the tongue makes sharp contact and stops the sound twice. The shape of the mouth may match the shape we imagine.',
'The result matters because people once assumed that the sound of a word had nothing at all to do with its meaning, that <em>dog</em> could just as easily have been <em>glorp</em>. That is mostly true. But the bouba-kiki effect suggests it is not entirely true, and languages around the world do show small patterns of this kind.'],
q:[{q:'What is the main idea of this passage?',a:'The sounds of words may connect to meaning more than people once assumed',d:['English is easier to learn than other languages','Children choose shapes differently from adults','Round shapes are more popular than spiky ones'],e:'The final paragraph states the point: the old assumption is "not entirely true."',k:'main idea'},
{q:'According to the passage, how consistent is the bouba-kiki result?',a:'About nine out of ten people choose the same way',d:['Only English speakers agree','Adults and children disagree','Results change with each new study'],e:'Paragraph 2 gives the figure of roughly nine times in ten across languages and ages.',k:'detail'},
{q:'What explanation does the passage offer for the effect?',a:'The shape the mouth makes may match the shape we picture',d:['People have seen the shapes before','Round objects are more common in nature','The words come from an ancient language'],e:'Paragraph 3 describes rounded lips for bouba and sharp tongue contact for kiki.',k:'detail'},
{q:'Why does the author mention that <em>dog</em> could have been <em>glorp</em>?',a:'To explain the older idea that sound and meaning are unrelated',d:['To suggest that English words are poorly chosen','To show that animals have many names','To argue that new words should be invented'],e:'It illustrates the assumption the bouba-kiki effect partly challenges.',k:'purpose'},
{q:'The author\'s attitude toward the older assumption is best described as:',a:'mostly accepting it while noting an exception',d:['completely rejecting it','indifferent to it','confused by it'],e:'The passage says the assumption is "mostly true" but "not entirely true."',k:'tone'}]},

{t:'Ice on the Road',g:'Science',
p:['Salt on a winter road does not melt ice by making it warm. Salt has no heat to give. What it does is change the temperature at which water freezes.',
'Pure water freezes at zero degrees Celsius. At that temperature, water molecules are constantly joining the ice and leaving it, in balance. Scatter salt on the surface and the salt dissolves into the thin film of liquid always present on ice. Now the water molecules trying to rejoin the ice have to find their way past salt particles in the way. Fewer molecules freeze, more melt, and the balance tips toward liquid.',
'The colder it gets, the less this helps. Ordinary road salt stops working near minus nine degrees Celsius, because below that the ice wins the race no matter how crowded the surface is. Some places switch to other chemicals, or to sand, which does not melt anything but gives tires something to grip.',
'There is a cost. Salt washes into streams and soil, where it harms plants and fish, and it rusts the underside of every car that drives over it. Cities now weigh how much to use, and some spray a thin brine before a storm instead of dumping salt after one, which uses far less.'],
q:[{q:'What is the main idea of this passage?',a:'Salt melts road ice by lowering water\'s freezing point, but it has limits and costs',d:['Salt warms up ice until it melts','Sand is better than salt on winter roads','Cars rust because of winter weather'],e:'The passage explains the mechanism, then the temperature limit, then the environmental cost.',k:'main idea'},
{q:'According to the passage, what does salt actually do?',a:'It changes the temperature at which water freezes',d:['It produces heat','It absorbs water','It makes ice heavier'],e:'The first paragraph states this and specifically rules out warming.',k:'detail'},
{q:'Why does road salt stop working in very cold weather?',a:'Below about minus nine degrees, water freezes faster than salt can prevent',d:['The salt freezes solid','Snow covers the salt','Salt dissolves too quickly'],e:'Paragraph 3 says "the ice wins the race no matter how crowded the surface is."',k:'detail'},
{q:'How does sand help on an icy road?',a:'It gives tires something to grip',d:['It melts ice faster than salt','It lowers the freezing point further','It keeps salt from washing away'],e:'Paragraph 3 says sand "does not melt anything but gives tires something to grip."',k:'detail'},
{q:'Why do some cities spray brine before a storm?',a:'It works with far less salt than treating the road afterward',d:['Brine is warmer than salt','Brine is safer for fish than fresh water','It makes the snow fall more slowly'],e:'The last sentence says the practice "uses far less" salt.',k:'inference'}]},

{t:'The Museum of Broken Things',g:'Fiction',
p:['Grandpa Ansel kept a museum in his garage. He had made the labels himself on index cards, in capital letters, and taped them to the shelf below each object.',
'BICYCLE BELL. RANG ONCE PER MORNING FOR ELEVEN YEARS. SPRING FAILED 1998.',
'CUP. DROPPED BY YOUR MOTHER, AGE SIX. NOT HER FAULT. THE HANDLE WAS BADLY MADE.',
'RADIO. WORKED PERFECTLY. REPLACED ANYWAY, WHICH WAS MY MISTAKE.',
'Nadia used to think the museum was a joke, the sort of thing grandfathers do to be funny. Then she noticed there was nothing in it that had simply been thrown away. Every object had a card, and every card had a reason, and some of the reasons were apologies.',
'The summer she turned thirteen she asked if she could add something. He handed her a blank card without a word. She wrote: PHONE. SCREEN CRACKED IN THE PARKING LOT. I WAS RUNNING BECAUSE I WAS LATE, AND I AM ALMOST ALWAYS LATE.',
'He read it twice, taped it to the shelf, and moved the cup over to make room.'],

const passageHTML=p=>`<div class="passage"><h4>${p.t}</h4>${p.p.map(x=>`<p>${x}</p>`).join('')}</div>`;
function passageSet(pi){const p=PASSAGES[pi%PASSAGES.length];const html=passageHTML(p);
  return shuf(p.q).map(item=>{const q=mc(item.q,item.a,item.d,item.e);if(!q)return null;
    q.pas=html;q.topic='rd_'+item.k.replace(/[^a-z]/g,'');q.rkind=item.k;return q}).filter(Boolean)}
// A single mixed question, for the Practice tab and for drills.
function readingQ(){for(let i=0;i<50;i++){const pi=R(0,PASSAGES.length-1);const set=passageSet(pi);if(set.length)return pick(set)}return null}

T.rd_main={t:'Main Idea & Supporting Details',cat:'read',lesson:`
<p>The <b>topic</b> is what a passage is about, in one or two words: <em>cheetahs</em>. The <b>main idea</b> is the whole point the author makes about that topic, in a sentence: <em>cheetahs are the fastest land animals but can only run fast for short distances</em>.</p>
<p><b>Supporting details</b> are the facts, examples and stories that back up the main idea. They answer <em>who, what, where, when, why</em> and <em>how</em>.</p>
${ex('Finding the main idea','Read the first and last sentences of the passage, then ask: "What is the one thing every paragraph is helping to say?" If a choice is true but only covers one paragraph, it is a detail, not the main idea.')}
<p><b>Three traps in the answer choices</b>:</p>
<ul><li><b>Too narrow</b> — true, but it only describes one detail.</li><li><b>Too broad</b> — bigger than the passage; the passage never proves it.</li><li><b>Not stated</b> — sounds sensible, but the passage never says it.</li></ul>
<p>For a detail question, go back and <b>find the line</b>. Never answer from memory. The right answer is almost always a restatement of one sentence in the passage.</p>
${tip('Cover the answers, say the main idea in your own words, and then look for the choice closest to what you said. This stops a tempting wrong answer from pulling you off course.')}`,
gen(){return readingQ()}};

T.rd_infer={t:'Inference & Author\'s Purpose',cat:'read',lesson:`
<p>An <b>inference</b> is a conclusion you reach using clues in the text plus what you already know. It is not stated outright, but it must be <em>supported</em> by the passage. Being a good detective, not a good guesser.</p>
${ex('"She trapped it against her ribs with both hands and sat down hard."','You can infer the catch was awkward, because of <em>trapped</em>, <em>both hands</em> and <em>sat down hard</em>. You cannot infer that she was a bad player: the passage never says so.')}
<p><b>Author's purpose</b> is why the author wrote the passage. The three big ones:</p>
${table(['Purpose','Signs of it'],[['To inform','facts, dates, explanations, neutral language'],['To persuade','opinions, reasons, words like <em>should</em> or <em>best</em>'],['To entertain','story, characters, humor, description']])}
<p>You will also be asked why the author included <b>one particular detail</b>. The answer is almost always: to support the point being made in that paragraph.</p>
${tip('For any inference question, put your finger on the line in the passage that proves your answer. If you cannot find one, it is the wrong answer, no matter how reasonable it sounds.')}`,
gen(){return readingQ()}};

T.rd_vocab={t:'Vocabulary in Context',cat:'read',lesson:`
<p>These questions ask what a word means <b>in this passage</b>, which is not always its most common meaning. A word like <em>fair</em> can mean just, light-colored, or a carnival.</p>
<p><b>The method</b>:</p>
<ol><li>Go back and read the sentence, plus the one before and after.</li><li>Cover the word and say your own word in the blank.</li><li>Pick the choice closest to your word.</li><li>Read your choice back into the sentence to check.</li></ol>
${ex('"The sea lay flat and <em>innocent</em>."','Cover <em>innocent</em>. The sea has just finished a violent storm and is now calm. Your word might be "harmless." That points to "calm, as if it had done nothing wrong," not "young" or "beautiful."')}
<p><b>Clue types</b> to look for: a <b>contrast</b> (but, although, however), a <b>restatement</b> (that is, in other words), an <b>example</b> (such as, like), or the general <b>tone</b> of the sentence.</p>
${tip('The most common meaning of the word is often a trap answer. Trust the sentence, not your memory of the word.')}`,
gen(){return readingQ()}};

T.rd_tone={t:'Tone, Style & Organization',cat:'read',lesson:`
<p><b>Tone</b> is the author's attitude toward the subject. You find it in word choice. Compare "my grandfather is a robust, elderly man" with "my grandfather is a chubby, old man": the same facts, a different feeling.</p>
${table(['Tone word','What it feels like'],[['Amused / playful','enjoys the subject, makes small jokes'],['Admiring','praises the subject'],['Curious','asks questions, explores'],['Critical','points out faults'],['Neutral / informative','just the facts'],['Nostalgic','fond memory of the past']])}
<p><b>Organization</b> is how the passage is built. Common text structures:</p>
${table(['Structure','Signal words'],[['Sequence / process','first, next, then, finally'],['Cause and effect','because, so, as a result, therefore'],['Compare and contrast','however, unlike, both, on the other hand'],['Problem and solution','problem, answer, solved, instead'],['Description','for example, such as, another']])}
<p><b>Figurative language</b>: a <b>simile</b> compares using <em>like</em> or <em>as</em> ("spiky, like a star made of broken glass"); a <b>metaphor</b> compares without them; <b>personification</b> gives human qualities to a thing ("the sea lay innocent").</p>
${tip('Tone answers are rarely extreme. On a passage about a science discovery, "angry" and "heartbroken" are almost never right; "curious" or "amused" usually is.')}`,
gen(){return readingQ()}};

T.wr_essay={t:'Writing the Essay',cat:'write',lesson:`
<p>The ISEE ends with one essay, written by hand in <b>30 minutes</b>. It is <b>not scored</b>, but a copy is sent to every school you apply to, so a real person will read it. Schools use it to hear your voice and to see that you can organize an idea.</p>
<h4>The plan: 5 minutes, 20 minutes, 5 minutes</h4>
<ol><li><b>Plan (5 min).</b> Pick your position and jot three reasons or three moments. Do not write sentences yet, just words.</li><li><b>Write (20 min).</b> Four or five paragraphs.</li><li><b>Check (5 min).</b> Reread for missing words, capital letters and periods.</li></ol>
<h4>The shape</h4>
${table(['Paragraph','What goes in it'],[['Opening','Answer the question directly in one sentence, then say what you will show.'],['Body 1','Your first reason, with a specific example.'],['Body 2','Your second reason, with a specific example.'],['Body 3 (optional)','A third reason, or a moment that shows the point.'],['Closing','Say what it all adds up to. Do not introduce anything new.']])}
${ex('Opening a "someone you look up to" essay','Weak: "There are many people I look up to in this world." (Says nothing.)<br>Strong: "I look up to my grandmother, because she taught me that being patient is a kind of bravery."')}
<h4>Five rules that matter most</h4>
<ul><li><b>Answer the actual question.</b> A beautiful essay about the wrong prompt does not help you.</li><li><b>Be specific.</b> One real moment beats three general statements. Not "she is kind," but "she waited with me at the bus stop in the rain for forty minutes."</li><li><b>Use your own words.</b> Do not reach for big vocabulary you are unsure of. The right word beats the fanciest word.</li><li><b>Write neatly.</b> A reader who cannot read your handwriting cannot be impressed by it.</li><li><b>Leave time to reread.</b> Almost everyone finds one missing word.</li></ul>
${tip('You cannot fail this section, so do not freeze. Pick a position in the first minute, even if it is not your deepest opinion, and spend your energy on examples rather than on choosing.')}`,
gen(){const forms=[
 {q:'How long do you have to write the ISEE essay?',a:'30 minutes',w:['15 minutes','45 minutes','60 minutes'],e:'The essay section is 30 minutes long, which is why the 5-20-5 plan works well.'},
 {q:'Is the ISEE essay given a score?',a:'No, but a copy is sent to the schools you apply to',w:['Yes, it is worth a quarter of your total score','Yes, and it decides whether you are admitted','No, and nobody ever reads it'],e:'The essay is unscored, but schools receive a copy, so a real person reads it.'},
 {q:'Which is the strongest opening sentence for the prompt "Who do you look up to?"',a:'I look up to my grandmother, because she taught me that being patient is a kind of bravery.',w:['There are many people in this world who are worth looking up to.','This is a very interesting question that I have thought about often.','I will now explain who I look up to and give my reasons.'],e:'It answers the question directly and previews the reason. The others delay without saying anything.'},
 {q:'Which detail is the most convincing evidence that a person is kind?',a:'She waited with me at the bus stop in the rain for forty minutes.',w:['She is a very kind person in many ways.','Everyone agrees that she is kind.','Kindness is her most important quality.'],e:'A specific moment shows kindness; the others only assert it.'},
 {q:'You have five minutes left and you notice a paragraph is missing a good example. What is the best use of that time?',a:'Reread the whole essay for missing words and punctuation',w:['Start a new paragraph with the example','Erase the paragraph and rewrite it','Add a longer conclusion'],e:'With five minutes left, checking protects the whole essay. Starting new work risks leaving a sentence unfinished.'},
 {q:'What should the closing paragraph do?',a:'Say what the examples add up to, without adding anything new',w:['Introduce your strongest new reason','Apologize for anything you left out','Repeat the opening sentence word for word'],e:'A closing pulls the essay together. New ideas belong in the body paragraphs.'},
 {q:'The prompt asks where you would move if you could live anywhere. You write a wonderful essay about your favorite vacation. What is the problem?',a:'It does not answer the question that was asked',w:['Vacations are not an interesting topic','The essay is probably too long','You should never write about travel'],e:'Answering the actual prompt is the first rule. Good writing on the wrong question does not help you.'},
 {q:'Which is the best plan for the first five minutes?',a:'Choose your position and jot down three reasons or moments',w:['Write the opening paragraph slowly and carefully','Think quietly until the perfect idea arrives','Write a full outline in complete sentences'],e:'A quick list of three specifics gives the essay its shape and leaves 20 minutes for writing.'}];
 const f=pick(forms);return mc(f.q,f.a,f.w,f.e)}};

// Written at the level a strong fifth grader can actually reach: plain words,

// notes explaining WHY it works, so the model teaches rather than intimidates.

{kind:'person',prompt:'Who is someone you look up to the most in this world? Explain why.',
 why:'It picks an unexpected person, and every paragraph proves the point with something that actually happened instead of describing him with adjectives.',

 {t:'In September a boy named Dev sat by himself at lunch every day for two weeks. Teachers walked past him. I walked past him. Mr. Okafor started wiping the table next to Dev at the same time every day, and he would say something about the weather or about the soup, and after a while Dev started answering. By October Dev was sitting with us. Mr. Okafor never told anyone he did that.',
  n:['This is one specific moment with a date, a name and a place. That is what makes it believable.','"I walked past him" is honest. Admitting your own part makes a reader trust you.','The last sentence lands the point without announcing it. He does not write "this shows he is kind."']},
 {t:'He also fixes things before anyone reports them. Our classroom door used to stick so hard that the smallest kids needed help, and one morning it just opened easily. Nobody had told him. He had watched us struggle with it and decided that was enough of a reason.',

 {t:'I used to think that people you look up to are the ones who win things. Mr. Okafor has not won anything that I know of. He just pays attention, every single day, to people who are easy to walk past. That is harder than winning, and I want to be better at it.',
  n:['The closing says what the examples add up to. It does not introduce a new story.','It ends with what the writer takes from it, which gives the essay a reason to exist.']}]},

{kind:'narrative',prompt:'Describe a time you worked hard at something difficult. What happened?',
 why:'It tells one story from start to finish and is honest about the ugly middle, which is what makes the ending feel earned.',
 paras:[
 {t:'Last year I could not run the mile. Not slowly, not badly, not at all. I walked most of it and finished last, and in October our gym teacher said we would run it again in April.',
  n:['It starts inside the problem instead of explaining that the writer is about to describe a problem.','The short repeated phrases ("Not slowly, not badly, not at all") give the writing a voice.','The last sentence sets a deadline, which gives the story a shape.']},
 {t:'I started running on Tuesdays and Thursdays with my dad on the path behind the library. The first week I had to stop four times. My legs were not even the problem. The problem was that my throat burned and I was sure something was wrong with me, and my dad kept saying that was just what it feels like at the beginning.',
  n:['Specific days and a specific place. "Tuesdays and Thursdays behind the library" is far stronger than "I practiced a lot."','Admitting that she stopped four times makes the improvement later mean something.']},
 {t:'It stayed hard for a long time. In January I was still slower than I wanted, and I skipped two weeks because it was cold and because I did not want to find out that I had not improved. Then I went back, because my dad went out to the path anyway and waited.',
  n:['This is the paragraph most students leave out. Quitting for two weeks is the honest part of the story.','The reason she returns is small and human. She does not suddenly become determined.']},
 {t:'In April I ran the whole thing without walking. My time was eleven minutes and two seconds, which was not close to the fastest in my class. I did not care about that at all. I cared that I had found out what my throat burning actually meant, which was nothing, and that I had been wrong about myself in a way I could fix.',
  n:['A real number makes the ending concrete.','Naming what she did NOT care about is more convincing than claiming she was proud.','The final line answers "what happened" at a deeper level than the finish time.']}]},

{kind:'place',prompt:'If you could move anywhere in the world, where would it be and why?',
 why:'It chooses a specific place for reasons only this writer could give, using details from her own senses rather than facts from a website.',

  n:['Names the exact place, not "somewhere warm" or "another country."','The reason is unusual and specific. Boredom is something a fifth grader can write about honestly.']},
 {t:'Her house has a flat roof, and in the evening the whole family goes up there because it is cooler than inside. You can see other roofs with other families on them. Somebody is always calling something across to somebody else. Once a monkey walked along the wall and took a mango out of a bowl, and my grandmother yelled at it in Malayalam and it left, and everyone laughed for about ten minutes.',
  n:['The roof detail is something you can only know by having been there.','The monkey story is one moment, told quickly, and it does the work of an entire paragraph of description.']},
 {t:'The other reason is the rain. In June it rains so hard that it sounds like the roof is being hit with rice. It rains for hours and nobody is upset about it, and nobody cancels anything. Where I live now, rain means practice is off and everyone is disappointed.',

  n:['Admitting the drawback makes the writer sound thoughtful rather than dreamy.','The closing returns to the roof image, so the essay ends where it was strongest.']}]},

// ===== PARENT REVIEW =====
const RUBRIC=[
 {h:'Does it answer the question that was asked?',s:'Reread the prompt out loud, then the first paragraph. A strong essay answers in its first two sentences.',w:'It circles the topic without ever taking a position, or it answers a different, easier question.'},
 {h:'Is it organized?',s:'An opening that states the answer, two or three middle paragraphs that each do one job, and a closing that adds nothing new.',w:'One long block, or paragraphs that could be shuffled without anyone noticing.'},
 {h:'Is it specific?',s:'At least one moment you can picture: a name, a place, a number, something somebody said. This is the single biggest difference between essays.',w:'Adjectives doing all the work. "She is very kind and generous and always helps everyone."'},
 {h:'Does it sound like her?',s:'Words she would actually use. A plain sentence in her own voice beats a fancy one she borrowed.',w:'Vocabulary that does not fit the rest of the writing, or a stiff, formal tone she never uses out loud.'},
 {h:'Is it clean enough?',s:'Capital letters, end punctuation, no missing words. Handwriting a stranger can read.',w:'Errors so frequent that the reader is decoding instead of reading. A few spelling slips in 30 minutes are normal and fine.'}];
const PARENT_QS=[
 'Read me your favourite sentence. Why that one?',
 'Which of your reasons felt strongest, and which one felt thin?',
 'If you had five more minutes, what would you have added?'];
const PARENT_HOWTO=`
<p><b>Praise something specific first.</b> Not "this is good," but "the part where the door just opened one morning — that was the best sentence." She will write more of whatever you name.</p>
<p><b>Pick one thing to work on.</b> Only one, even if you see five. The next essay is for the next thing.</p>
<p><b>Do not correct spelling out loud line by line.</b> The essay is unscored and schools know it was handwritten in 30 minutes under pressure. Organization and specific detail matter far more than a misspelled word.</p>
<p><b>Ask before you tell.</b> The three questions above usually get her to find the weak paragraph herself, which sticks better than being told.</p>`;

const vstat=w=>S.vocab[w]||(S.vocab[w]={lvl:0,seen:0,r:0,w:0});
function recordTopic(id,ok){const s=tstat(id);ok?s.r++:s.w++;markDay()}
function recordVocab(w,ok){const s=vstat(w);s.seen++;ok?(s.r++,s.lvl=Math.min(4,s.lvl+1)):(s.w++,s.lvl=Math.max(0,s.lvl-1))}
function markDay(){S.days[today()]=(S.days[today()]||0)+1}

function expectedDone(){const N=SESSIONS.length;const total=daysBetween(S.start,S.test);const el=daysBetween(S.start,today());if(total<=0)return N;return Math.max(0,Math.min(N,Math.floor(el/total*N)))}
// Spread every word across the 48 sessions, so none is ever met cold in a quiz.
const NSESS=SESSIONS.length;
const wordEnd=idx=>Math.round((idx+1)*VOCAB.length/NSESS);
function newWordsFor(idx){return VOCAB.slice(idx?wordEnd(idx-1):0,wordEnd(idx))}
function introducedWords(idx){return VOCAB.slice(0,wordEnd(idx))}
function weakTopics(k){return ALLMATH.map(id=>{const s=S.topics[id];const n=s?s.r+s.w:0;return {id,n,acc:n?s.r/n:1}}).filter(x=>x.n>=4).sort((a,b)=>a.acc-b.acc).slice(0,k).map(x=>x.id)}

// ================= QUESTION SOURCING =================
function verbalQ(kind,idx){const pool=idx!=null?introducedWords(idx):VOCAB;
 for(let i=0;i<200;i++){const useSeen=pool.length>=8?Math.random()<0.7:Math.random()<0.5;
  const w=useSeen?pick(pool):pick(VOCAB);const q=kind==='syn'?synQ(w):scQ(w);if(q)return q}
 return null}
// A generator returns null rather than build a question with look-alike choices;
// ask again until it gives us a clean one.
function genOne(id){for(let i=0;i<200;i++){const q=T[id].gen();if(q){q.topic=id;return q}}return null}
function mixedMath(topics,n){const out=[];for(let i=0;i<n;i++){const q=genOne(topics[i%topics.length]);if(q)out.push(q)}return shuf(out)}
function topicQs(id,n){const out=[];for(let i=0;i<n;i++){const q=genOne(id);if(q)out.push(q)}return out}
function verbalSet(n,idx){const out=[];const half=Math.ceil(n/2);
 for(let i=0;i<n;i++){const kind=i<half?'syn':'sc';const q=verbalQ(kind,idx);if(q){q.topic=kind==='syn'?'v_syn':'v_sc';out.push(q)}}
 return out}
// Quantitative Reasoning leans on concepts, estimation and logic; Mathematics
// Achievement leans on computation. Weight the pools so the two tests differ.
const QR_TOPICS=['q_sense','q_logic','q_multi','q_inverse','a_pattern','s_center','s_graphs','s_plots','s_interpret','p_basic','p_compound','p_count','p_predict','n_wordops','m_est','r_ratio'];
const MA_TOPICS=ALLMATH.filter(id=>!['q_sense','q_logic','q_inverse'].includes(id));
function mathTest(n,kind){const pool=kind==='verbal'?ALLMATH:kind==='math'?MA_TOPICS:QR_TOPICS;return mixedMath(shuf(pool),n)}

// ================= SESSION BUILDER =================
function buildSession(sess){const idx=sess.idx;const cur={id:sess.id,type:sess.type,title:sess.title,step:0,elapsed:0,started:Date.now(),steps:[],data:{}};
 const newW=newWordsFor(idx).map(w=>w[0]);const seenPool=introducedWords(idx).map(w=>w[0]).filter(w=>!newW.includes(w)&&S.vocab[w]);
 const review=seenPool.sort((a,b)=>vstat(a).lvl-vstat(b).lvl).slice(0,3);
 const cards=[...newW,...review];
 if(sess.type==='lesson'){const isV=T[sess.topic].cat==='verbal';
  cur.steps=[{k:'warm',title:'Word warm-up',min:5,cards},{k:'lesson',title:'Learn',min:8,topic:sess.topic},{k:'quiz',title:'Practice',min:15,qs:isV?topicQs(sess.topic,10):topicQs(sess.topic,10)},{k:'quiz',title:isV?'Math mix':'Verbal drill',min:8,qs:isV?mixedMath(shuf(ALLMATH.filter(id=>SESSIONS.findIndex(s=>s.topic===id)<idx)).slice(0,5)||ALLMATH,8):verbalSet(8,idx)},{k:'wrap',title:'Wrap-up',min:4}]}
 else if(sess.type==='review'){cur.steps=[{k:'warm',title:'Word warm-up',min:5,cards},{k:'sheet',title:'Cheat sheet',min:6,topics:sess.topics},{k:'quiz',title:'Mixed practice',min:18,qs:mixedMath(shuf(sess.topics),12)},{k:'quiz',title:'Verbal drill',min:7,qs:verbalSet(8,idx)},{k:'wrap',title:'Wrap-up',min:4}]}
 else if(sess.type==='weak'){const weak=weakTopics(3);const topics=weak.length?weak:shuf(ALLMATH).slice(0,3);cur.data.weak=topics;cur.steps=[{k:'warm',title:'Word warm-up',min:5,cards},{k:'sheet',title:'Your weak spots',min:6,topics},{k:'quiz',title:'Targeted practice',min:18,qs:mixedMath(topics,12)},{k:'quiz',title:'Verbal drill',min:7,qs:verbalSet(8,idx)},{k:'wrap',title:'Wrap-up',min:4}]}
 else if(sess.type==='test'){const qs=sess.kind==='verbal'?verbalSet(sess.n,null):mathTest(sess.n,sess.kind);cur.steps=[{k:'warm',title:'Word warm-up',min:4,cards},{k:'test',title:sess.title,min:sess.min,qs,limit:sess.min*60,kind:sess.kind},{k:'wrap',title:'Results',min:5}]}
 else if(sess.type==='read'){const a=sess.pi*2,b=sess.pi*2+1;
  const skills=['rd_main','rd_infer','rd_vocab','rd_tone'];const skill=skills[sess.pi%skills.length];
  cur.steps=[{k:'warm',title:'Word warm-up',min:5,cards},{k:'lesson',title:'Reading skill',min:7,topic:skill},
   {k:'quiz',title:'Passage 1',min:11,qs:passageSet(a)},{k:'quiz',title:'Passage 2',min:11,qs:passageSet(b)},
   {k:'wrap',title:'Wrap-up',min:4}]}
 else if(sess.type==='essay'){
  cur.steps=[{k:'warm',title:'Word warm-up',min:4,cards},{k:'lesson',title:'How to write it',min:6,topic:'wr_essay'},
   {k:'essay',title:'Write your essay',min:30,prompt:ESSAY_PROMPTS[sess.prompt%ESSAY_PROMPTS.length],promptIdx:sess.prompt%ESSAY_PROMPTS.length,limit:30*60,phase:'plan'},
   {k:'quiz',title:'Essay know-how',min:5,qs:topicQs('wr_essay',5)},{k:'wrap',title:'Wrap-up',min:3}]}
 else if(sess.type==='final'){cur.steps=[{k:'warm',title:'Word warm-up',min:5,cards},{k:'final',title:'Test-day game plan',min:8},{k:'quiz',title:'Confidence mix',min:12,qs:mixedMath(shuf(ALLMATH),8)},{k:'quiz',title:'Verbal victory lap',min:7,qs:verbalSet(8,idx)},{k:'wrap',title:'You did it!',min:3}]}
 cur.steps.forEach(st=>{if(st.qs){st.i=0;st.ans=[];st.picked=null}if(st.cards){st.ci=0;st.flipped=false;st.res=[]}});
 return cur}
