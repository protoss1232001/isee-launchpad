const OFF_SECS=[['vr','Verbal Reasoning',34],['qr','Quantitative Reasoning',38],['rc','Reading Comprehension',25],['ma','Mathematics Achievement',30]];
const OFF_SRCS=['ERB guide: What to Expect on the ISEE','Another official ERB practice test','The real ISEE (score report)','Ivy Global','Test Prep Works','Another book or tutor'];
const offSorted=()=>S.official.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
const shortDate=iso=>new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const offExtra=x=>[x.st!=null?'stanine '+x.st:'',x.pr!=null?ord(x.pr)+' percentile':'',x.ss!=null?'scaled '+x.ss:''].filter(Boolean).join(' · ');
function spark(pts){const W=200,H=56,px=6,py=6;const X=i=>px+(pts.length>1?i*(W-2*px)/(pts.length-1):0),Y=v=>py+(100-v)*(H-2*py)/100;
 const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
 return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Percent correct over ${pts.length} tests: ${pts.map(p=>p.v+'%').join(', ')}"><line x1="${px}" x2="${W-px}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-width="1"/><path d="${line}" fill="none" stroke="var(--bar1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
 ${pts.map((p,i)=>`<g><title>${esc(p.tip)}</title><circle cx="${X(i)}" cy="${Y(p.v)}" r="4" fill="var(--bar1)" stroke="var(--paper)" stroke-width="2"/><circle cx="${X(i)}" cy="${Y(p.v)}" r="12" fill="transparent"/></g>`).join('')}</svg>`}
function offTile([k,label]){const all=offSorted().filter(o=>o.sec[k]);if(!all.length)return `<div class="otile"><div class="otl">${label}</div><div class="statn muted">—</div><div class="muted small">No results yet</div></div>`;
 const P=o=>pct(o.sec[k].c,o.sec[k].t);const withC=all.filter(o=>o.sec[k].c!=null);const rep=all.filter(o=>offExtra(o.sec[k])).pop();
 let body=`<div class="statn muted">—</div><div class="muted small">No number correct logged</div>`,trend='';
 if(withC.length){const last=withC[withC.length-1],x=last.sec[k];const same=withC.filter(o=>o.src===last.src);
  body=`<div class="statn">${P(last)}%</div><div class="muted small">${x.c} of ${x.t} correct · ${shortDate(last.date)}<br>${esc(last.src)}</div>`;
  if(same.length>1){const d=P(last)-P(same[0]);
   trend=`<div class="odelta">${d>0?`<span class="up">▲</span> ${d}`:d<0?`<span class="down">▼</span> ${-d}`:'No change'}${d?` percentage point${Math.abs(d)===1?'':'s'}`:''} since the first result from this source</div>`+spark(same.map(o=>({v:P(o),tip:`${shortDate(o.date)}: ${o.sec[k].c} of ${o.sec[k].t} (${P(o)}%)`})))}}
 return `<div class="otile"><div class="otl">${label}</div>${body}${rep?`<div class="small">Reported: ${offExtra(rep.sec[k])} <span class="muted">(${esc(rep.src)}, ${shortDate(rep.date)})</span></div>`:''}${trend}</div>`}

 ${OFF_SECS.map(([k,l,n])=>`<tr><td>${l}</td>${[['c',''],['t',n],['ss',''],['pr',''],['st','']].map(([f,v])=>`<td data-l="${({c:'Number correct',t:'Out of',ss:'Scaled score',pr:'Percentile',st:'Stanine'})[f]}"><input id="o_${k}_${f}" inputmode="numeric" autocomplete="off" value="${blank(v)}" aria-label="${l}: ${({c:'number correct',t:'out of',ss:'scaled score',pr:'percentile',st:'stanine'})[f]}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>
 <p class="muted small">Leave a section's boxes empty if it was not taken. Fill in scaled score (760 to 940), percentile or stanine only when the test or score report gives them to you; number correct can then be left empty. For a score report, check the "Out of" number against the report.</p>

function readOfficial(){const g=id=>($('#'+id)?$('#'+id).value:'').trim();const errs=[];const sec={};
 const date=g('o_date');if(!/^\d{4}-\d{2}-\d{2}$/.test(date))errs.push('Choose the date the test was taken.');
 const num=(v,lo,hi,what,label)=>{if(v==='')return null;if(!/^\d+$/.test(v)||+v<lo||+v>hi){errs.push(`${label}: ${what} must be a whole number from ${lo} to ${hi}.`);return undefined}return +v};
 for(const [k,label] of OFF_SECS){const c=g(`o_${k}_c`),others=['ss','pr','st'].map(f=>g(`o_${k}_${f}`));
  if(c===''&&!others.some(Boolean))continue;
  const ss=num(others[0],760,940,'Scaled score',label),pr=num(others[1],1,99,'Percentile',label),st=num(others[2],1,9,'Stanine',label);
  const x={};let ok=ss!==undefined&&pr!==undefined&&st!==undefined;
  if(c!==''){const t=num(g(`o_${k}_t`),1,100,'"Out of"',label);if(t===null)errs.push(`${label}: enter how many questions there were.`);
   const cc=num(c,0,t||100,'Number correct',label);if(t==null||cc==null)ok=false;else{x.c=cc;x.t=t}}
  if(ok){if(ss!=null)x.ss=ss;if(pr!=null)x.pr=pr;if(st!=null)x.st=st;sec[k]=x}}
 if(!errs.length&&!Object.keys(sec).length)errs.push('Enter a result for at least one section.');
 return {errs,entry:{id:Date.now(),date,src:g('o_src')||OFF_SRCS[0],sec}}}

 <section class="card"><h3>Recent sessions</h3>${hist.length?`<ul class="hist">${hist.map(([id,d])=>{const s=SESSIONS.find(x=>x.id===id);return `<li><span>${d.date}</span><b>${esc(s?s.title:'Session '+id)}</b><span>${d.score}% · ${d.mins} min</span></li>`}).join('')}</ul>`:'<p class="muted">No sessions finished yet.</p>'}</section>

 ${(()=>{try{return localStorage.getItem(KEY+'-rescue')}catch(e){return null}})()?`<p class="small"><b>Some older saved progress could not be read, so it was kept safe instead of being erased.</b> <button class="btn small" id="bk_rescue">Put it in the box above</button> Then copy it and send it to whoever maintains the app.</p>`:''}<div class="setrow"><button class="btn small" id="bk_copy">Copy backup</button><button class="btn small" id="bk_import">Import pasted backup</button><button class="btn small danger" id="bk_reset">Reset all progress</button></div></details></section>`}

function renderSession(){const c=S.cur;const st=c.steps[c.step];const totalMin=c.steps.reduce((a,s)=>a+s.min,0);
 const rail=c.steps.map((s,i)=>`<div class="rstep ${i<c.step?'done':i===c.step?'on':''}"><span class="rdot">${i<c.step?'✓':i+1}</span><span class="rlbl">${esc(s.title)}</span></div>`).join('');
 let body='';if(st.k==='warm')body=renderWarm(st);else if(st.k==='lesson')body=renderLesson(st);else if(st.k==='sheet')body=renderSheet(st);else if(st.k==='final')body=`<div class="card lesson"><h2>${esc(st.title)}</h2>${FINAL_TIPS}<div class="actions"><button class="btn primary" data-next>I'm ready. Let's practice</button></div></div>`;else if(st.k==='essay')body=renderEssay(st);else if(st.k==='quiz')body=renderQuiz(st,false);else if(st.k==='test')body=renderQuiz(st,true);else body=renderWrap();
 return `<header class="top session"><button class="btn ghost small" data-exit>‹ Save & exit</button><div class="stitle"><b>${esc(c.title)}</b><span class="muted">Step ${c.step+1} of ${c.steps.length} · ${esc(st.title)}${st.k==='test'?'':' · about '+st.min+' min'}</span></div><div class="timer" id="timer">${st.k==='test'?mm(Math.max(0,st.limit-(st.t||0))):mm(c.elapsed)}</div></header>
 <div class="rail">${rail}</div><main class="wrap narrow">${body}</main>`}

function renderWarm(st){const w=VOCAB.find(v=>v[0]===st.cards[st.ci]);if(!w)return `<div class="card"><p>No cards.</p><button class="btn primary" data-next>Continue</button></div>`;const isNew=!S.vocab[w[0]]||S.vocab[w[0]].seen===0;
 return `<div class="warm"><div class="eyebrow">Card ${st.ci+1} of ${st.cards.length} · ${isNew?'<span class="pill teal">new word</span>':'<span class="pill">review</span>'}</div>
 <button class="flash ${st.flipped?'flipped':''}" data-flipcard><div class="fface front"><div class="fword">${w[0]}</div><div class="fpos">${w[1]==='adj'?'adjective':w[1]==='v'?'verb':w[1]==='n'?'noun':'adverb'}</div><div class="fhint">tap to flip</div></div><div class="fface back"><div class="fdef">${w[2]}</div><div class="fsyn">${w[3].join(' · ')}</div><div class="fsent">${w[4].replace('___','<b>'+w[0]+'</b>')}</div></div></button>
 <div class="actions">${st.flipped?`<button class="btn bad" data-card="0">Still learning</button><button class="btn good" data-card="1">Got it</button>`:`<button class="btn ghost" data-flipcard>Flip the card</button>`}</div>
 <p class="muted small">Say the word out loud, guess the meaning, then flip. Be honest with "still learning": those words come back sooner.</p></div>`}
function renderLesson(st){const t=T[st.topic];return `<div class="card lesson"><div class="eyebrow">${CATS[t.cat]}</div><h2>${esc(t.t)}</h2>${t.lesson}<div class="actions"><button class="btn primary" data-next>Got it. Let's practice</button></div></div>`}
function renderSheet(st){const tips=st.topics.map(id=>{const t=T[id];const m=t.lesson.match(/<div class="tip"><b>Test tip<\/b>([\s\S]*?)<\/div>/);const s=S.topics[id];const n=s?s.r+s.w:0;return `<div class="sheetrow"><div><b>${esc(t.t)}</b> <span class="muted small">${n?pct(s.r,n)+'% so far':''}</span><div class="muted">${m?m[1]:''}</div></div><button class="btn small ghost" data-relearn="${id}">Re-read lesson</button></div>`}).join('');
 return `<div class="card lesson"><h2>${esc(st.title)}</h2><p class="muted">One key tip from each topic. Re-read any lesson you feel shaky on, then practice.</p>${tips}<div class="actions"><button class="btn primary" data-next>Start practice</button></div></div>`}
function renderQuiz(st,isTest){const q=st.qs[st.i];if(!q)return '';const picked=st.picked;const done=picked!=null;const letters='ABCD';const topicName=q.kind==='syn'?'Synonyms':q.kind==='sc'?'Sentence completion':!T[q.topic]?'':isTest&&T[q.topic].cat==='chal'?CATS.qr:T[q.topic].t;
 const dirs=q.kind==='syn'?'<p class="dirs">Select the word whose meaning is closest to the word in capital letters.</p>':q.kind==='sc'?'<p class="dirs">Select the word that best completes the sentence.</p>':q.pas?'<p class="dirs">Read the passage, then answer the question below it.</p>':'';
 const choices=q.ch.map((c,i)=>{let cls='';if(done&&!isTest){if(i===q.a)cls='right';else if(i===picked)cls='wrong'}else if(isTest&&picked===i)cls='sel';return `<button class="choice ${cls}" data-choice="${i}" ${done&&!isTest?'disabled':''}><span class="ltr">${letters[i]}</span><span class="ctext">${c}</span></button>`}).join('');
 const right=st.ans.filter(a=>a.ok).length;
 const head=isTest?`<div class="qhead"><span>Question ${st.i+1} of ${st.qs.length}</span><span class="muted">${topicName}</span></div>`:`<div class="qhead"><span>Question ${st.i+1} of ${st.qs.length}</span><span class="muted">${topicName} · ${right} correct</span></div>`;
 const fb=done&&!isTest?`<div class="feedback ${picked===q.a?'ok':'no'}" role="status" aria-live="polite"><b>${picked===q.a?pick(['Correct!','Nice work!','Yes!','Exactly right.','You got it.']):'Not quite.'}</b> ${q.exp}</div><div class="actions"><button class="btn primary" data-next-q autofocus>${st.i+1<st.qs.length?'Next question':'Finish this step'}</button></div>`:isTest?`<div class="actions between"><button class="btn ghost" data-prev-q ${st.i===0?'disabled':''}>‹ Back</button><span class="muted small">${st.ans.filter(a=>a&&a.pick!=null).length} of ${st.qs.length} answered</span>${st.i+1<st.qs.length?`<button class="btn" data-next-q>Next ›</button>`:`<button class="btn primary" data-submit>Submit test</button>`}</div>`:'';
 return `<div class="card quiz">${head}${dirs}${q.pas||''}<div class="qtext">${q.q}</div><div class="choices">${choices}</div>${fb}</div>${isTest?`<p class="muted small center">Timed section: no feedback until you submit. Skip and come back if you get stuck.</p>`:''}`}
function renderEssay(st){
 const words=(st.text||'').trim()?(st.text||'').trim().split(/\s+/).length:0;
 const left=Math.max(0,st.limit-(st.t||0));
 if(st.phase==='plan')return `<div class="card lesson"><div class="eyebrow">Step 1 · plan for about 5 minutes</div><h2>Your prompt</h2>
  <p class="prompt">${esc(st.prompt)}</p>
  <p class="muted">Jot notes, not sentences. You will have 30 minutes to write once you start, the same as the real test.</p>
  <label class="plan">My answer in one sentence<textarea id="pl0" rows="2" placeholder="I look up to ... because ...">${esc(st.p0||'')}</textarea></label>
  <label class="plan">Reason or moment 1<input id="pl1" value="${esc(st.p1||'')}" placeholder="a specific moment, not a general idea"></label>
  <label class="plan">Reason or moment 2<input id="pl2" value="${esc(st.p2||'')}"></label>
  <label class="plan">Reason or moment 3 (optional)<input id="pl3" value="${esc(st.p3||'')}"></label>
  <div class="actions"><button class="btn primary" data-essay-start>Start writing · 30 minutes</button></div></div>`;
 if(st.phase==='write')return `<div class="card lesson"><div class="cardhead"><div><div class="eyebrow">Step 2 · writing</div><p class="prompt">${esc(st.prompt)}</p></div><div class="timer big ${left<300?'low':''}">${mm(left)}</div></div>
  ${st.p1||st.p0?`<details class="planback" open><summary>Your plan</summary><ul>${[st.p0,st.p1,st.p2,st.p3].filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`:''}
  <textarea id="essay" class="essaybox" rows="16" placeholder="Start with a sentence that answers the question directly...">${esc(st.text||'')}</textarea>
  <div class="essaybar"><span class="muted small">${words} word${words===1?'':'s'}</span><button class="btn primary" data-essay-done>I'm finished</button></div></div>`;
 const checks=['I answered the question that was actually asked.','My opening sentence says my answer directly.','Every reason has a specific example or moment.','My closing says what it all adds up to.','I reread it for missing words, capital letters and periods.'];
 return `<div class="card lesson"><div class="eyebrow">Step 3 · check your work</div><h2>Read it back</h2>
  <p class="prompt">${esc(st.prompt)}</p>
  <div class="essayread">${(st.text||'').split(/\n+/).filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join('')||'<p class="muted">(nothing written)</p>'}</div>
  <p class="muted small">${words} words in ${mm(st.t||0)}. Your draft is saved on this device under Progress.</p>
  <h4>Check yourself honestly</h4>
  <div class="checks">${checks.map((c,i)=>`<label><input type="checkbox" data-chk="${i}" ${st.chk&&st.chk[i]?'checked':''}> ${c}</label>`).join('')}</div>
  <div class="actions"><button class="btn ghost" data-model="${st.promptIdx==null?0:st.promptIdx}">Compare with a model essay</button><button class="btn primary" data-next>Finish this step</button></div></div>`}
function modelHTML(m){
 return `<div class="modelessay"><div class="eyebrow">Model essay</div><p class="prompt">${esc(m.prompt)}</p>
  <p class="muted">${esc(m.why)}</p>
  ${m.paras.map((pa,i)=>`<div class="mpara"><p>${esc(pa.t)}</p><ul class="mnotes">${pa.n.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`).join('')}
  <p class="muted small">This is one strong answer, not the only one. Copying its sentences will not help; copying how it uses one real moment per reason will.</p></div>`}
function showModel(m){const d=document.createElement('div');d.className='modal';
 d.innerHTML=`<div class="card lesson modalcard">${modelHTML(m)}<div class="actions"><button class="btn primary" data-close>Close</button></div></div>`;
 document.body.appendChild(d);d.querySelector('[data-close]').onclick=()=>d.remove();
 d.onclick=e=>{if(e.target===d)d.remove()}}
function renderWrap(){const c=S.cur;const quizzes=c.steps.filter(s=>s.k==='quiz'||s.k==='test');let r=0,t=0,sr=0,stn=0;const missed=[],slowRight=[],timed=[],firstOfPas=new Set();
 quizzes.forEach(s=>{const seen=new Set();s.qs.forEach((q,i)=>{if(q.pas&&!seen.has(q.pas)){seen.add(q.pas);firstOfPas.add(q)}})});
 const isSlow=(q,a)=>a&&a.secs!=null&&a.pick!=null&&!firstOfPas.has(q)&&a.secs>slowAt(q);
 quizzes.forEach(s=>{s.ans.forEach((a,i)=>{if(!a)return;const q=s.qs[i];if(q.stretch){stn++;if(a.ok)sr++}else{t++;if(a.ok)r++}
  if(a.secs!=null&&a.pick!=null)timed.push({q,a});if(!a.ok)missed.push({q,pick:a.pick,a});else if(isSlow(q,a))slowRight.push({q,a})})});
 const avg=timed.length?Math.round(timed.reduce((x,m)=>x+m.a.secs,0)/timed.length):0,pace=timed.length?Math.round(timed.reduce((x,m)=>x+PACE[qArea(m.q)],0)/timed.length):0;
 const nSlow=timed.filter(m=>isSlow(m.q,m.a)).length;
 const pacing=timed.length>=3?`<p class="muted">Pacing: about <b>${avg} seconds</b> a question. The real test allows about ${pace}.${nSlow?` ${nSlow} question${nSlow===1?'':'s'} took much longer than that. On test day, skip a question like that, circle it, and come back.`:''}</p>`:'';
 const tpill=(q,a)=>a&&a.secs!=null&&a.pick!=null?`<span class="pill ${isSlow(q,a)?'warn':''}">⏱ ${mm(a.secs)}</span>`:'';
 const why=m=>m.a&&m.a.fk&&m.a.mid?`<div class="whyrow"><span class="muted small">Why did you miss it?</span>${Object.keys(TAGS).filter(t=>t!=='time').map(t=>`<button class="chip ${m.a.tag===t?'on':''}" data-tag="${t}" data-fk="${esc(m.a.fk)}" data-mid="${esc(m.a.mid||'')}">${TAGS[t]}</button>`).join('')}</div>`:'';
 const warm=c.steps.find(s=>s.k==='warm');const learned=warm?warm.res.filter(x=>x.ok).length:0;const test=c.steps.find(s=>s.k==='test');
 const essayStep=c.steps.find(x=>x.k==='essay');const cardsOnly=!t&&warm&&!essayStep;const seenCards=warm?warm.res.length:0;
 const score=cardsOnly?pct(learned,seenCards):pct(r,t);
 const words=cardsOnly?(score>=80?'Great recall!':'Good practice. The words you missed come back sooner.')
   :score>=90?'Outstanding!':score>=75?'Strong work!':score>=60?'Good effort. Review the misses below.':'Tough one. The review below is where the learning happens.';
 const testNote=test?`<p class="muted">${test.kind==='verbal'?'On the real test you would have 20 minutes for 34 questions.':test.kind==='read'?'On the real test, Reading Comprehension is 25 questions in 25 minutes, across five passages.':test.kind==='qr'?'On the real test, Quantitative Reasoning is 38 questions in 35 minutes. About a third of this practice section came from the challenge sets, because the real one includes hard multi-step questions.':'On the real test, Mathematics Achievement is 30 questions in 30 minutes.'} You used ${mm(test.t||0)}. ${(test.t||0)>test.limit-10?'You ran out of time: practice moving on from hard questions faster.':'Good pacing.'}</p>`:'';
 return `<div class="card wrap-card"><div class="celebrate">${score>=75?'🎉':'💪'}</div><h2>${words}</h2><div class="wrapstats"><div>${ring(score,88)}<span>${cardsOnly?'words known':'score'}</span></div>${cardsOnly?'':`<div><div class="statn">${r}/${t}</div><span>correct</span></div>`}<div><div class="statn">${learned}${cardsOnly?'/'+seenCards:''}</div><span>words "got it"</span></div><div><div class="statn">${Math.round(c.elapsed/60)}</div><span>minutes</span></div></div>${stn?`<p class="muted">Challenge questions: <b>${sr} of ${stn}</b> right. They are extra, so they do not count toward your score.</p>`:''}${testNote}
 ${cardsOnly?'':''}${pacing}${missed.length?`<h3>Review what you missed</h3>${missed.some(m=>m.a&&m.a.mid)?'<p class="muted small">Wrong answers go on your focus list. The app guessed why you missed each one; tap a different reason if it guessed wrong.</p>':''}<div class="missed">${missed.map(m=>`<div class="miss"><div class="qtext small">${m.q.q}</div><div><span class="pill bad">${m.pick==null?'You skipped this one':'You chose: '+m.q.ch[m.pick]}</span> <span class="pill good">Answer: ${m.q.ch[m.q.a]}</span> ${tpill(m.q,m.a)}</div><div class="muted">${m.q.exp}</div>${why(m)}</div>`).join('')}</div>`:cardsOnly?`<p class="muted">You marked ${learned} of ${seenCards} cards as known. The rest will come back in your next warm-up.</p>`:'<p class="muted">No misses. Perfect round!</p>'}
 ${slowRight.length?`<details class="slowright"><summary>${slowRight.length} right answer${slowRight.length===1?' was':'s were'} slow</summary><div class="missed">${slowRight.map(m=>`<div class="miss"><div class="qtext small">${m.q.q}</div><div><span class="pill good">Answer: ${m.q.ch[m.q.a]}</span> ${tpill(m.q,m.a)}</div><div class="muted">${m.q.exp}</div></div>`).join('')}</div></details>`:''}
 <div class="actions"><button class="btn primary big" data-finish>Finish session</button></div></div>`}

let timerHandle=null;
function startSession(sess){if(S.paused&&S.paused.id===sess.id)S.paused=null;S.cur=buildSession(sess);S.view='home';save();render()}
function quickSession(spec){const [kind,a,b,c]=spec.split(':');let cur;
 if(kind==='topic'){cur={id:'quick',type:'quick',title:T[a].t,step:0,elapsed:0,steps:[{k:'quiz',title:'Practice',min:10,qs:topicQs(a,10),i:0,ans:[],picked:null},{k:'wrap',title:'Results',min:2}]}}
 else if(kind==='test'){const n=+b,min=+c;cur={id:'quick',type:'quick',title:a==='verbal'?'Verbal Reasoning':a==='read'?'Reading Comprehension':a==='qr'?'Quantitative Reasoning':'Mathematics Achievement',step:0,elapsed:0,steps:[{k:'test',title:'Timed section',min,qs:a==='verbal'?verbalSet(n,null):a==='read'?readingTest(n):mathTest(n,a),i:0,ans:[],picked:null,limit:min*60,t:0,kind:a,tq:[]},{k:'wrap',title:'Results',min:3}]}}
 else if(kind==='focus'){const qs=focusQs(8);if(!qs.length){alert('Your focus list is empty.');return}
  cur={id:'quick',type:'quick',title:'Focus practice',step:0,elapsed:0,steps:[{k:'quiz',title:'Focus list',min:8,qs,i:0,ans:[],picked:null},{k:'wrap',title:'Results',min:2}]}}
 else if(kind==='chal'){if(!S.chalSeen.includes(a))S.chalSeen.push(a);
  cur={id:'quick',type:'quick',title:T[a].t,step:0,elapsed:0,steps:[{k:'lesson',title:'Strategy',min:4,topic:a},{k:'quiz',title:'Challenge set',min:14,qs:topicQs(a,8),i:0,ans:[],picked:null},{k:'wrap',title:'Results',min:2}]}}
 else if(kind==='read'||kind==='read2'){const n=kind==='read2'?2:1;const start=R(0,PASSAGES.length-1);
  const steps=[];for(let i=0;i<n;i++)steps.push({k:'quiz',title:`Passage ${i+1}`,min:11,qs:passageSet(start+i),i:0,ans:[],picked:null});
  cur={id:'quick',type:'quick',title:'Reading practice',step:0,elapsed:0,steps:[...steps,{k:'wrap',title:'Results',min:3}]}}
 else if(kind==='essay'){const epi=R(0,ESSAY_PROMPTS.length-1);cur={id:'quick',type:'quick',title:'Essay practice',step:0,elapsed:0,steps:[
   {k:'essay',title:'Write your essay',min:30,prompt:ESSAY_PROMPTS[epi],promptIdx:epi,limit:30*60,phase:'plan'},{k:'wrap',title:'Done',min:2}]}}
 else if(kind==='flash'){const seen=VOCAB.filter(w=>S.vocab[w[0]]).map(w=>w[0]).sort((x,y)=>vstat(x).lvl-vstat(y).lvl);const cards=[...seen.slice(0,12),...shuf(VOCAB.filter(w=>!S.vocab[w[0]]).map(w=>w[0])).slice(0,20-Math.min(12,seen.length))];cur={id:'quick',type:'quick',title:'Flashcard drill',step:0,elapsed:0,steps:[{k:'warm',title:'Flashcards',min:8,cards,ci:0,flipped:false,res:[]},{k:'wrap',title:'Done',min:1}]}}
 S.cur=cur;save();render()}
function tick(){if(!S.cur)return;const c=S.cur;const st=c.steps[c.step];
 if(st.k==='essay'&&st.phase==='write'){ // the essay is timed like the real thing
   if(st.t0==null)st.t0=Date.now()-(st.t||0)*1000;
   st.t=Math.floor((Date.now()-st.t0)/1000);c.elapsed++;
   const el=document.querySelector('.timer.big');if(el){el.textContent=mm(Math.max(0,st.limit-st.t));if(st.limit-st.t<300)el.classList.add('low')}
   if(st.t>=st.limit){const e=$('#essay');if(e)st.text=e.value;st.phase='check';
     S.essays=S.essays||[];S.essays.unshift({date:today(),prompt:st.prompt,pi:st.promptIdx||0,text:st.text||'',mins:Math.round(st.t/60),words:(st.text||'').trim()?st.text.trim().split(/\s+/).length:0});S.essays=S.essays.slice(0,20);
     markDay();save();render();return}
   return}
 if(st.k==='test'){ // a timed section runs on the clock, even if the app is in the background
   if(st.t0==null)st.t0=Date.now()-(st.t||0)*1000;
   st.t=Math.floor((Date.now()-st.t0)/1000);c.elapsed++;
   if(st.tq&&document.visibilityState==='visible')st.tq[st.i]=(st.tq[st.i]||0)+1;
   if(st.t>=st.limit){submitTest(true);return}}
 else{if(document.visibilityState!=='visible')return;c.elapsed++;if(st.k==='quiz'&&st.picked==null)st.qt=(st.qt||0)+1}const el=$('#timer');if(el)el.textContent=st.k==='test'?mm(Math.max(0,st.limit-st.t)):mm(c.elapsed);if(c.elapsed%15===0)save()}
function nextStep(){const c=S.cur;c.step++;if(c.step>=c.steps.length)c.step=c.steps.length-1;save();render();window.scrollTo(0,0)}
function submitTest(timedOut){const st=S.cur.steps[S.cur.step];let blank=0;st.qs.forEach((q,i)=>{const a=st.ans[i];const p=a?a.pick:null;if(p==null)blank++;
  st.ans[i]={pick:p,ok:p===q.a,secs:st.tq?st.tq[i]:undefined};if(q.topic)recordTopic(q.topic,p===q.a);if(q.word)recordVocab(q.word,p===q.a);afterAnswer(q,st.ans[i])});
 st.timedOut=!!timedOut;if(timedOut&&blank)logMiss('time','test',Date.now().toString(36)+'-'+(++MISS_SEQ));nextStep()}
function finishSession(){const c=S.cur;if(S.paused&&S.paused.id===c.id)S.paused=null;if(c.type!=='quick'){let r=0,t=0;c.steps.filter(s=>s.qs).forEach(s=>s.ans.forEach((a,i)=>{if(a&&!s.qs[i].stretch){t++;if(a.ok)r++}}));S.done[c.id]={date:today(),score:pct(r,t),mins:Math.round(c.elapsed/60)};markDay()}S.cur=null;save();render()}

 document.querySelectorAll('[data-exit]').forEach(b=>b.onclick=()=>{

     S.cur=null}else{S.paused=c;S.cur=null}

 document.querySelectorAll('[data-next]').forEach(b=>b.onclick=nextStep);
 document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>showModel(modelFor(+b.dataset.model)));
 document.querySelectorAll('[data-relearn]').forEach(b=>b.onclick=()=>{const t=T[b.dataset.relearn];const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="card lesson modalcard"><div class="eyebrow">${CATS[t.cat]}</div><h2>${esc(t.t)}</h2>${t.lesson}<div class="actions"><button class="btn primary" data-close>Back to cheat sheet</button></div></div>`;document.body.appendChild(d);d.querySelector('[data-close]').onclick=()=>d.remove()});
 if(st.k==='warm'){document.querySelectorAll('[data-flipcard]').forEach(b=>b.onclick=()=>{st.flipped=!st.flipped;render()});document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{const ok=b.dataset.card==='1';const w=st.cards[st.ci];recordVocab(w,ok);st.res.push({w,ok});st.ci++;st.flipped=false;markDay();if(st.ci>=st.cards.length)nextStep();else{save();render()}})}
 if(st.k==='essay'){
  const g=id=>{const e=$('#'+id);return e?e.value:''};
  document.querySelectorAll('[data-essay-start]').forEach(b=>b.onclick=()=>{st.p0=g('pl0');st.p1=g('pl1');st.p2=g('pl2');st.p3=g('pl3');st.phase='write';st.t=0;st.t0=Date.now();save();render()});
  const box=$('#essay');if(box){box.oninput=()=>{st.text=box.value;save();const c=document.querySelector('.essaybar .muted');if(c){const n=box.value.trim()?box.value.trim().split(/\s+/).length:0;c.textContent=n+' word'+(n===1?'':'s')}};box.focus()}
  document.querySelectorAll('[data-essay-done]').forEach(b=>b.onclick=()=>{const e=$('#essay');if(e)st.text=e.value;st.phase='check';
    S.essays=S.essays||[];S.essays.unshift({date:today(),prompt:st.prompt,pi:st.promptIdx||0,text:st.text||'',mins:Math.round((st.t||0)/60),words:(st.text||'').trim()?st.text.trim().split(/\s+/).length:0});S.essays=S.essays.slice(0,20);
    markDay();save();render()});
  document.querySelectorAll('[data-chk]').forEach(b=>b.onchange=()=>{st.chk=st.chk||[];st.chk[+b.dataset.chk]=b.checked;save()})}
 if(st.k==='quiz'){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(st.picked!=null)return;const i=+b.dataset.choice;const q=st.qs[st.i];st.picked=i;st.ans[st.i]={pick:i,ok:i===q.a,secs:st.qt||0};st.qt=0;if(q.topic)recordTopic(q.topic,i===q.a);if(q.word)recordVocab(q.word,i===q.a);afterAnswer(q,st.ans[st.i]);save();render();const fb=$('.feedback');if(fb)fb.scrollIntoView({behavior:'smooth',block:'nearest'})});
  document.querySelectorAll('[data-next-q]').forEach(b=>b.onclick=()=>{st.i++;st.picked=null;if(st.i>=st.qs.length){st.i=st.qs.length-1;nextStep()}else{save();render();window.scrollTo(0,0)}})}
 if(st.k==='test'){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const i=+b.dataset.choice;st.picked=i;st.ans[st.i]={pick:i,ok:false};save();render()});
  document.querySelectorAll('[data-next-q]').forEach(b=>b.onclick=()=>{st.i++;st.picked=st.ans[st.i]?st.ans[st.i].pick:null;save();render();window.scrollTo(0,0)});
  document.querySelectorAll('[data-prev-q]').forEach(b=>b.onclick=()=>{if(st.i>0){st.i--;st.picked=st.ans[st.i]?st.ans[st.i].pick:null;save();render()}});
  document.querySelectorAll('[data-submit]').forEach(b=>b.onclick=()=>{const un=st.qs.length-st.ans.filter(a=>a&&a.pick!=null).length;if(un&&!confirm(`${un} question${un>1?'s are':' is'} unanswered. Submit anyway?`))return;submitTest()})}
 document.querySelectorAll('[data-finish]').forEach(b=>b.onclick=finishSession);
 document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{const k=b.dataset.fk,mid=b.dataset.mid,tag=b.dataset.tag;setTag(k,mid,tag);

   b.parentNode.querySelectorAll('[data-tag]').forEach(x=>x.classList.toggle('on',x===b))});
 if(!timerHandle)timerHandle=setInterval(tick,1000)}
