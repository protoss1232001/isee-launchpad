  {s:`A movie ticket costs $${R(6,12)} and popcorn costs $${R(3,7)}. Which expression shows the cost of t tickets and one popcorn?`,fix:(m)=>{const [tk,pc]=m;return {e:`${tk}t + ${pc}`,d:[`${tk} + ${pc}t`,`${tk+pc}t`,`${tk}(t + ${pc})`]}}},
  {s:`${nm()} had $${R(20,50)} and spent $${R(3,9)} on each of b books. Which expression shows the money left?`,fix:(m)=>{const [h,c]=m;return {e:`${h} − ${c}b`,d:[`${c}b − ${h}`,`${h} − ${c} − b`,`(${h} − ${c})b`]}}},
  {s:`A rectangle has a width of w and a length that is ${R(2,6)} more than the width. Which expression shows its perimeter?`,fix:(m)=>{const [k]=m;return {e:`4w + ${2*k}`,d:[`2w + ${k}`,`w(w + ${k})`,`4w + ${k}`]}}}];
  const f=pick(forms);const nums=f.s.match(/\d+/g).map(Number);const r=f.fix(nums);return mc(f.s,r.e,r.d,`Translate each part into symbols: ${r.e}.`)}
 const a=R(2,5),b=R(1,5),x=R(2,6),y=R(1,5);const v=a*x+b*y;
 return mc(`If a = ${x} and b = ${y}, what is ${a}a + ${b}b?`,v,[a*x-b*y,(a+b)*(x+y),a+x+b+y,a*x*b*y],`Substitute: ${a}(${x}) + ${b}(${y}) = ${a*x} + ${b*y} = ${v}.`)}};

T.a_eq1={t:'Solving One-Step Equations',cat:'alg',lesson:`
<p>To solve an equation, get the variable <b>alone</b> using the <b>inverse</b> (opposite) operation. Whatever you do to one side, do to the other.</p>
${table(['Equation','Inverse operation','Solution'],[['x + 7 = 12','subtract 7 from both sides','x = 5'],['x − 4 = 9','add 4 to both sides','x = 13'],['3x = 21','divide both sides by 3','x = 7'],['x ÷ 5 = 6','multiply both sides by 5','x = 30']])}
<p><b>Check</b> by substituting back: 3(7) = 21 ✓.</p>
${ex('Some students were in class. 11 more arrived, and now there are 17. How many were there at first?','? + 11 = 17 → 17 − 11 = <b>6</b>. Working backwards with the inverse operation solves "unknown start" problems.')}
${tip('A missing-number box □ works the same as a variable: □ × 4 = 36 means 36 ÷ 4 = 9.')}`,
gen(){const t=R(1,5);
 if(t===1){const x=R(2,30),a=R(2,40);return mc(`Solve: x + ${a} = ${x+a}`,x,[x+a+a,x+2*a,a,x+1],`Subtract ${a} from both sides: x = ${x+a} − ${a} = ${x}.`)}
 if(t===2){const x=R(20,60),a=R(2,15);return mc(`Solve: x − ${a} = ${x-a}`,x,[x-2*a,x-a,x+a,x-1].filter(v=>v>0),`Add ${a} to both sides: x = ${x-a} + ${a} = ${x}.`)}
 if(t===3){const a=R(2,9),x=R(2,12);return mc(`Solve: ${a}x = ${a*x}`,x,[a*x-a,a*x+a,x+a,a*a*x],`Divide both sides by ${a}: x = ${a*x} ÷ ${a} = ${x}.`)}
 if(t===4){const a=R(2,9),x=R(2,12);return mc(`Solve: x ÷ ${a} = ${x}`,x*a,[x+a,x*a+a,x*a-a,x],`Multiply both sides by ${a}: x = ${x} × ${a} = ${x*a}.`)}
 const n=nm();const forms=[
  ()=>{const start=R(5,20),add=R(3,15);return {q:`Some kids were at the park. ${add} more came, and then there were ${start+add}. How many kids were at the park at first?`,a:start,w:[start+2*add,add,start+add,start-1],e:`? + ${add} = ${start+add}. Work backwards: ${start+add} − ${add} = ${start}.`}},
  ()=>{const each=R(3,9),g=R(4,9);return {q:`${n} shares ${each*g} stickers equally among some friends. Each friend gets ${each} stickers. How many friends are there?`,a:g,w:[each*g-each,each+g,each*g,g+1],e:`? × ${each} = ${each*g}. Divide: ${each*g} ÷ ${each} = ${g}.`}},
  ()=>{const had=R(20,60),spent=R(5,19);return {q:`${n} spent $${spent} and has $${had-spent} left. How much money did ${n} have at the start?`,a:'$'+had,w:['$'+(had-2*spent),'$'+(had-spent),'$'+(had+spent),'$'+(had-1)],e:`? − ${spent} = ${had-spent}. Add back: ${had-spent} + ${spent} = ${had}.`}},
  ()=>{const a=R(3,9),b=R(2,9);return {q:`Tommy has ${a} more toys than Bobby. Tommy has ${a+b} toys. How many toys does Bobby have?`,a:b,w:[a+b+a,a,a+b,b+1],e:`? + ${a} = ${a+b}. Bobby has ${a+b} − ${a} = ${b} toys.`}}];
 const f=pick(forms)();return mc(f.q,f.a,f.w,f.e)}};

T.a_eq2={t:'Two-Step Equations & Inequalities',cat:'alg',lesson:`
<p>For a <b>two-step equation</b>, undo addition or subtraction first, then undo multiplication or division.</p>
${ex('Solve 3x − 7 = 11','Add 7: 3x = 18. Divide by 3: <b>x = 6</b>. Check: 3(6) − 7 = 11 ✓')}
<p>An <b>inequality</b> compares with &lt;, &gt;, ≤, or ≥. Its solution is a whole set of numbers. Solve it just like an equation.</p>
<p>On a <b>number line</b>: a <b>closed</b> (filled) dot means the number is included (≤ or ≥). An <b>open</b> dot means it is not (&lt; or &gt;). The arrow points toward the solutions.</p>
${svgNumLine(1,true,1)}
<p>This shows <b>x ≥ 1</b>: the dot on 1 is filled, and the arrow points to the greater numbers.</p>
${tip('"At least 5" means ≥ 5. "At most 5" means ≤ 5. "More than 5" means > 5 (5 itself is not included).')}`,
gen(){const t=R(1,5);
 if(t===1){const a=R(2,6),x=R(2,9),b=R(1,9);const op=pick(['+','−']);const rhs=op==='+'?a*x+b:a*x-b;
  return mc(`Solve: ${a}x ${op} ${b} = ${rhs}`,x,[x+1,x-1,rhs-b,x+a,x*2].filter(v=>v>0),`First ${op==='+'?'subtract':'add'} ${b}: ${a}x = ${a*x}. Then divide by ${a}: x = ${x}. Check: ${a}(${x}) ${op} ${b} = ${rhs} ✓`)}
 if(t===2){const pt=R(-4,4);const closed=pick([true,false]);const dir=pick([1,-1]);const sym=dir>0?(closed?'≥':'>'):(closed?'≤':'<');const opp=dir>0?(closed?'>':'≥'):(closed?'<':'≤');const rev=dir>0?(closed?'≤':'<'):(closed?'≥':'>');
  return mc(`Which inequality is shown on the number line?${svgNumLine(pt,closed,dir)}`,`x ${sym} ${pt}`,[`x ${opp} ${pt}`,`x ${rev} ${pt}`,`x ${dir>0?(closed?'<':'≤'):(closed?'>':'≥')} ${pt}`],`The dot on ${pt} is ${closed?'filled, so '+pt+' is included (≤ or ≥)':'open, so '+pt+' is not included (< or >)'}. The arrow points ${dir>0?'right toward greater numbers':'left toward lesser numbers'}. So x ${sym} ${pt}.`)}
 if(t===3){const a=R(5,14);const sym=pick(['<','>','≤','≥']);const cands=[a-3,a-1,a,a+1,a+4].filter(v=>v>0);const ok=v=>sym==='<'?v<a:sym==='>'?v>a:sym==='≤'?v<=a:v>=a;const good=cands.filter(ok),bad=cands.filter(v=>!ok(v));if(!good.length||bad.length<3)return this.gen();
  const ans=pick(good);return mc(`Which value of x makes <b>x ${sym} ${a}</b> true?`,ans,shuf(bad),`x ${sym} ${a} means x is ${sym==='<'?'less than':sym==='>'?'greater than':sym==='≤'?'less than or equal to':'greater than or equal to'} ${a}. ${ans} works; ${bad.slice(0,3).join(', ')} do not.`)}
 if(t===4){const forms=[
  {w:'at least',s:'≥'},{w:'at most',s:'≤'},{w:'more than',s:'>'},{w:'fewer than',s:'<'},{w:'no more than',s:'≤'},{w:'no fewer than',s:'≥'}];const f=pick(forms);const n=R(5,30);
  return mc(f.w.includes('than')?`A raft can carry <b>${f.w}</b> ${n} people. Which inequality shows the number of people, x, allowed on the raft?`:`Riders must be <b>${f.w}</b> ${n} years old. Which inequality shows the ages, x, that are allowed?`,`x ${f.s} ${n}`,['<','>','≤','≥'].filter(s=>s!==f.s).map(s=>`x ${s} ${n}`),`"${f.w}" means ${f.s}. ${f.s==='≥'||f.s==='≤'?'The number '+n+' itself is allowed, so the sign includes "or equal to."':'The number '+n+' itself is not included.'}`)}
 if(R(1,2)===1){const a=R(2,5),x=R(2,9),b=R(1,9);const op=pick(['+','−']);const rhs=op==='+'?a*x+b:a*x-b;const sym=pick(['>','<','≥','≤']);
  const dir=sym==='>'||sym==='≥';const inc=sym==='≥'||sym==='≤';
  return mc(`Solve for x: ${a}x ${op} ${b} ${sym} ${rhs}`,`x ${sym} ${x}`,[`x ${dir?(inc?'≤':'<'):(inc?'≥':'>')} ${x}`,`x ${sym} ${x+1}`,`x ${sym} ${rhs-b}`,`x ${sym} ${x*a}`],`Solve it exactly like an equation. ${op==='+'?'Subtract':'Add'} ${b} from both sides: ${a}x ${sym} ${a*x}. Then divide both sides by ${a}: x ${sym} ${x}. Because ${a} is positive, the sign does not flip.`)}
 const a=R(2,5),x=R(2,8),b=R(1,6);const cost=a*x+b;const n=nm();
 return mc(`${n} paid $${cost} for ${a} notebooks and a $${b} pen. Each notebook costs the same. What is the price of one notebook?`,'$'+x,['$'+(cost-b),'$'+Math.round((cost)/a*100)/100,'$'+(x+1),'$'+(cost-a)],`${a}n + ${b} = ${cost}. Subtract the pen: ${a}n = ${cost-b}. Divide by ${a}: n = ${x}. Each notebook costs $${x}.`)}};

// ===== GEOMETRY =====
T.g_angles={t:'Lines & Angles',cat:'geo',lesson:`
<p>A <b>line</b> goes on forever in both directions. A <b>line segment</b> has two endpoints. A <b>ray</b> has one endpoint and goes on forever the other way.</p>
<p><b>Parallel</b> lines never meet (like train tracks). <b>Perpendicular</b> lines meet at a right angle (like a plus sign). <b>Intersecting</b> lines cross at any angle.</p>
<p>An <b>angle</b> is formed where two rays meet at a <b>vertex</b>. It is measured in <b>degrees</b>. Think of a clock: a full turn is 360°, a half turn is 180°, and the hands at 3:00 make 90°.</p>
${table(['Angle','Measure','Looks like'],[['Acute','less than 90°','a narrow V'],['Right','exactly 90°','a square corner'],['Obtuse','between 90° and 180°','a wide opening'],['Straight','exactly 180°','a straight line']])}
<p><b>Complementary</b> angles add to 90°. <b>Supplementary</b> angles add to 180°. The three angles of any <b>triangle</b> add to 180°.</p>
${ex('Two angles of a triangle are 65° and 40°. What is the third?','180 − 65 − 40 = <b>75°</b>.')}
${tip('Every clockwise hour on a clock is 30°. At 2:00 the hands make 60° (acute). At 4:00, 120° (obtuse). At 6:00, 180° (straight).')}`,
gen(){const t=R(1,5);
 if(t===1){const deg=pick([25,40,55,70,90,90,110,125,145,160,180]);const cls=deg<90?'Acute':deg===90?'Right':deg<180?'Obtuse':'Straight';
  return mc(`What kind of angle is shown? It measures ${deg}°.${svgAngle(deg)}`,cls,['Acute','Right','Obtuse','Straight'].filter(x=>x!==cls),`${deg}° is ${cls==='Acute'?'less than 90°, so it is acute':cls==='Right'?'exactly 90°, a right angle':cls==='Obtuse'?'between 90° and 180°, so it is obtuse':'exactly 180°, a straight angle'}.`)}
 if(t===2){const a=R(25,80),b=R(25,80);if(a+b>=170)return this.gen();const c=180-a-b;
  return mc(`Two angles of a triangle measure ${a}° and ${b}°. What is the measure of the third angle?`,c+'°',[(a+b)+'°',(360-a-b)+'°',(90-Math.min(a,b))+'°',(c+10)+'°'],`The angles of a triangle add to 180°. 180 − ${a} − ${b} = ${c}°.`)}
 if(t===3){const comp=pick([true,false]);const tot=comp?90:180;const a=R(15,tot-15);
  if(a===tot-a)return this.gen();
  return mc(`Two angles are <b>${comp?'complementary':'supplementary'}</b>. One measures ${a}°. What is the other?`,(tot-a)+'°',[(comp?180-a:360-a)+'°',(tot+a)+'°',a+'°',(tot-a+10)+'°',(tot-a-10)+'°'],`${comp?'Complementary':'Supplementary'} angles add to ${tot}°. ${tot} − ${a} = ${tot-a}°.`)}
 if(t===4){const forms=[
  {q:'Which pair of lines will <b>never</b> meet, no matter how far they extend?',a:'Parallel lines',w:['Perpendicular lines','Intersecting lines','A ray and a line segment'],e:'Parallel lines stay the same distance apart forever and never cross.'},
  {q:'Two lines cross and form four right angles. What are these lines called?',a:'Perpendicular',w:['Parallel','Curved','Skew'],e:'Perpendicular lines meet at 90° angles.'},
  {q:'Which figure has exactly <b>one</b> endpoint and extends forever in one direction?',a:'A ray',w:['A line','A line segment','An angle'],e:'A ray starts at one endpoint and goes on forever, like a beam of light.'},
  {q:'Which figure has <b>two</b> endpoints?',a:'A line segment',w:['A line','A ray','A plane'],e:'A line segment is the part of a line between two endpoints.'},
  {q:'How many degrees are in a full turn (a complete circle)?',a:'360°',w:['180°','90°','100°'],e:'A full rotation is 360°. Half a turn is 180° and a quarter turn is 90°.'}];const f=pick(forms);return mc(f.q,f.a,f.w,f.e)}
 const h=pick([1,2,3,4,5,6]);const deg=h*30;const cls=deg<90?'acute':deg===90?'right':deg<180?'obtuse':'straight';
 return mc(`At ${h}:00, what angle do the hands of a clock make?`,`${deg}°, ${cls}`,[`${deg+30}°, ${deg+30<90?'acute':deg+30===90?'right':deg+30<180?'obtuse':'straight'}`,`${deg-30 || 15}°, acute`,`${h*15}°, acute`,`${deg}°, ${cls==='acute'?'obtuse':'acute'}`],`Each hour on the clock is 360 ÷ 12 = 30°. ${h} × 30 = ${deg}°, which is ${cls}.`)}};

T.g_shapes={t:'Triangles, Quadrilaterals & Polygons',cat:'geo',lesson:`
<p>A <b>polygon</b> is a closed shape made of straight sides. Name by sides: triangle (3), quadrilateral (4), pentagon (5), hexagon (6), heptagon (7), octagon (8), decagon (10).</p>
<p><b>Triangles by sides</b>: equilateral (3 equal), isosceles (2 equal), scalene (none equal). <b>By angles</b>: right (one 90°), acute (all under 90°), obtuse (one over 90°).</p>
<p><b>Quadrilateral family</b> (every shape below has 4 sides and angles that add to 360°):</p>
${table(['Shape','Properties'],[['Parallelogram','2 pairs of parallel sides; opposite sides equal'],['Rectangle','parallelogram with 4 right angles'],['Rhombus','parallelogram with 4 equal sides'],['Square','4 equal sides AND 4 right angles (a rectangle and a rhombus)'],['Trapezoid','exactly 1 pair of parallel sides']])}
<p><b>All squares are rectangles</b>, but not all rectangles are squares. All rectangles are parallelograms.</p>
<p>A <b>line of symmetry</b> folds a shape onto itself exactly. A square has 4; a rectangle has 2; an equilateral triangle has 3; a circle has infinitely many.</p>
${tip('Circle facts: the radius goes from center to edge; the diameter goes all the way across through the center and is twice the radius.')}`,
gen(){const t=R(1,5);
 if(t===1){const names={3:'triangle',4:'quadrilateral',5:'pentagon',6:'hexagon',8:'octagon',10:'decagon'};const n=pick([3,4,5,6,8,10]);const rev=pick([true,false]);
  if(rev)return mc(`How many sides does a <b>${names[n]}</b> have?`,n,Object.keys(names).map(Number).filter(x=>x!==n),`A ${names[n]} has ${n} sides.`);
  return mc(`What is the name of a polygon with <b>${n}</b> sides?`,names[n],Object.values(names).filter(x=>x!==names[n]),`A polygon with ${n} sides is a ${names[n]}.`)}
 if(t===2){const forms=[
  {q:'A triangle has sides of 5 cm, 5 cm, and 8 cm. What kind of triangle is it?',a:'Isosceles',w:['Equilateral','Scalene','Right'],e:'Exactly two sides are equal, so it is isosceles.'},
  {q:'A triangle has angles of 90°, 45°, and 45°. What kind of triangle is it?',a:'Right isosceles',w:['Equilateral','Obtuse','Scalene'],e:'It has a right angle (90°) and two equal angles, so it is a right isosceles triangle.'},
  {q:'A triangle has three equal sides. What must be true about its angles?',a:'They are all 60°',w:['One is 90°','One is greater than 90°','They are all different'],e:'An equilateral triangle has three equal angles: 180 ÷ 3 = 60° each.'},
  {q:'A triangle has one angle of 120°. What kind of triangle is it?',a:'Obtuse',w:['Acute','Right','Equilateral'],e:'Any triangle with an angle greater than 90° is obtuse.'},
  {q:'A triangle has sides of 4 in, 6 in, and 7 in. What kind of triangle is it?',a:'Scalene',w:['Isosceles','Equilateral','Right'],e:'No sides are equal, so it is scalene.'}];const f=pick(forms);return mc(f.q,f.a,f.w,f.e)}
 if(t===3){const forms=[
  {q:'Which quadrilateral has 4 equal sides but does NOT have to have right angles?',a:'Rhombus',w:['Rectangle','Square','Trapezoid'],e:'A rhombus has four equal sides. If it also has right angles, it is a square.'},
  {q:'Which quadrilateral has exactly one pair of parallel sides?',a:'Trapezoid',w:['Parallelogram','Rectangle','Rhombus'],e:'A trapezoid has exactly one pair of parallel sides. Parallelograms have two pairs.'},
  {q:'Which statement is <b>always</b> true?',a:'All squares are rectangles.',w:['All rectangles are squares.','All quadrilaterals are parallelograms.','All parallelograms are rhombuses.'],e:'A square has four right angles, so it fits the definition of a rectangle. The reverse is not true: a 3-by-5 rectangle is not a square.'},
  {q:'A parallelogram has four right angles. What is the most specific name for it?',a:'Rectangle',w:['Trapezoid','Rhombus','Pentagon'],e:'A parallelogram with four right angles is a rectangle (it is a square only if the sides are also all equal).'},
  {q:'What is the sum of the angles in any quadrilateral?',a:'360°',w:['180°','270°','90°'],e:'Any quadrilateral can be split into two triangles, each with 180°, for a total of 360°.'}];const f=pick(forms);return mc(f.q,f.a,f.w,f.e)}
 if(t===4){const shapes=[['a square',4],['a rectangle (not a square)',2],['an equilateral triangle',3],['an isosceles triangle (not equilateral)',1],['a regular hexagon',6],['a regular pentagon',5],['a scalene triangle',0]];const s=pick(shapes);
  return mc(`How many lines of symmetry does <b>${s[0]}</b> have?`,s[1],[0,1,2,3,4,5,6].filter(x=>x!==s[1]).sort(()=>Math.random()-0.5),`${s[0][0].toUpperCase()+s[0].slice(1)} has ${s[1]} line${s[1]===1?'':'s'} of symmetry.`)}
 const a=R(60,130),b=R(50,110),c=R(40,100);const d=360-a-b-c;if(d<20||d>170)return this.gen();
 return mc(`Three angles of a quadrilateral measure ${a}°, ${b}°, and ${c}°. What is the fourth angle?`,d+'°',[(180-Math.min(a,b,c))+'°',(a+b+c)+'°',(d+20)+'°',(d-10)+'°'],`The angles of a quadrilateral add to 360°. 360 − ${a} − ${b} − ${c} = ${d}°.`)}};

T.g_perim={t:'Perimeter & Area',cat:'geo',lesson:`
<p><b>Perimeter</b> is the distance around a shape: add up all the sides. It is measured in plain units (cm, ft).</p>
<p><b>Area</b> is the space inside: measured in <b>square</b> units (cm², ft²).</p>
${table(['Shape','Perimeter','Area'],[['Rectangle','2 × l + 2 × w','l × w'],['Square','4 × s','s × s'],['Triangle','add the 3 sides','½ × base × height'],['Parallelogram','add the 4 sides','base × height']])}
${svgRect(8,5,'8 cm','5 cm')}
<p>This rectangle: perimeter = 8 + 5 + 8 + 5 = <b>26 cm</b>; area = 8 × 5 = <b>40 cm²</b>.</p>
${ex('A square has a perimeter of 36 in. What is its area?','Each side is 36 ÷ 4 = 9 in. Area = 9 × 9 = <b>81 in²</b>.')}
${tip('When a shape is an L or a T, split it into rectangles, find each area, and add. For perimeter, walk around the outside and add every edge.')}`,
gen(){const t=R(1,6);const u=pick(['cm','in','ft','m']);
 if(t===1){const l=R(4,15),w=R(2,l-1);return mc(`What is the <b>perimeter</b> of the rectangle?${svgRect(l,w,l+' '+u,w+' '+u)}`,`${2*l+2*w} ${u}`,[`${l*w} ${u}`,`${l+w} ${u}`,`${2*l+w} ${u}`,`${l*w} ${u}²`],`Perimeter = 2 × ${l} + 2 × ${w} = ${2*l} + ${2*w} = ${2*l+2*w} ${u}.`)}
 if(t===2){const l=R(4,15),w=R(2,l-1);return mc(`What is the <b>area</b> of the rectangle?${svgRect(l,w,l+' '+u,w+' '+u)}`,`${l*w} ${u}²`,[`${2*l+2*w} ${u}²`,`${l+w} ${u}²`,`${l*w} ${u}`,`${l*w+l} ${u}²`],`Area = length × width = ${l} × ${w} = ${l*w} square ${u}. Area always uses square units.`)}
 if(t===3){const s=R(3,12);const per=pick([true,false]);
  if(per)return mc(`A square has a perimeter of ${4*s} ${u}. What is its <b>area</b>?`,`${s*s} ${u}²`,[`${4*s*4*s} ${u}²`,`${s*4} ${u}²`,`${s*s*2} ${u}²`,`${s} ${u}²`],`Each side is ${4*s} ÷ 4 = ${s} ${u}. Area = ${s} × ${s} = ${s*s} ${u}².`);
  return mc(`A square has an area of ${s*s} ${u}². What is its <b>perimeter</b>?`,`${4*s} ${u}`,[`${s*s*4} ${u}`,`${s} ${u}`,`${2*s} ${u}`,`${s*s} ${u}`],`Side × side = ${s*s}, so each side is ${s} ${u}. Perimeter = 4 × ${s} = ${4*s} ${u}.`)}
 if(t===4){const b=pick([4,6,8,10,12]),h=R(3,9);return mc(`What is the <b>area</b> of the triangle?${svgTri(b+' '+u,h+' '+u)}`,`${b*h/2} ${u}²`,[`${b*h} ${u}²`,`${b+h} ${u}²`,`${b*h/2+b} ${u}²`,`${2*(b+h)} ${u}²`],`Area of a triangle = ½ × base × height = ½ × ${b} × ${h} = ${b*h/2} ${u}².`)}
 if(t===5){const l=R(6,15),w=R(2,l-2);const per=2*l+2*w;return mc(`A rectangle has a perimeter of ${per} ${u} and a length of ${l} ${u}. What is its width?`,`${w} ${u}`,[`${per-l} ${u}`,`${per-2*l} ${u}`,`${Math.round(per/l*10)/10} ${u}`,`${w+1} ${u}`],`2 × ${l} = ${2*l}. ${per} − ${2*l} = ${2*w}, which is two widths. Width = ${2*w} ÷ 2 = ${w} ${u}.`)}
 const a=R(3,6),b=R(2,4),c=R(3,6),d=R(2,4);const area=a*b+c*d;const W=a+c;
 return mc(`An L-shaped garden is made of two rectangles: one is ${a} ${u} by ${b} ${u}, and the other is ${c} ${u} by ${d} ${u}. What is the total area?`,`${area} ${u}²`,[`${(a+c)*(b+d)} ${u}²`,`${a+b+c+d} ${u}²`,`${area+a} ${u}²`,`${a*b} ${u}²`],`Find each rectangle's area and add: ${a} × ${b} = ${a*b} and ${c} × ${d} = ${c*d}. Total: ${a*b} + ${c*d} = ${area} ${u}².`)}};

T.g_coord={t:'Coordinate Plane & Transformations',cat:'geo',lesson:`
<p>A point on the <b>coordinate plane</b> is named by an <b>ordered pair</b> (x, y). The first number tells you how far to go <b>right</b> (or left if negative) from the origin (0, 0). The second tells you how far <b>up</b> (or down).</p>
${svgGrid(3,2)}
<p>This point is at <b>(3, 2)</b>: over 3, up 2. Remember "x is a-cross, y is to the sky."</p>
<p>Points on the same horizontal line have the same y. The distance between (1, 4) and (6, 4) is 6 − 1 = <b>5</b> units.</p>
<p><b>Transformations</b>: a <b>translation</b> slides a shape (add to x for right, add to y for up). A <b>reflection</b> flips it over a line (a mirror image). A <b>rotation</b> turns it around a point.</p>
${ex('Move the point (2, 5) three units right and one unit down.','x: 2 + 3 = 5. y: 5 − 1 = 4. New point: <b>(5, 4)</b>.')}
${tip('Reflect over the x-axis: the y changes sign, (3, 2) → (3, −2). Reflect over the y-axis: the x changes sign, (3, 2) → (−3, 2).')}`,
gen(){const t=R(1,5);
 if(t===1){const x=R(1,5),y=R(1,5);
  if(x===y)return this.gen();
  return mc(`What are the coordinates of the point?${svgGrid(x,y)}`,`(${x}, ${y})`,[`(${y}, ${x})`,`(${x+1}, ${y})`,`(${x}, ${y+1})`,`(${x-1}, ${y+1})`],`Start at the origin. Move ${Math.abs(x)} ${x>0?'right':'left'} (x = ${x}) and ${Math.abs(y)} ${y>0?'up':'down'} (y = ${y}). The point is (${x}, ${y}).`)}
 if(t===2){const x=R(2,5),y=R(2,5);const dx=R(1,3)*pick([1,-1]),dy=R(1,3)*pick([1,-1]);if(x+dx<0||y+dy<0)return this.gen();
  return mc(`The point (${x}, ${y}) is moved ${Math.abs(dx)} unit${Math.abs(dx)>1?'s':''} ${dx>0?'right':'left'} and ${Math.abs(dy)} unit${Math.abs(dy)>1?'s':''} ${dy>0?'up':'down'}. Where is it now?`,`(${x+dx}, ${y+dy})`,[`(${x-dx}, ${y-dy})`,`(${x+dy}, ${y+dx})`,`(${x+dx}, ${y-dy})`,`(${x-dx}, ${y+dy})`],`${dx>0?'Right':'Left'} changes x: ${x} ${dx>0?'+':'−'} ${Math.abs(dx)} = ${x+dx}. ${dy>0?'Up':'Down'} changes y: ${y} ${dy>0?'+':'−'} ${Math.abs(dy)} = ${y+dy}. New point: (${x+dx}, ${y+dy}).`)}
 if(t===3){const y=R(1,5),x1=R(0,3),x2=x1+R(2,5);if(x2>8)return this.gen();const horiz=pick([true,false]);
  if(horiz)return mc(`What is the distance between the points (${x1}, ${y}) and (${x2}, ${y})?`,`${x2-x1} units`,[`${x2+x1} units`,`${x2-x1+1} units`,`${x2-x1+2} units`,`${x2} units`],`Both points have the same y, so they are on a horizontal line. Count along the x-axis: ${x2} − (${x1}) = ${x2-x1} units.`);
  return mc(`What is the distance between the points (${y}, ${x1}) and (${y}, ${x2})?`,`${x2-x1} units`,[`${x2+x1} units`,`${x2-x1+1} units`,`${x2-x1+2} units`,`${x2} units`],`Both points have the same x, so they are on a vertical line. Count along the y-axis: ${x2} − (${x1}) = ${x2-x1} units.`)}
 if(t===4){const x=R(1,5),y=R(1,5);if(x===y)return this.gen();const ask=pick(['x','y']);
  return mc(`A point is at (${x}, ${y}). What is its <b>${ask}-coordinate</b>?`,ask==='x'?x:y,[ask==='x'?y:x,x+y,Math.abs(x-y)||x+1,x+y+1],`In the ordered pair (${x}, ${y}), the first number is the x-coordinate and the second is the y-coordinate. The ${ask}-coordinate is <b>${ask==='x'?x:y}</b>.`)}
 const forms=[
  {q:'A shape slides 4 units to the right without turning or flipping. What is this transformation called?',a:'Translation',w:['Reflection','Rotation','Dilation'],e:'A slide is a translation. The shape keeps the same size and orientation.'},
  {q:'A shape is flipped over a line so that it becomes a mirror image. What is this called?',a:'Reflection',w:['Translation','Rotation','Enlargement'],e:'A flip that creates a mirror image is a reflection.'},
  {q:'A shape is turned 90° around a point. What is this transformation called?',a:'Rotation',w:['Reflection','Translation','Symmetry'],e:'A turn around a point is a rotation.'},
  {q:'In the ordered pair (7, 2), what does the 7 tell you?',a:'Move 7 units right from the origin',w:['Move 7 units up from the origin','The point is in the 7th quadrant','Move 7 units left from the origin'],e:'The first number is the x-coordinate: how far to move horizontally (right if positive).'},
  {q:'Which point lies on the y-axis?',a:'(0, 5)',w:['(5, 0)','(5, 5)','(1, 5)'],e:'Points on the y-axis have an x-coordinate of 0.'},
  {q:'Starting at the origin, you move 3 units right and 4 units up. Where are you?',a:'(3, 4)',w:['(4, 3)','(3, 3)','(7, 7)'],e:'Right is the x-direction and up is the y-direction, so the point is (3, 4).'}];const f=pick(forms);return mc(f.q,f.a,f.w,f.e)}};

// ===== MEASUREMENT =====
T.m_units={t:'Units & Conversions',cat:'meas',lesson:`
<p><b>US customary</b> units:</p>
${table(['Length','Weight','Liquid volume'],[['12 in = 1 ft','16 oz = 1 lb','8 fl oz = 1 cup'],['3 ft = 1 yd','2,000 lb = 1 ton','2 cups = 1 pint'],['5,280 ft = 1 mile','','2 pints = 1 quart'],['1,760 yd = 1 mile','','4 quarts = 1 gallon']])}
<p><b>Metric</b> units go by tens: 10 mm = 1 cm, 100 cm = 1 m, 1,000 m = 1 km; 1,000 g = 1 kg; 1,000 mL = 1 L.</p>
<p><b>Big → small: multiply.</b> 3 ft to inches: 3 × 12 = 36 in. <b>Small → big: divide.</b> 48 oz to pounds: 48 ÷ 16 = 3 lb.</p>
${ex('Convert 3.25 yards to inches.','3.25 yd × 3 = 9.75 ft. 9.75 ft × 12 = <b>117 in</b>.')}
<p><b>Choosing units</b>: a paper clip is about 3 cm; a door is about 2 m; a paperclip weighs about 1 g; a textbook about 1 kg; a bathtub holds about 300 L.</p>
${tip('Remember "Gallon Man": 1 gallon = 4 quarts = 8 pints = 16 cups. Going down the chain, multiply; going up, divide.')}`,
gen(){const t=R(1,4);const conv=[['feet','inches',12],['yards','feet',3],['pounds','ounces',16],['gallons','quarts',4],['quarts','pints',2],['pints','cups',2],['cups','fluid ounces',8],['meters','centimeters',100],['kilometers','meters',1000],['kilograms','grams',1000],['liters','milliliters',1000],['centimeters','millimeters',10],['hours','minutes',60],['minutes','seconds',60],['days','hours',24],['weeks','days',7],['years','months',12]];
 if(t===1){const c=pick(conv);const k=R(2,12);return mc(`How many ${c[1]} are in ${k} ${c[0]}?`,fmt(k*c[2]),[fmt(k*c[2]*10),fmt(k+c[2]),fmt(k*c[2]/2),fmt(k*(c[2]+1))],`1 ${c[0].replace(/s$/,'')} = ${fmt(c[2])} ${c[1]}. Big unit → small unit, so multiply: ${k} × ${fmt(c[2])} = ${fmt(k*c[2])} ${c[1]}.`)}
 if(t===2){const c=pick(conv);const k=R(2,9);return mc(`Convert ${fmt(k*c[2])} ${c[1]} to ${c[0]}.`,fmt(k),[fmt(k*c[2]*c[2]),fmt(k*2),fmt(k+1),fmt(k*c[2]-c[2])],`${fmt(c[2])} ${c[1]} = 1 ${c[0].replace(/s$/,'')}. Small unit → big unit, so divide: ${fmt(k*c[2])} ÷ ${fmt(c[2])} = ${k} ${c[0]}.`)}
 if(t===3){const c=pick(conv.slice(0,7));const k=R(2,6),extra=R(2,c[2]-1);return mc(`${k} ${c[0]} and ${extra} ${c[1]} is the same as how many ${c[1]}?`,k*c[2]+extra,[k*c[2],k+extra,(k+extra)*c[2],k*c[2]+extra+c[2]],`${k} ${c[0]} = ${k} × ${c[2]} = ${k*c[2]} ${c[1]}. Add the extra ${extra}: ${k*c[2]+extra} ${c[1]}.`)}
 const forms=[
  {q:'Which unit is best for measuring the length of a school bus?',a:'meters',w:['millimeters','kilometers','liters'],e:'A bus is about 12 meters long. Millimeters would give a huge number; kilometers a tiny one.'},
  {q:'Which unit is best for measuring the weight of an apple?',a:'ounces',w:['tons','pounds','miles'],e:'An apple weighs about 5 or 6 ounces.'},
  {q:'Which unit is best for measuring the amount of water in a swimming pool?',a:'gallons',w:['cups','fluid ounces','inches'],e:'A pool holds thousands of gallons. Cups would give an enormous number.'},
  {q:'Which unit is best for measuring the distance between two cities?',a:'miles',w:['inches','feet','yards'],e:'Distances between cities are measured in miles (or kilometers).'},
  {q:'About how long is a new pencil?',a:'18 centimeters',w:['18 millimeters','18 meters','18 kilometers'],e:'A pencil is about 18 cm, a bit longer than your hand.'},
  {q:'Which measurement is the greatest?',a:'2 yards',w:['5 feet','30 inches','1 meter'],e:'2 yards = 6 feet = 72 inches. That beats 5 feet (60 inches), 30 inches, and 1 meter (about 39 inches).'},
  {q:'Which holds the most?',a:'1 gallon',w:['3 quarts','7 pints','12 cups'],e:'1 gallon = 4 quarts = 8 pints = 16 cups, more than any of the other choices.'}];const f=pick(forms);return mc(f.q,f.a,f.w,f.e)}};

T.m_time={t:'Time, Money & Temperature',cat:'meas',lesson:`
<p><b>Time</b>: 60 sec = 1 min, 60 min = 1 hr, 24 hr = 1 day, 7 days = 1 week, 12 months = 52 weeks = 1 year.</p>
<p><b>Elapsed time</b>: count up in friendly chunks. From 9:45 to 11:20: 9:45 → 10:00 is 15 min, 10:00 → 11:00 is 1 hr, 11:00 → 11:20 is 20 min. Total: <b>1 hr 35 min</b>.</p>
${ex('Practice starts at 3:40 and lasts 1 hour 35 minutes. When does it end?','3:40 + 1 hr = 4:40. 4:40 + 20 min = 5:00. 5:00 + 15 min = <b>5:15</b>.')}
<p><b>Money</b>: line up the decimal points. To make change, subtract the cost from the amount paid, or count up from the cost.</p>
${ex('Three notebooks at $2.35 each; you pay with a $10 bill. Change?','3 × $2.35 = $7.05. $10.00 − $7.05 = <b>$2.95</b>.')}
<p><b>Temperature</b>: water freezes at 32°F (0°C) and boils at 212°F (100°C). To find a change, subtract. From −4°F to 15°F is a rise of 15 − (−4) = <b>19°</b>.</p>
${tip('Remember that clocks work in 60s, not 100s. 2:50 + 20 minutes is 3:10, not 2:70.')}`,
gen(){const t=R(1,5);const n=nm();const dur=m=>m<60?`${m} min`:`${Math.floor(m/60)} hr ${m%60} min`;const fmtT=m=>{m=((m%720)+720)%720;let h=Math.floor(m/60);const mm=m%60;h=h===0?12:h;return `${h}:${String(mm).padStart(2,'0')}`};
 if(t===1){const s=R(7*60,11*60)+pick([0,5,10,15,20,25,30,35,40,45,50,55]);const d=R(1,3)*60+pick([5,10,15,20,25,30,35,40,45,50]);const e=s+d;const ap=e>=12*60?'p.m.':'a.m.';
  return mc(`${n}'s soccer game starts at ${fmtT(s)} a.m. and lasts ${Math.floor(d/60)} hour${d>=120?'s':''} ${d%60} minutes. What time does it end?`,`${fmtT(e)} ${ap}`,[`${fmtT(e+10)} ${ap}`,`${fmtT(e-15)} ${ap}`,`${fmtT(e+60)} ${e+60>=720?'p.m.':'a.m.'}`,`${fmtT(s+Math.floor(d/60)*100+d%60)} ${ap}`],`Add the hours first: ${fmtT(s)} + ${Math.floor(d/60)} hr = ${fmtT(s+Math.floor(d/60)*60)}. Then add ${d%60} minutes: ${fmtT(e)} ${ap}.`)}
 if(t===2){const s=R(1*60,5*60)+pick([0,15,30,45,10,20,40,50]);const d=R(0,3)*60+pick([15,20,25,30,35,40,45,50,55]);const e=s+d;
  return mc(`A movie starts at ${fmtT(s)} p.m. and ends at ${fmtT(e)} p.m. How long is the movie?`,dur(d),[dur(d+60),dur(d+10),dur(d+30),dur(Math.max(5,d-15)),dur(d+5)],`Count up from ${fmtT(s)}: to ${fmtT(e)} is ${dur(d)}.`)}
 if(t===3){const price=R(125,899)/100;const q=R(2,4);const tot=Math.round(price*q*100)/100;const paid=Math.ceil(tot/5)*5;const ch=Math.round((paid-tot)*100)/100;if(ch<0.25)return this.gen();
  return mc(`${n} buys ${q} ${pick(['juice boxes','markers','erasers','snacks'])} at ${money(price)} each and pays with a $${paid} bill. How much change should ${n} get?`,money(ch),[money(paid-price),money(tot),money(ch+1),money(Math.abs(paid-tot-0.5))],`Total cost: ${q} × ${money(price)} = ${money(tot)}. Change: $${paid}.00 − ${money(tot)} = ${money(ch)}.`)}
 if(t===4){const q=R(3,9),d=R(0,4),nk=R(0,5),p=R(0,9);const tot=q*25+d*10+nk*5+p;
  if(d<2||nk<2||p<2)return this.gen();
  return mc(`${n} has ${q} quarters, ${d} dimes, ${nk} nickels, and ${p} pennies. How much money is that?`,money(tot/100),[money((tot+25)/100),money((tot-10)/100),money((q*25+d*10+nk*5)/100+p),money((q+d+nk+p)/100)],`${q} × 25¢ = ${q*25}¢, ${d} × 10¢ = ${d*10}¢, ${nk} × 5¢ = ${nk*5}¢, ${p} × 1¢ = ${p}¢. Total ${tot}¢ = ${money(tot/100)}.`)}
 let lo=R(-15,10);if(lo===0)lo=-3;const hi=lo+R(8,35);
 return mc(`The temperature at 6 a.m. was ${lo}°F. By 2 p.m. it was ${hi}°F. By how many degrees did the temperature rise?`,`${hi-lo}°`,[`${hi+lo}°`,`${hi-lo+2}°`,`${hi-lo-2}°`,`${hi}°`],`Subtract: ${hi} − (${lo}) = ${hi-lo}°. ${lo<0?'Going from '+lo+' up to 0 is '+Math.abs(lo)+' degrees, then 0 up to '+hi+' is '+hi+' more.':''}`)}};

T.m_volume={t:'Volume & Surface Area',cat:'meas',lesson:`
<p><b>Volume</b> is the space inside a 3-D shape, measured in <b>cubic</b> units (cm³, in³, ft³). Think of filling a box with unit cubes.</p>
<p><b>Rectangular prism</b> (a box): V = length × width × height. <b>Cube</b>: V = s × s × s.</p>
${ex('A box is 10 cm long, 8 cm wide, and 3 cm tall.','One layer has 10 × 8 = 80 cubes. Three layers: 80 × 3 = <b>240 cm³</b>.')}
${ex('A cube has edges of ½ inch. Volume?','½ × ½ × ½ = <b>⅛ in³</b>. Volume is always in cubic units.')}
<p><b>Surface area</b> is the total area of all the faces (the wrapping paper). A box has 6 faces in 3 matching pairs: SA = 2(lw) + 2(lh) + 2(wh). A cube: 6 × s².</p>
<p><b>Missing dimension</b>: if V = 60 cm³, l = 5, w = 4, then h = 60 ÷ (5 × 4) = 3 cm.</p>
${tip('Which unit? Perimeter: units (cm). Area: square units (cm²). Volume: cubic units (cm³). The little number matches the number of dimensions.')}`,
gen(){const t=R(1,5);const u=pick(['cm','in','ft']);
 if(t===1){const l=R(2,10),w=R(2,8),h=R(2,6);return mc(`A box is ${l} ${u} long, ${w} ${u} wide, and ${h} ${u} tall. What is its <b>volume</b>?`,`${l*w*h} ${u}³`,[`${l+w+h} ${u}³`,`${l*w+h} ${u}³`,`${2*(l*w+l*h+w*h)} ${u}³`,`${l*w*h} ${u}²`],`Volume = l × w × h = ${l} × ${w} × ${h} = ${l*w*h} cubic ${u}.`)}
 if(t===2){const s=R(2,7);return mc(`A cube has edges of ${s} ${u}. What is its volume?`,`${s*s*s} ${u}³`,[`${s*s} ${u}³`,`${6*s*s} ${u}³`,`${3*s} ${u}³`,`${s*s*s} ${u}²`],`Volume of a cube = s × s × s = ${s} × ${s} × ${s} = ${s*s*s} ${u}³.`)}
 if(t===3){const l=R(2,8),w=R(2,6),h=R(2,6);const v=l*w*h;return mc(`A rectangular box has a volume of ${v} ${u}³. Its length is ${l} ${u} and its width is ${w} ${u}. What is its height?`,`${h} ${u}`,[`${v-l-w} ${u}`,`${l*w} ${u}`,`${Math.round(v/l*10)/10} ${u}`,`${h+1} ${u}`],`The base area is ${l} × ${w} = ${l*w}. Height = ${v} ÷ ${l*w} = ${h} ${u}.`)}
 if(t===4){const s=R(2,6);const sa=6*s*s;return mc(`What is the <b>surface area</b> of a cube with edges of ${s} ${u}?`,`${sa} ${u}²`,[`${s*s*s} ${u}²`,`${s*s} ${u}²`,`${4*s*s} ${u}²`,`${12*s} ${u}²`],`A cube has 6 square faces. Each face is ${s} × ${s} = ${s*s}. 6 × ${s*s} = ${sa} ${u}².`)}
 const forms=[
  {q:'Which unit is used to describe the volume of a shoebox?',a:'Cubic inches',w:['Square inches','Inches','Pounds'],e:'Volume fills three dimensions (length × width × height), so it uses cubic units.'},
  {q:'A box holds exactly 24 unit cubes in one layer, and it is 3 layers tall. What is its volume?',a:'72 cubic units',w:['27 cubic units','24 cubic units','8 cubic units'],e:'24 cubes per layer × 3 layers = 72 cubic units.'},
  {q:'Which measurement describes how much wrapping paper covers a gift box?',a:'Surface area',w:['Volume','Perimeter','Height'],e:'Surface area is the total area of all the outside faces.'},
  {q:'A cube has edges of ½ inch. What is its volume?',a:fr(1,8)+' in³',w:[fr(1,2)+' in³',fr(1,4)+' in³',fr(3,2)+' in³'],e:'½ × ½ × ½ = ⅛ cubic inch.'}];const f=pick(forms);return mc(f.q,f.a,f.w,f.e)}};

T.m_est={t:'Measurement Word Problems',cat:'meas',lesson:`
<p>Measurement problems on the test mix units, shapes, and real situations. A good plan:</p>
<ol><li><b>Same units first.</b> Garden A is 4 ft; garden B is 2 yd. Convert: 2 yd = 6 ft. Difference: 6 − 4 = 2 ft.</li><li><b>Draw it.</b> A quick sketch of the fence, room, or box shows which formula to use.</li><li><b>Check the question.</b> Fencing around a yard → perimeter. Carpet for a floor → area. Water in a tank → volume.</li></ol>
${ex('A map scale says 1 inch = 25 miles. Two towns are 3½ inches apart on the map. Real distance?','3.5 × 25 = <b>87.5 miles</b>.')}
${ex('A rectangular room is 12 ft by 10 ft. Tiles are 1 ft². How many tiles?','Area = 12 × 10 = <b>120 tiles</b>.')}
<p><b>Reading a ruler</b>: each small mark between centimeters is 1 millimeter (0.1 cm). A paper clip ending 2 marks past 3 cm is 3.2 cm long.</p>
${tip('Speed problems: distance = rate × time. 40 miles per hour for 3 hours = 120 miles. Time = distance ÷ rate.')}`,
gen(){const t=R(1,5);const n=nm();
 if(t===1){const sc=pick([5,10,20,25,50]);const inch=pick([2,3,4,2.5,3.5,4.5]);return mc(`On a map, 1 inch represents ${sc} miles. Two cities are ${inch} inches apart on the map. How far apart are they really?`,`${inch*sc} miles`,[`${inch+sc} miles`,`${inch*sc*2} miles`,`${inch*sc/2} miles`,`${sc} miles`],`Multiply: ${inch} × ${sc} = ${inch*sc} miles.`)}
 if(t===2){const l=R(8,20),w=R(6,l-1);const fence=pick([true,false]);const cost=pick([2,3,4,5]);
  if(fence)return mc(`${n} wants to put a fence around a rectangular yard that is ${l} ft by ${w} ft. Fencing costs $${cost} per foot. What is the total cost?`,money(cost*(2*l+2*w)),[money(cost*l*w),money(2*l+2*w),money(cost*(l+w)),money(cost*(2*l+2*w)+cost)],`Fence goes around the outside, so use perimeter: 2 × ${l} + 2 × ${w} = ${2*l+2*w} ft. Cost: ${2*l+2*w} × $${cost} = ${money(cost*(2*l+2*w))}.`);
  return mc(`A rectangular floor is ${l} ft by ${w} ft. Each tile covers 1 square foot. How many tiles are needed?`,l*w,[2*l+2*w,l+w,l*w/2,l*w+l],`Tiles cover the inside, so use area: ${l} × ${w} = ${l*w} square feet = ${l*w} tiles.`)}
 if(t===3){const r=pick([30,40,50,60,45,55]);const h=R(2,5);const which=pick(['d','t']);
  if(which==='d')return mc(`A train travels at ${r} miles per hour for ${h} hours. How far does it go?`,`${r*h} miles`,[`${r+h} miles`,`${r*h+r} miles`,`${r} miles`,`${Math.round(r/h)} miles`],`Distance = rate × time = ${r} × ${h} = ${r*h} miles.`);
  return mc(`A car travels ${r*h} miles at ${r} miles per hour. How long does the trip take?`,`${h} hours`,[`${h+1} hours`,`${r*h-r} hours`,`${h*2} hours`,`${Math.round(r*h/10)} hours`],`Time = distance ÷ rate = ${r*h} ÷ ${r} = ${h} hours.`)}
 if(t===4){const yd=R(1,4),ft=R(1,11);const ftA=yd*3+ft;const other=ftA+pick([-2,-1,1,2,3]);
  return mc(`Rope A is ${yd} yard${yd>1?'s':''} ${ft} ft long. Rope B is ${other} ft long. Which rope is longer, and by how much?`,other>ftA?`Rope B, by ${other-ftA} ft`:`Rope A, by ${ftA-other} ft`,[other>ftA?`Rope A, by ${other-ftA} ft`:`Rope B, by ${ftA-other} ft`,`Rope A, by ${Math.abs(yd+ft-other)} ft`,`They are the same length`,`Rope B, by ${Math.abs(other-ftA)+3} ft`],`Convert to the same unit: Rope A = ${yd} × 3 + ${ft} = ${ftA} ft. Compare with ${other} ft: ${other>ftA?'Rope B is longer by '+(other-ftA):'Rope A is longer by '+(ftA-other)} ft.`)}
 const cm=R(2,9),mm=R(1,9);return mc(`A paper clip's end lines up ${mm} small mark${mm>1?'s':''} past the ${cm} cm line on a centimeter ruler. How long is the paper clip?`,`${cm}.${mm} cm`,[`${cm}${mm} cm`,`${cm}.${mm} mm`,`${cm+mm} cm`,`${cm}.${mm+1 > 9 ? 1 : mm+1} cm`],`Each small mark is 1 millimeter, or 0.1 cm. ${cm} cm + ${mm} mm = ${cm}.${mm} cm.`)}};

// ===== DATA ANALYSIS =====
// Each category set carries its own title, so a chart never contradicts itself.
const DATASETS=()=>pick([
  {t:'Favorite lunch',c:['Pizza','Tacos','Pasta','Salad','Soup'],u:'students'},
  {t:'Books read this week',c:['Mon','Tue','Wed','Thu','Fri'],u:'books'},
  {t:'Pets in Room 12',c:['Dogs','Cats','Fish','Birds','Hamsters'],u:'pets'},
  {t:'Favorite sport',c:['Soccer','Tennis','Swim','Track','Golf'],u:'students'},
  {t:'Favorite color',c:['Red','Blue','Green','Yellow','Purple'],u:'students'}]);
T.s_center={t:'Mean, Median, Mode & Range',cat:'data',lesson:`
<p>These numbers describe a set of data.</p>
${table(['Measure','How to find it','For 7, 9, 10, 13, 14, 14'],[['Mean (average)','add all values, divide by how many','67 ÷ 6 ≈ 11.2'],['Median (middle)','order the values, take the middle one (or average the two middles)','(10 + 13) ÷ 2 = 11.5'],['Mode (most)','the value that appears most often','14'],['Range (spread)','greatest − least','14 − 7 = 7']])}
<p>A set can have <b>no mode</b> (nothing repeats) or <b>more than one mode</b>.</p>
${ex('Kate averaged 12 points per game and scored 156 points in the season. How many games?','total ÷ mean = 156 ÷ 12 = <b>13 games</b>. And total = mean × count: 5.5 hours a day × 6 days = 33 hours.')}
${ex('Test scores: 80, 90, 70, 100. What score on a 5th test gives a mean of 86?','5 tests × 86 = 430 total needed. 80 + 90 + 70 + 100 = 340. 430 − 340 = <b>90</b>.')}
${tip('Always ORDER the numbers before finding the median. Half the errors on median questions come from skipping this step.')}`,
gen(){const t=R(1,6);const n=nm();const mkset=(k,lo,hi)=>Array.from({length:k},()=>R(lo,hi));
 if(t===1){let s;do{s=mkset(pick([4,5,6]),2,20)}while(s.reduce((a,b)=>a+b,0)%s.length);const sum=s.reduce((a,b)=>a+b,0),m=sum/s.length;
  return mc(`What is the <b>mean</b> of these numbers? <b>${s.join(', ')}</b>`,m,[sum,Math.max(...s)-Math.min(...s),s.slice().sort((a,b)=>a-b)[Math.floor(s.length/2)],m+1],`Add: ${s.join(' + ')} = ${sum}. Divide by ${s.length}: ${sum} ÷ ${s.length} = ${m}.`)}
 if(t===2){const k=pick([5,7,6]);const s=mkset(k,1,30);const sorted=s.slice().sort((a,b)=>a-b);const med=k%2?sorted[(k-1)/2]:(sorted[k/2-1]+sorted[k/2])/2;
  return mc(`What is the <b>median</b> of these numbers? <b>${s.join(', ')}</b>`,med,[s[Math.floor(k/2)],Math.round(s.reduce((a,b)=>a+b,0)/k*10)/10,sorted[k-1]-sorted[0],med+1],`Order the numbers first: ${sorted.join(', ')}. The middle ${k%2?'value is':'two values are '+sorted[k/2-1]+' and '+sorted[k/2]+', and their average is'} ${med}.`)}
 if(t===3){const base=mkset(5,1,12);const mode=pick(base);const s=shuf([...base,mode,mode]);const counts={};s.forEach(x=>counts[x]=(counts[x]||0)+1);const modes=Object.keys(counts).filter(x=>counts[x]===Math.max(...Object.values(counts)));if(modes.length>1)return this.gen();
  return mc(`What is the <b>mode</b> of these numbers? <b>${s.join(', ')}</b>`,mode,[Math.max(...s),Math.min(...s),Math.max(...s)-Math.min(...s),s.slice().sort((a,b)=>a-b)[3]],`The mode is the value that appears most often. ${mode} appears ${counts[mode]} times, more than any other number.`)}
 if(t===4){const s=mkset(pick([5,6]),5,60);const rg=Math.max(...s)-Math.min(...s);
  return mc(`What is the <b>range</b> of these numbers? <b>${s.join(', ')}</b>`,rg,[Math.max(...s),Math.max(...s)+Math.min(...s),Math.round(s.reduce((a,b)=>a+b,0)/s.length),rg+5],`Range = greatest − least = ${Math.max(...s)} − ${Math.min(...s)} = ${rg}.`)}
 if(t===5){const k=R(3,5);const target=R(70,95);const s=mkset(k-1,60,100);const sum=s.reduce((a,b)=>a+b,0);const need=target*k-sum;if(need<0||need>100)return this.gen();
  return mc(`${n}'s test scores are ${s.join(', ')}. What score does ${n} need on the next test to have a <b>mean</b> of exactly ${target}?`,need,[target,target*k,Math.round(sum/(k-1)),need+5],`A mean of ${target} on ${k} tests means a total of ${target} × ${k} = ${target*k}. So far: ${sum}. Needed: ${target*k} − ${sum} = ${need}.`)}
 const mean=R(6,15),cnt=R(4,12);return mc(`${n} averaged ${mean} points per game and scored ${mean*cnt} points in all. How many games did ${n} play?`,cnt,[mean*cnt-mean,mean+cnt,cnt+1,mean],`Number of games = total ÷ mean = ${mean*cnt} ÷ ${mean} = ${cnt}.`)}};

T.s_graphs={t:'Reading Bar & Line Graphs',cat:'data',lesson:`
<p>A <b>bar graph</b> compares categories (things with names). The height of each bar shows the count. A <b>double bar graph</b> shows two groups side by side, with a key.</p>
${svgBar(['Pad Thai','Pizza','Chocolate','Pancakes'],[4,2,3,6],'Favorite foods',[2,5,7,3],['Boys','Girls'])}
<p>Read it: 2 girls and 4 boys like Pad Thai most. Girls who like chocolate: 7. Total who like pizza: 2 + 5 = 7.</p>
<p>A <b>line graph</b> shows how something changes <em>over time</em>. Read the point above each label; a steep line means a fast change.</p>
<p><b>Steps for any graph question</b>: 1) Read the title and axis labels. 2) Find the scale (what each line is worth). 3) Find the exact value(s) asked for. 4) Do the math (add, subtract, compare).</p>
${tip('Watch the scale! If grid lines go by 5, a bar between 10 and 15 is about 12 or 13, not 11.')}`,
gen(){const t=R(1,5);const cats=DATASETS();
 if(t<=2){const k=4;const labs=cats.c.slice(0,k);const vals=labs.map(()=>R(2,18));if(new Set(vals).size<k)return this.gen();const fig=svgBar(labs,vals,cats.t);
  if(t===1){const i=R(0,k-1),j=(i+R(1,k-1))%k;const d=Math.abs(vals[i]-vals[j]);if(!d)return this.gen();return mc(`How many more ${vals[i]>vals[j]?labs[i]:labs[j]} than ${vals[i]>vals[j]?labs[j]:labs[i]} are there?${fig}`,d,[vals[i]+vals[j],d+1,d-1,Math.max(vals[i],vals[j])],`Read the bars: ${labs[i]} = ${vals[i]}, ${labs[j]} = ${vals[j]}. Difference: ${Math.max(vals[i],vals[j])} − ${Math.min(vals[i],vals[j])} = ${d}.`)}
  const tot=vals.reduce((a,b)=>a+b,0);return mc(`How many responses were recorded in all?${fig}`,tot,[tot-vals[0],tot+2,Math.max(...vals),tot-1],`Add all the bars: ${vals.join(' + ')} = ${tot}.`)}
 if(t===3){const labs=cats.c.slice(0,4);const b=labs.map(()=>R(1,9)),g=labs.map(()=>R(1,9));const i=R(0,3);const fig=svgBar(labs,b,cats.t,g,['Boys','Girls']);const kind=pick(['g','tot','more']);
  if(kind==='g')return mc(`How many girls chose ${labs[i]}?${fig}`,g[i],[b[i],g[i]+b[i],g[i]+1,g[i]-1],`Use the key: the lighter bar is girls. For ${labs[i]}, the girls' bar reaches ${g[i]}.`);
  if(kind==='tot')return mc(`How many students in total chose ${labs[i]}?${fig}`,g[i]+b[i],[g[i],b[i],Math.abs(g[i]-b[i]),g[i]+b[i]+1],`Add the boys' and girls' bars for ${labs[i]}: ${b[i]} + ${g[i]} = ${g[i]+b[i]}.`);
  const tb=b.reduce((a,c)=>a+c,0),tg=g.reduce((a,c)=>a+c,0);return mc(`How many more ${tb>tg?'boys':'girls'} than ${tb>tg?'girls':'boys'} answered the survey?${fig}`,Math.abs(tb-tg),[tb+tg,tb,tg,Math.abs(tb-tg)+2],`Boys total: ${b.join(' + ')} = ${tb}. Girls total: ${g.join(' + ')} = ${tg}. Difference: ${Math.abs(tb-tg)}.`)}
 const years=pick([['2019','2020','2021','2022','2023'],['Jan','Feb','Mar','Apr','May'],['Week 1','Week 2','Week 3','Week 4','Week 5']]);let v=R(10,25);const vals=years.map((_,i)=>{if(i)v=Math.max(3,Math.min(40,v+pick([-9,-7,-5,-3,-2,2,3,4,6,8,10])));return v});const diffs=vals.slice(1).map((x,i)=>Math.abs(x-vals[i]));if(new Set(diffs).size<4)return this.gen();const fig=svgLine(years,vals,years[0].includes('Week')?'Books read each week':years[0].length===4?'Plants sold each year':'Rainy days each month');
 if(t===4){let best=0;for(let i=1;i<vals.length;i++)if(Math.abs(vals[i]-vals[i-1])>Math.abs(vals[best]-vals[best-1]||0))best=i;if(best===0)return this.gen();const others=[1,2,3,4].filter(i=>i!==best);
  return mc(`Between which two ${years[0].includes('Week')?'weeks':years[0].length===4?'years':'months'} was the <b>biggest change</b>?${fig}`,`${years[best-1]} to ${years[best]}`,others.map(i=>`${years[i-1]} to ${years[i]}`),`Look for the steepest segment. From ${years[best-1]} (${vals[best-1]}) to ${years[best]} (${vals[best]}) the change is ${Math.abs(vals[best]-vals[best-1])}, larger than any other.`)}
 const i=R(1,4);const d=vals[i]-vals[i-1];return mc(`How did the value change from ${years[i-1]} to ${years[i]}?${fig}`,d===0?'It stayed the same':`It ${d>0?'increased':'decreased'} by ${Math.abs(d)}`,[`It ${d>0?'decreased':'increased'} by ${Math.abs(d)||1}`,`It ${d>=0?'increased':'decreased'} by ${Math.abs(d)+2}`,'It stayed the same',`It ${d>0?'increased':'decreased'} by ${vals[i]}`].filter(x=>x!==(d===0?'It stayed the same':`It ${d>0?'increased':'decreased'} by ${Math.abs(d)}`)),`${years[i-1]}: ${vals[i-1]}. ${years[i]}: ${vals[i]}. ${vals[i]} − ${vals[i-1]} = ${d}.`)}};

T.s_plots={t:'Line Plots, Histograms & Circle Graphs',cat:'data',lesson:`
<p>A <b>line plot</b> (dot plot) puts an X above a number line for each data value. Count the X's to answer questions.</p>
${svgDot(1,7,[0,2,1,1,0,3,2],'Hours spent playing video games','Days of week')}
<p>Here 9 people answered (count all X's). The mode is 6 hours (most X's). Three people played 6 hours.</p>
<p>A <b>histogram</b> looks like a bar graph, but the bars touch and each bar covers a <em>range</em> of numbers (60–65, 65–70…). It shows how many values fall in each interval.</p>
<p>A <b>circle graph</b> (pie chart) shows parts of a whole as percents that add to 100%. To find a count, multiply the percent by the total: 20% of 80 people = 16 people.</p>
${svgPie(['Yosemite','Yellowstone','Grand Canyon','Zion'],[60,20,10,10],'Favorite national parks')}
<p>A <b>pictograph</b> uses symbols; check the key (each ★ = 5 students, a half ★ = 2½).</p>
${tip('In a line plot, the total number of data points is the number of X\'s, not the number of different values on the line.')}`,
gen(){const t=R(1,5);
 if(t<=2){const lo=pick([0,1,2]),hi=lo+R(5,7);const counts=Array.from({length:hi-lo+1},()=>pick([0,0,1,1,2,2,3,4]));const tot=counts.reduce((a,b)=>a+b,0);if(tot<6)return this.gen();const ds=pick([['Books read over the summer','Number of books'],['Pets per family','Number of pets'],['Goals scored this season','Number of goals']]);const fig=svgDot(lo,hi,counts,ds[0],ds[1]);
  if(t===1)return mc(`How many people are represented in the line plot?${fig}`,tot,[hi-lo+1,counts.filter(c=>c).length,tot+1,Math.max(...counts)],`Count every X: ${counts.filter(c=>c).join(' + ')} = ${tot}.`);
  const mx=Math.max(...counts);const modes=counts.map((c,i)=>c===mx?lo+i:null).filter(x=>x!==null);if(modes.length>1)return this.gen();const v=R(lo,hi);const atLeast=counts.slice(v-lo).reduce((a,b)=>a+b,0);const kind=pick(['mode','atleast']);
  if(kind==='mode')return mc(`What is the mode of the data?${fig}`,modes[0],[mx,tot,lo+counts.indexOf(Math.min(...counts.filter(c=>c))),modes[0]+1],`The mode is the value with the most X's: ${modes[0]} (it has ${mx} X's).`);
  return mc(`How many people had ${v} or more?${fig}`,atLeast,[counts[v-lo],tot-atLeast,atLeast+1,tot],`Count the X's at ${v} and everything to the right: ${atLeast}.`)}
 if(t===3){const ds=pick([{t:'Favorite lunch',c:['Pizza','Tacos','Salad','Soup']},{t:'After-school activity',c:['Reading','Sports','Music','Games']},{t:'How students get to school',c:['Bus','Walk','Bike','Car']}]);const labs=ds.c;let p=[R(3,6)*5,R(2,5)*5,R(1,4)*5];const last=100-p[0]-p[1]-p[2];if(last<5||last>60)return this.gen();p.push(last);const tot=pick([20,40,60,80,100,200]);const i=R(0,3);const ans=tot*p[i]/100;const fig=svgPie(labs,p,ds.t);
  return mc(`${tot} students were surveyed. How many chose ${labs[i]}?${fig}`,ans,[p[i],tot-ans,ans*2,Math.round(ans/2)],`${p[i]}% of ${tot} = ${p[i]/100} × ${tot} = ${ans} students.`)}
 if(t===4){const starts=[60,65,70,75,80,85];const counts=starts.map(()=>R(1,9));if(new Set(counts).size<4)return this.gen();const fig=svgBar(starts.map(s=>`${s}–${s+5}`),counts,'Heights of trees (feet)');const i=R(0,5);const kind=pick(['one','two','total']);
  if(kind==='one')return mc(`How many trees are between ${starts[i]} and ${starts[i]+5} feet tall?${fig}`,counts[i],[counts[(i+1)%6],counts[i]+1,starts[i],counts[i]-1],`Find the bar labeled ${starts[i]}–${starts[i]+5} and read its height: ${counts[i]}.`);
  if(kind==='two'){const j=Math.min(i+1,5),ii=j===i?i-1:i;const s=counts[ii]+counts[j];return mc(`How many trees are between ${starts[ii]} and ${starts[j]+5} feet tall?${fig}`,s,[counts[ii],counts[j],s+2,s-1],`Add the two bars: ${counts[ii]} + ${counts[j]} = ${s}.`)}
  const tot=counts.reduce((a,b)=>a+b,0);return mc(`How many trees were measured in all?${fig}`,tot,[tot-counts[0],6,tot+3,Math.max(...counts)],`Add every bar: ${counts.join(' + ')} = ${tot}.`)}
 const per=pick([2,4,10]);const labs=pick([['Class A','Class B','Class C'],['Mon','Tue','Wed'],['Team 1','Team 2','Team 3']]);const cnt=labs.map(()=>R(2,6));const half=pick([0,1,2]);const rows=labs.map((l,i)=>[l,'★'.repeat(cnt[i])+(i===half?'<span class="halfstar">★</span>':'')]);const i=R(0,2);const v=cnt[i]*per+(i===half?per/2:0);
 return mc(`In this pictograph, each ★ = ${per} books (a half-star = ${per/2}). How many books did ${labs[i]} read?${table(['','Books read'],rows)}`,v,[cnt[i],v+per,v-per/2,cnt[i]*per*2],`${labs[i]} has ${cnt[i]} full star${cnt[i]>1?'s':''}${i===half?' and a half-star':''}: ${cnt[i]} × ${per}${i===half?' + '+per/2:''} = ${v}.`)}};

T.s_interpret={t:'Choosing & Interpreting Data Displays',cat:'data',lesson:`
<p>The right graph depends on the data:</p>
${table(['You want to show…','Best display'],[['how a value changes over time','line graph'],['comparing counts of categories (words)','bar graph'],['parts of a whole (percents)','circle graph'],['how often each number appears','line plot'],['how many values fall in each range','histogram'],['whether two things are related (height vs. weight)','scatter plot']])}
<p><b>Describing a set of data</b>: the <em>center</em> (mean or median), the <em>spread</em> (range), and unusual features like an <b>outlier</b> (a value far from the rest) or a <b>gap</b>.</p>
<p>An outlier pulls the <b>mean</b> a lot but barely moves the <b>median</b>. Scores 80, 82, 85, 88, 10: the median (82) describes the typical score better than the mean (69).</p>
<p><b>Reading tables</b>: find the right row AND the right column. Check totals by adding across or down.</p>
${tip('When a question says "about" or "approximately," estimate from the graph instead of trying to be exact.')}`,
gen(){const t=R(1,5);
 if(t===1){const forms=[
  ['the temperature every hour during one day','Line graph'],['the number of students who chose each favorite color','Bar graph'],['what fraction of a budget is spent on each category','Circle graph'],['how many students got each score on a 10-question quiz','Line plot'],['the number of trees whose heights fall into 5-foot ranges','Histogram'],['how a puppy\'s weight changed each month for a year','Line graph'],['the percent of each type of pet owned by a class','Circle graph'],['the number of books read by each of 5 classes','Bar graph']];const f=pick(forms);
  return mc(`Which type of graph is <b>best</b> for showing ${f[0]}?`,f[1],['Line graph','Bar graph','Circle graph','Line plot','Histogram'].filter(x=>x!==f[1]),`${f[1]}s are best for this kind of data. ${f[1]==='Line graph'?'Line graphs show change over time.':f[1]==='Bar graph'?'Bar graphs compare counts across categories.':f[1]==='Circle graph'?'Circle graphs show parts of a whole.':f[1]==='Line plot'?'Line plots show how often each value occurs.':'Histograms show how many values fall in each interval.'}`)}
 if(t===2){const s=[R(78,84),R(85,90),R(86,92),R(90,96)];const out=pick([12,15,20,25]);const all=[...s,out];const sum=all.reduce((a,b)=>a+b,0);const mean=Math.round(sum/5);const med=all.slice().sort((a,b)=>a-b)[2];
  return mc(`${nm()}'s quiz scores are ${shuf(all).join(', ')}. Which statement is true?`,'The median describes the typical score better than the mean, because the score of '+out+' is an outlier.',['The mean describes the typical score better, because it uses every score.','The mode is the best measure of center here.','The range is small, so the scores are all similar.'],`The score of ${out} is far from the others: an outlier. It drags the mean down to about ${mean}, while the median stays at ${med}, close to most of the scores.`)}
 if(t===3){const rows=[['Grade 4',R(10,30),R(10,30)],['Grade 5',R(10,30),R(10,30)],['Grade 6',R(10,30),R(10,30)]];const i=R(0,2);const kind=pick(['row','col','diff']);const fig=table(['','Chose pizza','Chose tacos'],rows);
  if(kind==='row')return mc(`How many students in ${rows[i][0]} were surveyed in all?${fig}`,rows[i][1]+rows[i][2],[rows[i][1],rows[i][2],Math.abs(rows[i][1]-rows[i][2]),rows[i][1]+rows[i][2]+5],`Add across the ${rows[i][0]} row: ${rows[i][1]} + ${rows[i][2]} = ${rows[i][1]+rows[i][2]}.`);
  if(kind==='col'){const c=pick([1,2]);const s=rows.reduce((a,r)=>a+r[c],0);return mc(`How many students altogether chose ${c===1?'pizza':'tacos'}?${fig}`,s,[rows.reduce((a,r)=>a+r[3-c],0),s-rows[0][c],s+10,rows[0][c]],`Add down the "${c===1?'Chose pizza':'Chose tacos'}" column: ${rows.map(r=>r[c]).join(' + ')} = ${s}.`)}
  const d=Math.abs(rows[i][1]-rows[i][2]);if(!d)return this.gen();return mc(`In ${rows[i][0]}, how many more students chose ${rows[i][1]>rows[i][2]?'pizza':'tacos'} than ${rows[i][1]>rows[i][2]?'tacos':'pizza'}?${fig}`,d,[rows[i][1]+rows[i][2],d+2,rows[i][1],rows[i][2]],`In the ${rows[i][0]} row: ${Math.max(rows[i][1],rows[i][2])} − ${Math.min(rows[i][1],rows[i][2])} = ${d}.`)}
 if(t===4){const up=pick([true,false]);const pts=[];
  for(let k=0;k<10;k++){const base=up?4+k*1.7:20-k*1.7;pts.push([k+1,Math.max(1,Math.round(base+R(-2,2)))])}
  const fig=svgScatter(pts,up?'Study time and test scores':'TV time and test scores',up?'Hours studied':'Hours of TV','Test score');
  const ans=up?'A positive relationship: more hours goes with higher scores':'A negative relationship: more hours goes with lower scores';
  return mc(`What does this scatter plot show?${fig}`,ans,[up?'A negative relationship: more hours goes with lower scores':'A positive relationship: more hours goes with higher scores','No relationship at all between the two','The two amounts are always equal','Every student scored the same'],`Each dot is one student. The dots ${up?'rise':'fall'} from left to right, so as the hours go up the score goes ${up?'up':'down'} too. That is a <b>${up?'positive':'negative'}</b> relationship.`)}
 const forms=[

  {q:'A histogram of test scores has a tall bar in the middle and short bars on both ends. How would you describe the data?',a:'Symmetric, with most scores near the middle',w:['Skewed, with most scores very high','Skewed, with most scores very low','It has no center'],e:'A tall middle with matching short sides is a symmetric (bell-shaped) distribution.'},
  {q:'In a data set of shoe sizes, every value is between 5 and 8 except one value of 13. What is the 13 called?',a:'An outlier',w:['The mode','The median','A gap'],e:'A value far away from the rest of the data is an outlier.'},
  {q:'A line graph of a plant\'s height goes up steeply, then becomes nearly flat. What happened?',a:'The plant grew quickly, then almost stopped growing',w:['The plant shrank','The plant grew at a steady rate the whole time','The plant grew faster at the end'],e:'A steep line means fast change; a flat line means little or no change.'}];const f=pick(forms);return mc(f.q,f.a,f.w,f.e)}};

// ===== PROBABILITY =====
T.p_basic={t:'Basic Probability',cat:'prob',lesson:`
<p><b>Probability</b> measures how likely something is, from 0 (impossible) to 1 (certain).</p>
<p style="text-align:center">P(event) = ${fr('number of favorable outcomes','total number of outcomes')}</p>
${ex('A closet has 4 red, 5 pink, 2 blue, 4 white, and 1 black shirt. P(white)?','16 shirts in all, 4 white: '+fr(4,16)+' = <b>'+fr(1,4)+'</b>.')}
<p>Probability can be written as a fraction, decimal, or percent: ${fr(1,4)} = 0.25 = 25%.</p>
${table(['Probability','Words'],[['0','impossible'],['close to 0 (like 1/10)','unlikely'],['1/2','equally likely (even chance)'],['close to 1 (like 9/10)','likely'],['1','certain']])}
<p><b>P(not)</b> = 1 − P(event). If P(rain) = 30%, then P(no rain) = 70%.</p>
${tip('Always count the TOTAL first, including the group you are asking about. Then simplify the fraction.')}`,
gen(){const t=R(1,5);
 if(t===1){const cols=shuf(['red','blue','green','yellow','white']).slice(0,3);const cnt=cols.map(()=>R(1,7));const tot=cnt.reduce((a,b)=>a+b,0);const i=R(0,2);const item=pick(['marbles','socks','cards','buttons']);
  return mc(`A bag has ${cnt.map((c,k)=>c+' '+cols[k]).join(', ')} ${item}. If one is picked without looking, what is the probability it is ${cols[i]}?`,frS(cnt[i],tot),[fr(cnt[i],tot-cnt[i]),frS(tot-cnt[i],tot),fr(1,cnt[i]),fr(tot,cnt[i]),frS(cnt[i]+1,tot)],`Total ${item}: ${cnt.join(' + ')} = ${tot}. ${cols[i][0].toUpperCase()+cols[i].slice(1)}: ${cnt[i]}. P = ${fr(cnt[i],tot)}${frS(cnt[i],tot)!==fr(cnt[i],tot)?' = '+frS(cnt[i],tot):''}.`)}
 if(t===2){const n=pick([4,5,6,8]);const secs=Array.from({length:n},(_,i)=>i+1);const kind=pick(['one','even','gt']);const fig=spinnerSVG(secs);
  if(kind==='one'){const v=R(1,n);return mc(`The spinner has ${n} equal sections. What is the probability of landing on ${v}?${fig}`,fr(1,n),[fr(v,n),fr(1,n-1),fr(1,n+1),fr(n-1,n)].filter(x=>x!==fr(1,n)),`There are ${n} equal sections and one of them is ${v}: P = ${fr(1,n)}.`)}
  if(kind==='even'){const ev=secs.filter(x=>x%2===0).length;return mc(`The spinner has ${n} equal sections numbered 1 to ${n}. What is the probability of landing on an <b>even</b> number?${fig}`,frS(ev,n),[fr(1,n),frS(ev+1,n),frS(ev-1,n),fr(n,ev),fr(1,ev)],`Even numbers: ${secs.filter(x=>x%2===0).join(', ')}. That is ${ev} out of ${n}: ${fr(ev,n)}${frS(ev,n)!==fr(ev,n)?' = '+frS(ev,n):''}.`)}
  const k=R(1,n-1);const g=n-k;if(g===k)return this.gen();return mc(`The spinner has ${n} equal sections numbered 1 to ${n}. What is the probability of landing on a number <b>greater than ${k}</b>?${fig}`,frS(g,n),[frS(k,n),fr(1,n),frS(g+1,n),frS(g-1,n),fr(n,g)],`Numbers greater than ${k}: ${secs.filter(x=>x>k).join(', ')}. That is ${g} out of ${n}: ${frS(g,n)}.`)}
 if(t===3){const forms=[
  ['rolling a number less than 7 on a standard die','certain'],['rolling a 7 on a standard die','impossible'],['flipping heads on a fair coin','equally likely as not'],['picking a red marble from a bag with 9 red and 1 blue','likely'],['picking a blue marble from a bag with 9 red and 1 blue','unlikely'],['the sun rising tomorrow','certain'],['drawing a heart from a deck of cards with 4 equal suits','unlikely'],['spinning an even number on a spinner numbered 1 to 4','equally likely as not']];const f=pick(forms);
  return mc(`How would you describe the probability of <b>${f[0]}</b>?`,f[1],['certain','impossible','likely','unlikely','equally likely as not'].filter(x=>x!==f[1]),`${f[0][0].toUpperCase()+f[0].slice(1)} is ${f[1]}. ${f[1]==='certain'?'It will always happen: probability 1.':f[1]==='impossible'?'It can never happen: probability 0.':f[1]==='equally likely as not'?'The probability is exactly 1/2.':f[1]==='likely'?'The probability is close to 1.':'The probability is close to 0.'}`)}
 if(t===4){const p=pick([10,20,25,30,40,60,70,75,80,90]);return mc(`The weather report says there is a ${p}% chance of rain tomorrow. What is the chance it will <b>not</b> rain?`,(100-p)+'%',[p+'%',(100-p/2)+'%',(50-p/2>0?50-p/2:p/2)+'%',(100-p+10)+'%'],`P(not rain) = 100% − ${p}% = ${100-p}%. The two possibilities always add to 100%.`)}
 const tot=pick([8,10,20,25,50]);const k=R(1,tot-1);const [sn,sd]=simp(k,tot);const decv=k/tot;
 return mc(`A raffle has ${tot} tickets and ${nm()} bought ${k} of them. Written as a decimal, what is the probability ${nm()} wins?`,String(decv),[String(Math.round(k/(tot-k)*100)/100),String(k),String(Math.round((tot-k)/tot*100)/100),String(decv*10)],`${fr(k,tot)} = ${k} ÷ ${tot} = ${decv}.`)}};

T.p_compound={t:'Compound Events',cat:'prob',lesson:`
<p>A <b>compound event</b> combines two or more events, like flipping a coin AND rolling a die.</p>
<p><b>Independent events</b> do not affect each other. To find the probability of both happening, <b>multiply</b>.</p>
${ex('P(heads AND rolling a 2)',fr(1,2)+' × '+fr(1,6)+' = <b>'+fr(1,12)+'</b>')}
<p>You can also list the <b>sample space</b> (all outcomes). Coin + die: H1, H2, H3, H4, H5, H6, T1, T2 … 12 outcomes, and only 1 is "H2."</p>
<p><b>Dependent events</b> change the probabilities. Picking two marbles <em>without replacing</em> the first: a bag has 5 black and 5 white. P(black first) = ${fr(5,10)}. Now only 9 marbles are left, 4 black: P(black second) = ${fr(4,9)}. P(both black) = ${fr(5,10)} × ${fr(4,9)} = ${fr(20,90)} = <b>${fr(2,9)}</b>.</p>
${tip('"With replacement" → the second pick has the same probability as the first. "Without replacement" → subtract one from the total (and from the group, if the first pick came from that group).')}`,
gen(){const t=R(1,4);
 if(t===1){const n=pick([4,6,8]);const v=R(1,n);const coin=pick(['heads','tails']);return mc(`${nm()} flips a coin and spins a spinner with ${n} equal sections numbered 1 to ${n}. What is the probability of getting <b>${coin}</b> and a <b>${v}</b>?`,fr(1,2*n),[fr(1,n),fr(1,n+2),fr(2,n),fr(1,2)].filter(x=>x!==fr(1,2*n)),`Independent events: multiply. P(${coin}) = ${fr(1,2)}, P(${v}) = ${fr(1,n)}. ${fr(1,2)} × ${fr(1,n)} = ${fr(1,2*n)}.`)}
 if(t===2){const a=R(1,6),b=R(1,6);const [sn,sd]=simp(a*b,36);return mc(`Two standard dice are rolled. What is the probability of rolling a ${a} on the first die and a ${b} on the second?`,fr(1,36),[fr(2,36),fr(1,12),fr(1,6),fr(2,6)],`Each die has 6 faces, so there are 6 × 6 = 36 equally likely outcomes. Only one is (${a}, ${b}): ${fr(1,36)}.`)}
 if(t===3){const c1=pick(['red','blue','green']),c2=pick(['white','yellow','black']);const a=R(2,5),b=R(2,5);const tot=a+b;const [sn,sd]=simp(a*(a-1),tot*(tot-1));
  return mc(`A bag has ${a} ${c1} marbles and ${b} ${c2} marbles. ${nm()} takes one marble, keeps it, then takes another. What is the probability that <b>both</b> are ${c1}?`,fr(sn,sd),[frS(a*a,tot*tot),frS(a,tot),frS(a*(a-1),tot*tot),frS(2*a,tot)].filter(x=>x!==fr(sn,sd)),`First pick: ${fr(a,tot)}. Now ${tot-1} marbles are left, ${a-1} of them ${c1}: ${fr(a-1,tot-1)}. Multiply: ${fr(a,tot)} × ${fr(a-1,tot-1)} = ${fr(a*(a-1),tot*(tot-1))} = ${fr(sn,sd)}.`)}
 const c1=pick(['red','blue','green']),c2=pick(['white','yellow','black']);const a=R(2,5),b=R(2,5);const tot=a+b;const [sn,sd]=simp(a*a,tot*tot);
 return mc(`A bag has ${a} ${c1} marbles and ${b} ${c2} marbles. ${nm()} picks one marble, <b>puts it back</b>, and picks again. What is the probability that both picks are ${c1}?`,fr(sn,sd),[frS(a*(a-1),tot*(tot-1)),frS(a,tot),frS(2*a,tot),frS(a,tot*tot)].filter(x=>x!==fr(sn,sd)),`With replacement, both picks have the same probability: ${fr(a,tot)}. Multiply: ${fr(a,tot)} × ${fr(a,tot)} = ${fr(a*a,tot*tot)}${fr(sn,sd)!==fr(a*a,tot*tot)?' = '+fr(sn,sd):''}.`)}};

T.p_count={t:'Counting Outcomes',cat:'prob',lesson:`
<p>To count how many outcomes are possible, use the <b>counting principle</b>: multiply the number of choices at each step.</p>
${ex('3 shirts and 4 pairs of pants. How many outfits?','3 × 4 = <b>12</b> outfits.')}
<p>A <b>tree diagram</b> shows every combination as a branch. For a coin flipped twice: H→H, H→T, T→H, T→T = 4 outcomes.</p>
<p><b>Arranging</b> things in order: 3 books on a shelf can go 3 × 2 × 1 = <b>6</b> ways (3 choices for the first spot, 2 for the next, 1 for the last).</p>
<p><b>Choosing pairs</b> where order does not matter: from 4 toppings, pick 2. List them: AB, AC, AD, BC, BD, CD = <b>6</b> pairs. (Not 4 × 3 = 12, because AB and BA are the same pair.)</p>
${tip('Ask yourself: does order matter? Codes and lineups → order matters (multiply). Teams and pairs → order does not matter (list them or divide out the repeats).')}`,
gen(){const t=R(1,5);
 if(t===1){const a=R(2,6),b=R(2,6),c=pick([1,1,2,3]);const items=c===1?`${a} shirts and ${b} pairs of pants`:`${a} shirts, ${b} pairs of pants, and ${c} hats`;const ans=a*b*c;
  return mc(`${nm()} has ${items}. How many different outfits (one of each) can be made?`,ans,[a+b+c,ans+a,ans*2,Math.max(a,b)*2],`Multiply the choices: ${a} × ${b}${c>1?' × '+c:''} = ${ans}.`)}
 if(t===2){const flavors=R(3,6),cones=R(2,4);return mc(`An ice cream shop has ${flavors} flavors and ${cones} kinds of cones. How many different single-scoop cones are possible?`,flavors*cones,[flavors+cones,flavors*cones+cones,flavors,flavors*cones*2],`${flavors} flavors × ${cones} cones = ${flavors*cones} combinations.`)}
 if(t===3){const k=pick([2,3,3,4]);const f=k===2?2:k===3?6:24;return mc(`In how many different orders can ${k} ${pick(['books','runners','photos'])} be arranged in a row?`,f,[k*k,k,f+k,k*2],`${k} choices for the first spot, ${k-1} for the next${k>2?', and so on':''}: ${Array.from({length:k},(_,i)=>k-i).join(' × ')} = ${f}.`)}
 if(t===4){const n=pick([3,4,5]);const pairs=n*(n-1)/2;return mc(`From ${n} friends, how many different <b>pairs</b> can be chosen to be partners?`,pairs,[n*(n-1),n,n+1,pairs+n],`List them: with ${n} people there are ${pairs} different pairs. (${n} × ${n-1} = ${n*(n-1)} counts each pair twice, so divide by 2.)`)}
 const forms=[
  {q:'A coin is flipped 3 times. How many different outcomes are possible?',a:8,w:[6,3,9],e:'2 × 2 × 2 = 8 outcomes (HHH, HHT, HTH, HTT, THH, THT, TTH, TTT).'},
  {q:'A lock code has 2 digits, each from 1 to 5. How many codes are possible?',a:25,w:[10,20,15],e:'5 choices for the first digit × 5 for the second = 25.'},
  {q:'A coin is flipped and a standard die is rolled. How many outcomes are in the sample space?',a:12,w:[8,6,36],e:'2 coin results × 6 die results = 12 outcomes.'},
  {q:'A tree diagram for lunch choices shows 3 sandwiches, each branching into 2 drinks. How many total lunch combinations are there?',a:6,w:[5,3,9],e:'3 × 2 = 6 branches at the end of the tree.'}];const f=pick(forms);return mc(f.q,f.a,f.w,f.e)}};

T.p_predict={t:'Predictions & Experimental Probability',cat:'prob',lesson:`
<p><b>Theoretical probability</b> is what <em>should</em> happen: a fair coin lands heads ${fr(1,2)} of the time.</p>
<p><b>Experimental probability</b> is what <em>did</em> happen: ${fr('times it happened','times you tried')}. Flip 50 times, get 28 heads → ${fr(28,50)} = 56%.</p>
<p>With more trials, experimental results get closer to the theoretical probability.</p>
<p><b>Making predictions</b>: expected number = probability × number of trials.</p>
${ex('A spinner has a 1/4 chance of red. About how many reds in 80 spins?',fr(1,4)+' × 80 = <b>20</b> reds.')}
${ex('In a sample of 25 students, 10 like pizza. Predict how many of 200 students like pizza.',fr(10,25)+' = '+fr(2,5)+'. '+fr(2,5)+' × 200 = <b>80 students</b>.')}
${tip('"About" or "predict" means the answer is an estimate. Set up the fraction from the sample and scale it up to the whole group.')}`,
gen(){const t=R(1,4);
 if(t===1){const trials=pick([20,25,40,50,100]);const hit=R(Math.round(trials*0.2),Math.round(trials*0.7));const col=pick(['red','blue','green']);
  return mc(`A spinner was spun ${trials} times and landed on ${col} ${hit} times. What is the <b>experimental probability</b> of landing on ${col}?`,frS(hit,trials),[frS(trials-hit,trials),fr(hit,trials-hit),fr(1,hit),fr(trials,hit)].filter(x=>x!==frS(hit,trials)),`Experimental probability = ${fr(hit,trials)}${frS(hit,trials)!==fr(hit,trials)?' = '+frS(hit,trials):''}.`)}
 if(t===2){const d=pick([2,4,5,6,8,10]);const trials=d*R(5,15);const ans=trials/d;const thing=d===6?'rolling a 3 on a standard die':d===2?'getting heads on a coin flip':`landing on red on a spinner with ${d} equal sections, one of which is red`;
  return mc(`The probability of ${thing} is ${fr(1,d)}. About how many times would you expect it to happen in ${trials} tries?`,ans,[trials-ans,d,ans*2,trials],`Expected = probability × trials = ${fr(1,d)} × ${trials} = ${ans}.`)}
 if(t===3){const samp=pick([20,25,40,50]);const like=R(4,samp-4);const school=pick([200,300,400,500,600]);const ans=like/samp*school;if(ans!==Math.round(ans))return this.gen();
  return mc(`${nm()} surveyed ${samp} students and found ${like} of them walk to school. Based on this sample, about how many of the school's ${school} students walk to school?`,ans,[like,school-ans,ans+like,Math.round(ans/2)],`${fr(like,samp)} of the sample walk. ${frS(like,samp)} × ${school} = ${ans}.`)}
 const forms=[
  {q:'A fair coin is flipped 10 times and lands heads 7 times. Which statement is true?',a:'The experimental probability (7/10) is different from the theoretical probability (1/2), which can happen with few trials.',w:['The coin must be unfair.','The theoretical probability of heads is now 7/10.','The next flip must be tails.'],e:'Small numbers of trials often differ from the theoretical probability. With many more flips, the results would get closer to 1/2.'},
  {q:'Which experiment would give an experimental probability <b>closest</b> to the theoretical probability?',a:'Rolling a die 600 times',w:['Rolling a die 6 times','Rolling a die 12 times','Rolling a die 30 times'],e:'More trials bring experimental results closer to the theoretical probability.'},
  {q:'A bag has 3 red and 1 blue marble. If you pick a marble 40 times (replacing it each time), about how many times should you get blue?',a:10,w:[30,4,20],e:'P(blue) = 1/4. 1/4 × 40 = 10.'},
  {q:'A spinner is spun 30 times: 12 red, 10 blue, 8 green. Which color has an experimental probability of 1/3?',a:'Blue',w:['Red','Green','None of them'],e:'10/30 = 1/3. Red is 12/30 = 2/5 and green is 8/30 = 4/15.'}];const f=pick(forms);return mc(f.q,f.a,f.w,f.e)}};

// ===== QUANTITATIVE REASONING =====
T.q_sense={t:'Number Sense & Reasonableness',cat:'qr',lesson:`
<p>Quantitative Reasoning questions often ask you to <em>think</em> about numbers rather than compute exactly.</p>
<p><b>Estimation</b>: round to friendly numbers. $435 + 2 × $67 + $12 ≈ 440 + 140 + 10 = $590. Split over 4 months ≈ $147.50 each. If your exact answer is $145.25, it is reasonable.</p>
<p><b>Reasonableness</b>: Lisa got 24 out of 32 right. A student computes 32 ÷ 24 = 133%. Impossible! A percent correct cannot exceed 100%. The right answer is 24 ÷ 32 = 75%.</p>
<p><b>Number properties</b>: even + even = even; odd + odd = even; even + odd = odd. Even × anything = even. Multiplying by a number less than 1 makes it <em>smaller</em>; dividing by a number less than 1 makes it <em>bigger</em>.</p>
<p><b>Commutative</b> (order): 3 + 5 = 5 + 3. <b>Associative</b> (grouping): (47 + 25) + 3 = 47 + (25 + 3). <b>Distributive</b>: 3 × (18 + 2) = 3 × 18 + 3 × 2.</p>
${tip('Before picking an answer, ask: "Does this make sense?" Half a car cannot be on a bridge; you cannot have 5.5 buses. Round up or down based on the situation.')}`,
gen(){const t=R(1,5);
 if(t===1){const forms=[
  {q:'Which of these sums is an <b>odd</b> number?',a:'Even + odd',w:['Even + even','Odd + odd','Even × odd'],e:'Only an even plus an odd gives an odd result. Even + even, odd + odd, and even × anything are all even.'},
  {q:'A number is multiplied by ½. What happens to it?',a:'It becomes half as large',w:['It doubles','It stays the same','It becomes 2 more'],e:'Multiplying by a number less than 1 makes the result smaller. × ½ gives half.'},
  {q:'12 is divided by ¼. Which is true about the answer?',a:'It is greater than 12',w:['It is less than 12','It equals 3','It equals 12'],e:'Dividing by a fraction less than 1 gives a bigger number: 12 ÷ ¼ = 48.'},
  {q:'Which expression shows the <b>distributive</b> property?',a:'4 × (3 + 2) = 4 × 3 + 4 × 2',w:['4 + 3 = 3 + 4','(4 × 3) × 2 = 4 × (3 × 2)','4 × 1 = 4'],e:'The distributive property multiplies each part inside the parentheses by the number outside.'},
  {q:'Which shows the <b>commutative</b> property of addition?',a:'7 + 9 = 9 + 7',w:['7 + 0 = 7','(7 + 9) + 1 = 7 + (9 + 1)','7 × 1 = 7'],e:'Commutative means the order can switch without changing the sum.'},
  {q:'Which shows the <b>associative</b> property?',a:'(6 + 4) + 9 = 6 + (4 + 9)',w:['6 + 4 = 4 + 6','6 × 1 = 6','6 × (4 + 9) = 6 × 4 + 6 × 9'],e:'Associative means the grouping can change without changing the answer. The order of the numbers stays the same; only the parentheses move.'},
  {q:'Which shows the <b>identity</b> property of multiplication?',a:'8 × 1 = 8',w:['8 + 0 = 8','8 × 0 = 0','8 × 2 = 2 × 8'],e:'The identity property says a number keeps its value: multiplying by 1 (or adding 0) leaves it unchanged.'},
  {q:'Which shows the <b>identity</b> property of addition?',a:'12 + 0 = 12',w:['12 × 1 = 12','12 − 12 = 0','12 + 3 = 3 + 12'],e:'Adding zero does not change a number, so zero is the identity for addition.'},
  {q:'Which property is shown by <b>(2 × 5) × 3 = 2 × (5 × 3)</b>?',a:'Associative',w:['Commutative','Distributive','Identity'],e:'Only the grouping changed, so this is the associative property of multiplication.'},
  {q:'Which property is shown by <b>15 + 0 = 15</b>?',a:'Identity',w:['Commutative','Associative','Distributive'],e:'Adding zero leaves the number unchanged: the identity property of addition.'},
  {q:'Which product is <b>even</b>?',a:'6 × 7',w:['5 × 7','3 × 9','7 × 11'],e:'Any number multiplied by an even number is even. 6 × 7 = 42.'}];const f=pick(forms);return mc(f.q,f.a,f.w,f.e)}
 if(t===2){const a=R(21,49),b=R(11,29);const p=a*b;const opts=[p,p+a*10,p-a*10,p*10];const ea=Math.round(a/10)*10,eb=Math.round(b/10)*10;
  return mc(`Which is closest to the value of ${a} × ${b}? Use estimation.`,fmt(p),opts.slice(1).map(fmt),`Estimate: ${ea} × ${eb} = ${fmt(ea*eb)}. The only choice near that is ${fmt(p)}.`)}
 if(t===3){const tot=R(20,40),right=R(10,tot-2);const pct=Math.round(right/tot*100);const forms=[
  {q:`${nm()} got ${right} out of ${tot} questions right and calculated a score of ${Math.round(tot/right*100)}%. Is this reasonable?`,a:`No. A score cannot be over 100%. The correct score is about ${pct}%.`,w:['Yes, the calculation is correct.','No, the score should be exactly 50%.','Yes, because the test had many questions.'],e:`Getting every question right would be 100%, so ${Math.round(tot/right*100)}% is impossible. ${right} ÷ ${tot} ≈ ${pct}%.`}];const f=forms[0];return mc(f.q,f.a,f.w,f.e)}
 if(t===4){const cap=pick([4000,3000,5000]);const lim=cap*R(4,9)+R(500,cap-500);const q=Math.floor(lim/cap);
  return mc(`A bridge can hold at most ${fmt(lim)} pounds. Each truck weighs ${fmt(cap)} pounds. What is the greatest number of trucks that can be on the bridge at once?`,q,[q+1,Math.round(lim/cap*10)/10,q-1,Math.round(lim/1000)],`${fmt(lim)} ÷ ${fmt(cap)} = ${(lim/cap).toFixed(1)}. You cannot have part of a truck, and ${q+1} trucks would be too heavy, so round <b>down</b> to ${q}.`)}
 const items=[R(300,500),R(50,90),R(50,90),R(8,20)];const tot=items[0]+2*items[1]+items[3];const months=4;const est=Math.round(items[0]/10)*10+2*Math.round(items[1]/10)*10+Math.round(items[3]/10)*10;
 const pay=Math.round(est/4);
 return mc(`A stereo costs $${items[0]}, two speakers cost $${items[1]} each, and cables cost $${items[3]}. The total is split into 4 equal monthly payments. Which is the <b>best estimate</b> of one payment?`,money(pay),[money(pay*4),money(Math.round(pay/2)),money(pay+50),money(pay*2)],`Round each price to the nearest ten: ${Math.round(items[0]/10)*10} + 2 × ${Math.round(items[1]/10)*10} + ${Math.round(items[3]/10)*10} ≈ $${est}. Divide by 4 and round: about ${money(pay)}. (The exact payment is ${money(tot/4)}, so the estimate is close.)`)}};

T.q_logic={t:'Logic & Reasoning Puzzles',cat:'qr',lesson:`
<p>Some questions test how you <em>reason</em> rather than calculate.</p>
<p><b>Ordering clues</b>: "Ava is taller than Ben. Ben is taller than Cal." → Ava &gt; Ben &gt; Cal. Draw a quick line and place the names.</p>
<p><b>Always / sometimes / never</b>: test the statement with several examples, including tricky ones like 0, 1, and fractions. "A square is a rectangle" → <b>always</b>. "A rectangle is a square" → <b>sometimes</b>. "An odd number is even" → <b>never</b>.</p>
<p><b>Balance puzzles</b>: if 2 apples weigh the same as 6 plums, then 1 apple = 3 plums. Divide both sides equally.</p>
<p><b>Overlap (Venn) problems</b>: 25 students; 15 like dogs, 14 like cats, 6 like both. Only dogs: 15 − 6 = 9. Only cats: 14 − 6 = 8. Neither: 25 − 9 − 8 − 6 = 2.</p>
${tip('Turn words into a picture: a number line for ordering, circles for overlap, a scale for balance. The picture does the thinking for you.')}`,
gen(){const t=R(1,5);
 if(t===1){const names=shuf(NAMES).slice(0,4);const [a,b,c,d]=names;const kind=pick(['tallest','shortest','second']);const q=`${a} is taller than ${b}. ${c} is shorter than ${b}. ${d} is taller than ${a}. `;
  if(kind==='tallest')return mc(q+'Who is the <b>tallest</b>?',d,[a,b,c],`Order from tallest: ${d} > ${a} > ${b} > ${c}. ${d} is tallest.`);
  if(kind==='shortest')return mc(q+'Who is the <b>shortest</b>?',c,[a,b,d],`Order from tallest: ${d} > ${a} > ${b} > ${c}. ${c} is shortest.`);
  return mc(q+'Who is the <b>second tallest</b>?',a,[b,c,d],`Order from tallest: ${d} > ${a} > ${b} > ${c}. ${a} is second tallest.`)}
 if(t===2){const forms=[
